<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Asiye · Driver Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at 20% 10%, #1a1a2e, #0b0b12 80%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: -30%;
      left: -20%;
      width: 80%;
      height: 80%;
      background: radial-gradient(circle, rgba(123, 156, 255, 0.12) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      bottom: -25%;
      right: -15%;
      width: 70%;
      height: 70%;
      background: radial-gradient(circle, rgba(180, 130, 255, 0.08) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: rgba(18, 18, 24, 0.8);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: linear-gradient(145deg, rgba(28, 28, 34, 0.9) 0%, rgba(20, 20, 26, 0.95) 100%);
      border-radius: 48px;
      padding: 40px 28px 36px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .storm-logo-section {
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .storm-shield {
      position: relative;
      width: 130px;
      height: 130px;
      margin-bottom: 18px;
    }

    .storm-cloud-layer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 200deg, rgba(123, 156, 255, 0.2), rgba(100, 120, 255, 0.05), rgba(180, 160, 255, 0.2), rgba(123, 156, 255, 0.1));
      animation: softPulse 4s infinite alternate;
      filter: blur(10px);
      z-index: 0;
    }

    @keyframes softPulse {
      0% { opacity: 0.5; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1.04); }
    }

    .storm-shade {
      position: absolute;
      inset: 8px;
      background: radial-gradient(circle at 30% 30%, rgba(20, 20, 30, 0.8), #0b0b14);
      border-radius: 50%;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8);
      z-index: 1;
    }

    .lightning-flicker {
      position: absolute;
      top: 15%;
      left: 25%;
      width: 40%;
      height: 40%;
      background: radial-gradient(circle, rgba(255, 255, 200, 0.25) 0%, transparent 70%);
      filter: blur(8px);
      z-index: 2;
      animation: flicker 3s infinite;
    }

    @keyframes flicker {
      0%, 90%, 100% { opacity: 0.2; }
      95% { opacity: 0.8; }
    }

    .storm-droplet {
      position: absolute;
      background: rgba(200, 210, 255, 0.35);
      border-radius: 50%;
      filter: blur(2px);
      z-index: 3;
      animation: rainDrop 2.8s infinite ease-in;
    }

    @keyframes rainDrop {
      0% { transform: translateY(0); opacity: 0.7; }
      100% { transform: translateY(12px); opacity: 0; }
    }

    .storm-core {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-circle-wrapper {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .storm-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
      display: block;
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: linear-gradient(to right, #cbd5ff, #8fa7ff, #b8a9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-top: 6px;
      text-transform: lowercase;
      font-style: italic;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #a9a9c0;
      margin-bottom: 8px;
      margin-left: 16px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .phone-input-wrap {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .prefix {
      background: rgba(44, 44, 52, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 15px 18px;
      font-weight: 600;
      color: #e0e0ff;
      font-size: 1rem;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
      white-space: nowrap;
    }

    .modern-input {
      width: 100%;
      padding: 16px 22px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      background: rgba(30, 30, 38, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      outline: none;
      font-size: 1rem;
      font-weight: 500;
      transition: all 0.25s ease;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.4);
    }

    .modern-input:focus {
      border-color: #7b9cff;
      background: rgba(35, 35, 45, 0.9);
      box-shadow: 0 0 20px rgba(123, 156, 255, 0.25), inset 0 1px 3px rgba(0,0,0,0.5);
    }

    .modern-input::placeholder {
      color: #6b6b7a;
      font-weight: 400;
    }

    .main-btn {
      width: 100%;
      padding: 18px;
      background: linear-gradient(105deg, #7b9cff 0%, #5f7eff 100%);
      color: #fff;
      border: none;
      border-radius: 34px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.3px;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.25s ease;
      box-shadow: 0 12px 28px rgba(90, 120, 255, 0.4), 0 4px 10px rgba(0,0,0,0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      position: relative;
      overflow: hidden;
    }

    .main-btn::after {
      content: "";
      position: absolute;
      top: -50%;
      left: -60%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .main-btn:hover::after {
      opacity: 0.5;
    }

    .main-btn:active {
      transform: scale(0.97);
      box-shadow: 0 6px 18px rgba(90, 120, 255, 0.6);
    }

    .main-btn:disabled {
      opacity: 0.7;
      transform: none;
      pointer-events: none;
      filter: grayscale(20%);
    }

    .main-btn.secondary {
      background: rgba(44, 44, 52, 0.8);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      margin-top: 8px;
      font-size: 0.95rem;
    }

    .main-btn.secondary:hover {
      background: rgba(60, 60, 70, 0.9);
    }

    .back-link {
      margin-top: 28px;
      display: inline-block;
      color: #a0a0c0;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }

    .back-link:hover {
      color: #cfd7ff;
      border-color: #7b9cff;
    }

    .toast {
      position: fixed;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 30, 35, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 70, 70, 0.5);
      color: #ffb3b3;
      padding: 14px 28px;
      border-radius: 40px;
      display: none;
      z-index: 1000;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 60, 60, 0.3);
      letter-spacing: 0.2px;
      max-width: 90%;
    }

    .toast.success {
      border-color: rgba(70, 255, 70, 0.5);
      color: #b3ffb3;
    }

    .toast.warning {
      border-color: rgba(255, 200, 70, 0.5);
      color: #ffdbb3;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0 15px;
      color: #4a4a5a;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .divider::before {
      margin-right: 16px;
    }
    .divider::after {
      margin-left: 16px;
    }

    .status-box {
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      padding: 12px 16px;
      margin: 10px 0;
      font-size: 0.8rem;
      color: #a0a0c0;
      display: none;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .status-box .spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .status-box.success {
      border-color: rgba(70, 255, 70, 0.3);
      color: #b3ffb3;
      display: block;
    }

    .status-box.error {
      border-color: rgba(255, 70, 70, 0.3);
      color: #ffb3b3;
      display: block;
    }

    .status-box.info {
      border-color: rgba(70, 150, 255, 0.3);
      color: #b3d4ff;
      display: block;
    }

    .reg-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      z-index: 1000; display: none; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;
    }
    .reg-modal-overlay.open { display: flex; opacity: 1; }
    
    .reg-card {
      background: linear-gradient(145deg, rgba(28, 28, 34, 0.95), rgba(20, 20, 26, 0.98));
      border-radius: 30px; padding: 35px 25px; width: 90%; max-width: 420px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1);
      transform: translateY(20px); transition: transform 0.3s ease; text-align: center;
      position: relative;
    }
    .reg-modal-overlay.open .reg-card { transform: translateY(0); }
    
    .reg-close {
      position: absolute; top: 15px; right: 20px; font-size: 1.5rem; color: #a9a9c0;
      background: none; border: none; cursor: pointer; transition: color 0.2s;
    }
    .reg-close:hover { color: #fff; }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

  <div class="login-card">
    <div class="storm-logo-section">
      <div class="storm-shield">
        <div class="storm-cloud-layer">
          <div class="storm-shade"></div>
          <div class="lightning-flicker"></div>
          <div class="storm-droplet" style="width: 28px; height: 28px; top: 15%; left: 10%; animation-duration: 2.8s;"></div>
          <div class="storm-droplet" style="width: 18px; height: 22px; top: 60%; left: 75%; animation-duration: 3.5s; opacity: 0.6;"></div>
          <div class="storm-droplet" style="width: 22px; height: 20px; top: 70%; left: 20%; animation-duration: 2.2s;"></div>
          <div class="storm-droplet" style="width: 15px; height: 18px; top: 25%; left: 85%; animation-duration: 4s;"></div>
        </div>
        <div class="storm-core">
          <div class="logo-circle-wrapper">
            <img src="data/AsiyeNew.png" class="storm-logo-img" alt="Asiye logo" onerror="this.src='https://placehold.co/150x150?text=ASIYE'" />
          </div>
        </div>
      </div>
      <div class="logo-text">asiye for Drivers</div>
    </div>

    <div id="statusBox" class="status-box"></div>

    <div style="text-align: right; margin-bottom: 10px; padding-right: 10px;">
      <a href="javascript:void(0)" id="toggleModeBtn" onclick="toggleLoginMode()" style="color: #7b9cff; text-decoration: none; font-size: 0.8rem; font-weight: 600; text-transform: uppercase;">
        Use Email Address instead
      </a>
    </div>

    <div class="input-group" id="phoneGroup">
      <label><i class="fa-solid fa-mobile-screen-button" style="margin-right: 6px;"></i>Phone Number</label>
      <div class="phone-input-wrap">
        <div class="prefix">+27</div>
        <input type="tel" id="driverPhone" class="modern-input" placeholder="82 123 4567" inputmode="tel" />
      </div>
    </div>

    <div class="input-group" id="emailGroup" style="display: none;">
      <label><i class="fa-solid fa-envelope" style="margin-right: 6px;"></i>Email Address</label>
      <input type="email" id="driverEmail" class="modern-input" placeholder="e.g. name@asiye.com" autocomplete="email" />
    </div>

    <div class="input-group">
      <label><i class="fa-solid fa-lock" style="margin-right: 6px;"></i>Security Password</label>
      <input type="password" id="driverPassword" class="modern-input" placeholder="Enter your temporary password" />
    </div>

    <button id="loginBtn" class="main-btn" onclick="handleDriverLogin()">
      <i class="fa-solid fa-arrow-right-to-bracket" style="margin-right: 8px;"></i>Sign In
    </button>

    <a href="javascript:void(0)" onclick="showForgotPassword()" style="display: block; margin-top: 12px; color: #6b6b8a; font-size: 0.8rem; text-decoration: none; text-align: center;">
      Forgot your password?
    </a>

    <div class="divider">or</div>

    <button class="main-btn secondary" onclick="window.location.href='https://asiye.cloud/driverRegistration/'">
      <i class="fa-solid fa-car" style="margin-right: 8px;"></i>Become Asiye driver
    </button>

    <a href="login.html" class="back-link">
      <i class="fa-solid fa-user-group" style="margin-right: 5px;"></i>Standard Passenger Login
    </a>
  </div>

  <!-- Forgot Password Modal -->
  <div id="forgotPasswordModal" class="reg-modal-overlay">
    <div class="reg-card">
      <button class="reg-close" onclick="closeForgotPasswordModal()">&times;</button>
      <div style="width: 60px; height: 60px; background: rgba(123, 156, 255, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px;">
        <i class="fa-solid fa-key" style="font-size: 1.8rem; color: #7b9cff;"></i>
      </div>
      <h2 style="color: white; margin-bottom: 5px; font-weight: 800;">Reset Password</h2>
      <p style="color: #a9a9c0; font-size: 0.85rem; margin-bottom: 25px;">Enter your registered Phone Number or Email Address below to receive your new login PIN via SMS.</p>
      
      <form id="forgotPasswordForm" onsubmit="handleForgotPasswordSubmit(event)">
        <div class="input-group">
          <label><i class="fa-solid fa-id-card" style="margin-right: 6px;"></i>Phone or Email</label>
          <input type="text" id="resetIdentifier" class="modern-input" placeholder="e.g. 0821234567 or email@domain.com" required />
        </div>
        
        <button type="submit" id="resetSubmitBtn" class="main-btn" style="border-radius: 16px; margin-top: 5px;">
          <i class="fa-solid fa-paper-plane" style="margin-right: 8px;"></i>Send Reset PIN
        </button>
      </form>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

  <script>
    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
      apiKey: "AIzaSyCX_euO2EEPhfhuG5DTsSi5vCpZ9MFZczY",
      authDomain: "asiye-80386.firebaseapp.com",
      databaseURL: "https://asiye-80386-default-rtdb.firebaseio.com",
      projectId: "asiye-80386",
      storageBucket: "asiye-80386.firebasestorage.app",
      appId: "1:531902350858:web:f8a4a246bf350d50e3c1f3"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    let currentMode = 'phone';

    // ============================================================
    // UI HELPERS
    // ============================================================
    function showToast(msg, type = 'error') {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.className = 'toast ' + type;
      t.style.display = 'block';
      clearTimeout(t._hideTimeout);
      t._hideTimeout = setTimeout(() => {
        t.style.display = 'none';
        t.className = 'toast';
      }, 5000);
    }

    function showStatus(msg, type = 'info') {
      const box = document.getElementById('statusBox');
      box.textContent = msg;
      box.className = 'status-box ' + type;
      box.style.display = 'block';
    }

    function hideStatus() {
      document.getElementById('statusBox').style.display = 'none';
    }

    window.toggleLoginMode = function() {
      const phoneGroup = document.getElementById('phoneGroup');
      const emailGroup = document.getElementById('emailGroup');
      const toggleBtn = document.getElementById('toggleModeBtn');

      if (currentMode === 'phone') {
        currentMode = 'email';
        phoneGroup.style.display = 'none';
        emailGroup.style.display = 'block';
        toggleBtn.innerText = 'Use Phone Number instead';
      } else {
        currentMode = 'phone';
        phoneGroup.style.display = 'block';
        emailGroup.style.display = 'none';
        toggleBtn.innerText = 'Use Email Address instead';
      }
    }

    function standardizePhoneNumber(phone) {
      let clean = String(phone).replace(/\D/g, '');
      if (clean.startsWith('0') && clean.length === 10) clean = '27' + clean.substring(1);
      if (clean.length === 9) clean = '27' + clean;
      return clean;
    }

    // ============================================================
    // FIND DRIVER IN DATABASE
    // ============================================================
    async function findDriverByIdentifier(identifier, type) {
      if (type === 'email') {
        const taxiSnap = await database.ref('taxis').orderByChild('email').equalTo(identifier.toLowerCase()).once('value');
        if (taxiSnap.exists()) {
          const entries = Object.entries(taxiSnap.val());
          return { id: entries[0][0], data: entries[0][1], type: 'driver' };
        }
        const handlerSnap = await database.ref('handlers').orderByChild('email').equalTo(identifier.toLowerCase()).once('value');
        if (handlerSnap.exists()) {
          const entries = Object.entries(handlerSnap.val());
          return { id: entries[0][0], data: entries[0][1], type: 'handler' };
        }
        return null;
      } else {
        const searchPhone = standardizePhoneNumber(identifier);
        const taxiSnap = await database.ref('taxis').orderByChild('phone').equalTo(searchPhone).once('value');
        if (taxiSnap.exists()) {
          const entries = Object.entries(taxiSnap.val());
          return { id: entries[0][0], data: entries[0][1], type: 'driver' };
        }
        const handlerSnap = await database.ref('handlers').orderByChild('phone').equalTo(searchPhone).once('value');
        if (handlerSnap.exists()) {
          const entries = Object.entries(handlerSnap.val());
          return { id: entries[0][0], data: entries[0][1], type: 'handler' };
        }
        return null;
      }
    }

    // ============================================================
    // ENSURE FIREBASE AUTH ACCOUNT EXISTS
    // ============================================================
    async function ensureFirebaseAuthAccount(email, password) {
      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        return { success: true, action: 'login', user: userCredential.user };
      } catch (e) {
        console.log('Auth attempt result:', e.code);

        if (e.code === 'auth/user-not-found') {
          try {
            showStatus('Creating your account...', 'info');
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            showStatus('✅ Account created successfully!', 'success');
            return { success: true, action: 'created', user: userCredential.user };
          } catch (createError) {
            console.error('Create account error:', createError.code);
            if (createError.code === 'auth/email-already-in-use') {
              const retry = await auth.signInWithEmailAndPassword(email, password);
              return { success: true, action: 'login', user: retry.user };
            }
            throw createError;
          }
        }

        if (e.code === 'auth/wrong-password') {
          return { 
            success: false, 
            action: 'wrong_password', 
            message: 'Incorrect password. Click Forgot Password to get a new PIN.' 
          };
        }

        if (e.code === 'auth/internal-error' && e.message && e.message.includes('INVALID_LOGIN_CREDENTIALS')) {
          return {
            success: false,
            action: 'wrong_password',
            message: 'Incorrect login details. Click Forgot Password to reset your PIN.'
          };
        }

        if (e.code === 'auth/invalid-email') {
          return {
            success: false,
            action: 'invalid_email',
            message: 'Invalid email format. Please check and try again.'
          };
        }

        throw e;
      }
    }

    // ============================================================
    // MAIN LOGIN HANDLER
    // ============================================================
    async function handleDriverLogin() {
      const password = document.getElementById('driverPassword').value;
      const btn = document.getElementById('loginBtn');
      let email = '';
      let driverData = null;
      let driverId = '';
      let userType = 'driver';

      hideStatus();

      if (!password || password.length < 4) {
        showToast("Please enter your security password.", "error");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
      showStatus('🔍 Looking up your account...', 'info');

      try {
        // Step 1: Find the driver in the database
        if (currentMode === 'email') {
          email = document.getElementById('driverEmail').value.trim().toLowerCase();
          if (!email) throw new Error("Please enter your email address.");
          if (!email.includes('@')) throw new Error("Please enter a valid email address.");
          
          const result = await findDriverByIdentifier(email, 'email');
          if (result) {
            driverData = result.data;
            driverId = result.id;
            userType = result.type;
            showStatus(`✅ Found driver record: ${driverData.name || 'Driver'}`, 'success');
          } else {
            // No driver found, but we can still try to authenticate
            showStatus('⚠️ Driver record not found. Attempting authentication...', 'warning');
          }
        } else {
          const phone = document.getElementById('driverPhone').value.trim();
          if (!phone) throw new Error("Please enter your phone number.");
          
          const result = await findDriverByIdentifier(phone, 'phone');
          if (!result) {
            throw new Error("Phone number not found. Please register or contact support.");
          }
          driverData = result.data;
          driverId = result.id;
          userType = result.type;
          email = driverData.email;
          if (!email || email === 'pending_email' || !email.includes('@')) {
            throw new Error("No valid email linked to this phone. Please use email login or contact support.");
          }
          showStatus(`✅ Found driver record: ${driverData.name || 'Driver'}`, 'success');
        }

        // Step 2: Ensure Firebase Auth account exists and sign in
        let authResult = await ensureFirebaseAuthAccount(email, password);

        // Step 3: If auth failed but we have a temp password, try syncing
        if (!authResult.success && driverData && driverData.tempPassword === password) {
          showStatus('Synchronizing password with security server...', 'info');
          
          try {
            const syncResponse = await fetch('https://app.asiye.cloud/reset_driver_password.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                uid: driverId,
                password: password,
                phone: driverData.phone,
                name: driverData.name || 'Driver'
              })
            });

            const syncResult = await syncResponse.json();

            if (syncResult.status === 'success') {
              authResult = await ensureFirebaseAuthAccount(email, password);
            } else {
              throw new Error("Sync failed. Please try again.");
            }
          } catch(syncErr) {
            console.error("Auth sync fallback failed:", syncErr);
          }
        }

        // Step 4: Final auth check
        if (!authResult || !authResult.success) {
          throw new Error(authResult?.message || 'Authentication failed. Please verify your credentials.');
        }

        // Step 5: Success - store session and redirect
        const user = authResult.user;
        localStorage.setItem('userId', driverId || user.uid);
        localStorage.setItem('userType', userType);
        localStorage.setItem('driverName', driverData?.name || 'Driver');
        
        // Also store the driver data for immediate use
        if (driverId && driverData) {
          localStorage.setItem('driverData', JSON.stringify(driverData));
        }

        showToast('✅ Login successful! Redirecting...', 'success');
        showStatus('✅ Login successful! Redirecting...', 'success');
        
        // Wait for Firebase auth state to propagate
        await new Promise(resolve => setTimeout(resolve, 500));
        
        // Redirect based on user type
        const redirectPage = userType === 'handler' ? 'handler.html' : 'taxi.html';
        window.location.href = redirectPage;

      } catch (e) {
        console.error('Login error:', e);
        
        let errorMsg = e.message || 'Login failed. Please try again.';
        if (e.code === 'auth/too-many-requests') {
          errorMsg = 'Too many failed attempts. Please try again later or use Forgot Password.';
        }
        if (e.code === 'auth/network-request-failed') {
          errorMsg = 'Network error. Please check your internet connection.';
        }
        
        showToast(errorMsg, 'error');
        showStatus('❌ ' + errorMsg, 'error');
        
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket" style="margin-right: 8px;"></i>Sign In';
      }
    }

    // ============================================================
    // FORGOT PASSWORD
    // ============================================================

    window.showForgotPassword = function() {
      const resetInput = document.getElementById('resetIdentifier');
      if (resetInput) {
        if (currentMode === 'email') {
          resetInput.value = document.getElementById('driverEmail').value.trim();
        } else {
          const typedPhone = document.getElementById('driverPhone').value.trim();
          if (typedPhone) {
            resetInput.value = '0' + typedPhone.replace(/\D/g, '').replace(/^27/, '');
          }
        }
      }
      document.getElementById('forgotPasswordModal').classList.add('open');
    }

    window.closeForgotPasswordModal = function() {
      document.getElementById('forgotPasswordModal').classList.remove('open');
      document.getElementById('forgotPasswordForm').reset();
    }

    window.handleForgotPasswordSubmit = async function(e) {
      e.preventDefault();
      
      const identifier = document.getElementById('resetIdentifier').value.trim();
      const btn = document.getElementById('resetSubmitBtn');
      const originalHtml = btn.innerHTML;
      
      if (!identifier) {
        showToast("Please enter your registered Email or Phone Number.", "error");
        return;
      }

      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
      btn.disabled = true;
      showStatus('Processing reset request...', 'info');

      try {
        const isEmail = identifier.includes('@');
        let record = null;

        if (isEmail) {
          record = await findDriverByIdentifier(identifier.toLowerCase(), 'email');
        } else {
          const cleanPhone = standardizePhoneNumber(identifier);
          record = await findDriverByIdentifier(cleanPhone, 'phone');
        }

        if (!record) {
          throw new Error("No registered driver found matching those details.");
        }

        const driverId = record.id;
        const driverData = record.data;
        const targetPhone = driverData.phone;
        const driverName = driverData.name || "Driver";

        // Generate a new secure 6-digit login PIN
        const newTempPassword = Math.floor(100000 + Math.random() * 900000).toString();

        // 1. Update the password in Realtime Database
        const dbNodePath = record.type === 'handler' ? 'handlers' : 'taxis';
        await database.ref(`${dbNodePath}/${driverId}`).update({
          tempPassword: newTempPassword,
          passwordLastReset: firebase.database.ServerValue.TIMESTAMP
        });

        // 2. Call the PHP endpoint to update Firebase Auth & send SMS
        const response = await fetch('https://app.asiye.cloud/reset_driver_password.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            uid: driverId,
            password: newTempPassword,
            phone: targetPhone,
            name: driverName,
            email: driverData.email || ''
          })
        });

        const result = await response.json();

        if (result.status === 'success') {
          showToast("A new secure login PIN has been sent to your phone via SMS!", "success");
          showStatus("✅ New PIN sent via SMS.", "success");
          closeForgotPasswordModal();
        } else {
          throw new Error(result.message || "Failed to sync password.");
        }

      } catch (error) {
        console.error("Reset handler failure:", error);
        showToast(error.message, "error");
        showStatus("❌ " + error.message, "error");
      } finally {
        btn.innerHTML = originalHtml;
        btn.disabled = false;
      }
    }

    // ============================================================
    // ENTER KEY SUPPORT
    // ============================================================
    document.getElementById('driverPassword').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleDriverLogin();
      }
    });

    document.getElementById('driverPhone').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('driverPassword').focus();
      }
    });

    document.getElementById('driverEmail').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('driverPassword').focus();
      }
    });

    console.log('✅ Driver login page loaded. Firebase Auth ready.');
  </script>
</body>
</html>
