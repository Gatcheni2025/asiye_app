<!DOCTYPE html>
<html>
<head>
    <title>Admin Login · Asye</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
            color: #e8ecf4;
        }
        .login-card {
            background: #141a24;
            border-radius: 24px;
            padding: 2.8rem 2.8rem 2.8rem;
            width: 100%;
            max-width: 420px;
            border: 1px solid #2a3340;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }
        .login-card h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.2rem;
        }
        .login-card .subhead {
            color: #8b95a9;
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            color: #c8d0dc;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 0.4rem;
        }
        .form-group input {
            width: 100%;
            background: #1e2632;
            border: 1px solid #2f3a48;
            border-radius: 12px;
            padding: 0.85rem 1rem;
            color: #f0f4fa;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.25s, box-shadow 0.25s;
        }
        .form-group input:focus {
            border-color: #5b7cfa;
            box-shadow: 0 0 0 4px rgba(91, 124, 250, 0.12);
        }
        .form-group input::placeholder {
            color: #5d6a7e;
        }
        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0.5rem 0 1.8rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #b0bacf;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .remember-me input[type="checkbox"] {
            accent-color: #5b7cfa;
            width: 17px;
            height: 17px;
            cursor: pointer;
        }
        .forgot-link {
            color: #8b9cbb;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
            cursor: pointer;
        }
        .forgot-link:hover {
            color: #b0c4e8;
        }
        .btn-signin {
            width: 100%;
            background: #5b7cfa;
            border: none;
            border-radius: 40px;
            padding: 0.95rem;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(91, 124, 250, 0.3);
        }
        .btn-signin:hover {
            background: #4a6ae8;
            box-shadow: 0 6px 24px rgba(91, 124, 250, 0.4);
        }
        .btn-signin:active {
            transform: scale(0.97);
        }
        .btn-signin:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.8rem;
            color: #6f7d98;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #a0b2d0;
        }
        .footer-meta {
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid #232d3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #4d5b70;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .footer-meta .brand {
            color: #7b8ba8;
            font-weight: 500;
        }
        .error-msg {
            background: #1e1a1f;
            border: 1px solid #4a2a2a;
            border-radius: 12px;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            color: #f28b82;
            font-size: 0.85rem;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        .error-msg.success {
            border-color: #2a4a2a;
            color: #6f8a6f;
        }
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #2f3a48;
            border-top: 2px solid #5b7cfa;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .network-bar {
            display: flex;
            gap: 1.2rem;
            margin-top: 1.8rem;
            padding: 0.4rem 0;
            border-top: 1px solid #1f2836;
            border-bottom: 1px solid #1f2836;
            font-size: 0.7rem;
            color: #5a6a82;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            flex-wrap: wrap;
        }
        .network-bar span {
            color: #7c8ba5;
        }
        .network-bar .active {
            color: #b8c9e8;
            font-weight: 500;
        }
        .status-indicator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.6rem;
        }
        .status-indicator .left {
            color: #5f6e86;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .status-indicator .badge-ok {
            color: #6f8a6f;
            font-size: 0.7rem;
            background: #1a262f;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
        }
        .request-block {
            margin-top: 1.2rem;
            background: #0e141e;
            border-radius: 14px;
            padding: 0.8rem 1rem;
            border: 1px solid #1f293a;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.7rem;
            color: #b0c4d8;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .request-block .label {
            color: #6f80a0;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }
        .request-block .error-text { color: #f28b82; }
        .request-block .json-key { color: #9ac7ff; }
        .request-block .json-string { color: #b5d6a2; }
        .request-block .json-value { color: #f7c95c; }
        @media (max-width: 480px) {
            .login-card { padding: 1.8rem 1.5rem; }
            .flex-row { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>

<div class="login-card">

    <h1>🔐 Admin Panel</h1>
    <div class="subhead">Sign in to manage your platform</div>

    <!-- Error / Status message -->
    <div id="errorMsg" class="error-msg"></div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="return false;">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" value="admin2@asiye.cloud" placeholder="admin@asiye.cloud" autocomplete="email" />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" value="admin123" placeholder="••••••••••" autocomplete="current-password" />
        </div>

        <div class="flex-row">
            <label class="remember-me">
                <input type="checkbox" checked /> Remember me
            </label>
            <span class="forgot-link" onclick="resetPassword()">Forgot password?</span>
        </div>

        <button type="submit" class="btn-signin" id="signInBtn">Sign In</button>
    </form>

    <a href="#" class="back-link">← Back to Main App</a>

    <!-- Network Bar -->
    <div class="network-bar">
        <span class="active">Network</span>
        <span>Performance</span>
        <span>Memory</span>
        <span>Application</span>
        <span>Security</span>
        <span>Lighthouse</span>
    </div>

    <!-- Status -->
    <div class="status-indicator">
        <span class="left">Default levels</span>
        <span class="badge-ok">No Issues</span>
        <span class="badge-hidden" style="color:#7b8aa3;font-size:0.65rem;">1 hidden</span>
    </div>

    <!-- Request / Response block -->
    <div class="request-block" id="requestBlock">
        <div class="label" id="requestLabel">🔓 Ready to Login</div>
        <div id="requestBody">Enter your credentials and click "Sign In"</div>
    </div>

    <div class="footer-meta">
        <span class="brand">Admin Login · Asye</span>
        <span>Google Password Manager</span>
        <span>Ask Gemini</span>
    </div>

</div>

<script>
    // ============================================================
    // FIREBASE CONFIG
    // ============================================================
    const firebaseConfig = {
        apiKey: "AIzaSyCX_euO2EEPhfhuG5DTsSi5vCpZ9MFZczY",
        authDomain: "asiye-80386.firebaseapp.com",
        databaseURL: "https://asiye-80386-default-rtdb.firebaseio.com",
        projectId: "asiye-80386",
        storageBucket: "asiye-80386.firebasestorage.app",
        appId: "1:531902350858:web:f8a4a246bf350d50e3c1f3"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ============================================================
    // DOM ELEMENTS
    // ============================================================
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const signInBtn = document.getElementById('signInBtn');
    const errorMsg = document.getElementById('errorMsg');
    const requestBody = document.getElementById('requestBody');
    const requestLabel = document.getElementById('requestLabel');

    // ============================================================
    // HELPER FUNCTIONS
    // ============================================================
    function showError(message, isSuccess = false) {
        errorMsg.textContent = message;
        errorMsg.className = 'error-msg show';
        if (isSuccess) {
            errorMsg.classList.add('success');
        }
    }

    function hideError() {
        errorMsg.className = 'error-msg';
    }

    function setButtonLoading(loading) {
        if (loading) {
            signInBtn.innerHTML = '<span class="spinner"></span> Signing in…';
            signInBtn.disabled = true;
        } else {
            signInBtn.innerHTML = 'Sign In';
            signInBtn.disabled = false;
        }
    }

    function updateRequestBlock(label, body) {
        requestLabel.textContent = label;
        requestBody.innerHTML = body;
    }

    // ============================================================
    // PASSWORD RESET
    // ============================================================
    function resetPassword() {
        const email = emailInput.value.trim();
        if (!email) {
            showError('Please enter your email address to reset password.');
            return;
        }
        hideError();
        updateRequestBlock('⏳ Sending reset email...', 'Please wait...');

        auth.sendPasswordResetEmail(email)
            .then(() => {
                updateRequestBlock('✅ Reset Email Sent', `
                    A password reset link has been sent to<br />
                    <span class="json-string">"${email}"</span>
                `);
                showError('✅ Password reset email sent! Check your inbox.', true);
            })
            .catch((error) => {
                updateRequestBlock('❌ Reset Failed', `
                    <span class="error-text">{</span><br />
                    &nbsp;&nbsp;<span class="json-key">"code"</span>: <span class="json-string">"${error.code}"</span>,<br />
                    &nbsp;&nbsp;<span class="json-key">"message"</span>: <span class="json-string">"${error.message}"</span><br />
                    <span class="error-text">}</span>
                `);
                showError('❌ ' + error.message);
            });
    }
    // Expose to global scope for onclick
    window.resetPassword = resetPassword;

    // ============================================================
    // LOGIN HANDLER
    // ============================================================
    function handleLogin(e) {
        e.preventDefault();
        hideError();

        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();

        if (!email || !password) {
            showError('Please enter both email and password.');
            return;
        }

        // Show loading state
        setButtonLoading(true);
        updateRequestBlock('⏳ Authenticating...', 'Waiting for Firebase response...');

        // Attempt sign-in with Firebase
        auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                const user = userCredential.user;
                setButtonLoading(false);

                // Show success
                updateRequestBlock('✅ Login Successful', `
                    <span class="json-key">"user"</span>: {<br />
                    &nbsp;&nbsp;<span class="json-key">"uid"</span>: <span class="json-string">"${user.uid}"</span>,<br />
                    &nbsp;&nbsp;<span class="json-key">"email"</span>: <span class="json-string">"${user.email}"</span>,<br />
                    &nbsp;&nbsp;<span class="json-key">"emailVerified"</span>: <span class="json-value">${user.emailVerified}</span><br />
                    }
                `);

                showError('✅ Welcome back, ' + user.email + '!', true);

                // Redirect after a short delay
                setTimeout(() => {
                    // window.location.href = 'admin-dashboard.html';
                    alert('✅ Login successful! You would be redirected to the dashboard now.');
                }, 1500);
            })
            .catch((error) => {
                setButtonLoading(false);
                const errorCode = error.code;
                const errorMessage = error.message;

                // Show error in the request block
                updateRequestBlock('❌ Login Failed', `
                    <span class="error-text">{</span><br />
                    &nbsp;&nbsp;<span class="json-key">"code"</span>: <span class="json-string">"${errorCode}"</span>,<br />
                    &nbsp;&nbsp;<span class="json-key">"message"</span>: <span class="json-string">"${errorMessage}"</span><br />
                    <span class="error-text">}</span>
                `);

                // Show user-friendly error
                let friendlyMessage = errorMessage;
                if (errorCode === 'auth/user-not-found') {
                    friendlyMessage = 'No account found with this email address.';
                } else if (errorCode === 'auth/wrong-password') {
                    friendlyMessage = 'Incorrect password. Please try again.';
                } else if (errorCode === 'auth/too-many-requests') {
                    friendlyMessage = 'Too many failed attempts. Please try again later.';
                } else if (errorCode === 'auth/invalid-email') {
                    friendlyMessage = 'Please enter a valid email address.';
                } else if (errorCode === 'auth/network-request-failed') {
                    friendlyMessage = 'Network error. Please check your internet connection.';
                } else if (errorCode === 'auth/user-disabled') {
                    friendlyMessage = 'This account has been disabled. Please contact support.';
                }
                showError('❌ ' + friendlyMessage);
            });
    }

    // ============================================================
    // EVENT LISTENERS
    // ============================================================
    signInBtn.addEventListener('click', handleLogin);

    // Allow Enter key to submit
    document.getElementById('loginForm').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleLogin(e);
        }
    });

    // Clear error when user types
    [emailInput, passwordInput].forEach(input => {
        input.addEventListener('input', function() {
            hideError();
            if (!signInBtn.disabled) {
                signInBtn.innerHTML = 'Sign In';
            }
        });
    });

    // ============================================================
    // CHECK IF USER IS ALREADY LOGGED IN
    // ============================================================
    auth.onAuthStateChanged((user) => {
        if (user) {
            // User is already signed in
            updateRequestBlock('👤 Already Logged In', `
                <span class="json-key">"user"</span>: {<br />
                &nbsp;&nbsp;<span class="json-key">"email"</span>: <span class="json-string">"${user.email}"</span>,<br />
                &nbsp;&nbsp;<span class="json-key">"uid"</span>: <span class="json-string">"${user.uid}"</span><br />
                }
            `);
            showError('✅ You are already signed in as ' + user.email, true);
            setTimeout(() => {
                // Redirect to dashboard
                // window.location.href = 'admin-dashboard.html';
            }, 1000);
        } else {
            // No user signed in
            updateRequestBlock('🔓 Ready to Login', 'Enter your credentials and click "Sign In"');
        }
    });

    // ============================================================
    // QUICK TEST: Verify Firebase connection on load
    // ============================================================
    console.log('🔥 Firebase initialized. Auth ready.');
    console.log('📧 Test with: admin2@asiye.cloud / admin123');

    // Auto-focus password for faster testing
    // passwordInput.focus();

    console.log('✅ Login page loaded. Email/Password provider should be enabled in Firebase Console.');
</script>

</body>
</html>
