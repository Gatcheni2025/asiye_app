<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="robots" content="noindex,nofollow">
    <title>Asiye | Live Trip</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box} body{margin:0;font-family:Manrope,sans-serif;background:#f5f6f8;color:#101114}
        #map{position:fixed;inset:0}.loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#fff}
        .loader-card{max-width:320px;padding:24px;text-align:center}.loader-card strong{display:block;font-size:19px;margin-bottom:8px}
        .card{position:fixed;z-index:10;left:14px;right:14px;bottom:18px;background:rgba(255,255,255,.97);border-radius:22px;padding:16px;box-shadow:0 16px 44px rgba(0,0,0,.18);display:none}
        .row{display:flex;align-items:center;gap:12px}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:0 0 auto}
        .avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 38%}.info{min-width:0;flex:1}.info h1{font-size:17px;margin:0 0 3px}.muted{color:#6b7280;font-size:12px}
        .badge{font-size:11px;font-weight:800;background:#e9fff0;color:#137a39;padding:7px 10px;border-radius:999px}.destination{margin-top:12px;padding:12px;border-radius:14px;background:#f3f5f7;font-size:13px}
        .taxi-marker{width:46px;height:46px;background:url('data/quantum.png') center/contain no-repeat;filter:drop-shadow(0 5px 8px rgba(0,0,0,.32))}
        .person-marker{width:16px;height:16px;border:4px solid #fff;border-radius:50%;background:#111;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    </style>
</head>
<body>
<div id="loader" class="loader"><div class="loader-card"><strong>Connecting to live trip…</strong><span class="muted">Your family member's live Asiye trip will appear here.</span></div></div>
<div id="map"></div>
<section id="card" class="card">
    <div class="row">
        <div id="avatar" class="avatar">A</div>
        <div class="info"><h1 id="driverName">Waiting for driver</h1><div id="vehicle" class="muted">Live location will update automatically</div></div>
        <div id="status" class="badge">LIVE</div>
    </div>
    <div class="destination"><strong>Destination</strong><div id="destination" class="muted">Not available yet</div></div>
</section>
<script>
mapboxgl.accessToken="pk.eyJ1IjoiYXNpeWUxIiwiYSI6ImNtcWR2dHBydDEyMjIycXF5eThzcWUzcXUifQ.KgsJuS9O1OLDvAN2CMmrKw";

const params=new URLSearchParams(location.search);
const shareToken=params.get("share")||"";
const legacyTripId=params.get("trip")||params.get("id")||params.get("requestId")||"";
const apiUrl="https://us-central1-asiye-80386.cloudfunctions.net/getTripShare";

let map;
let taxiMarker;
let pickupMarker;
let destinationMarker;
let hasRendered=false;
let pollTimer=null;
let trackingEnded=false;

const loader=document.getElementById("loader");
const card=document.getElementById("card");
const statusEl=document.getElementById("status");

function fail(message){
    loader.style.display="grid";
    loader.innerHTML="";
    const wrapper=document.createElement("div");
    wrapper.className="loader-card";
    const title=document.createElement("strong");
    title.textContent=message;
    const detail=document.createElement("span");
    detail.className="muted";
    detail.textContent="Ask the passenger to share a new Asiye live-trip link.";
    wrapper.append(title,detail);
    loader.appendChild(wrapper);
}

function validNumber(value){
    return Number.isFinite(Number(value));
}

function coords(source,latKeys,lngKeys){
    let lat;
    let lng;
    for(const key of latKeys){
        if(validNumber(source?.[key])){
            lat=Number(source[key]);
            break;
        }
    }
    for(const key of lngKeys){
        if(validNumber(source?.[key])){
            lng=Number(source[key]);
            break;
        }
    }
    return validNumber(lat)&&validNumber(lng)?[lng,lat]:null;
}

function ensurePoint(marker,position,kind){
    if(!position)return marker;
    if(!marker){
        const el=document.createElement("div");
        el.className=kind;
        marker=new mapboxgl.Marker({element:el})
            .setLngLat(position)
            .addTo(map);
    }else{
        marker.setLngLat(position);
    }
    return marker;
}

function fit(trip,taxi){
    const points=[];
    const taxiPos=coords(taxi,["latitude"],["longitude"]);
    if(taxiPos)points.push(taxiPos);

    const pickup=trip?.commuterLocation&&
        validNumber(trip.commuterLocation.latitude)&&
        validNumber(trip.commuterLocation.longitude)
        ?[
            Number(trip.commuterLocation.longitude),
            Number(trip.commuterLocation.latitude)
        ]
        :null;

    const destination=trip?.destinationCoords&&
        validNumber(trip.destinationCoords.latitude)&&
        validNumber(trip.destinationCoords.longitude)
        ?[
            Number(trip.destinationCoords.longitude),
            Number(trip.destinationCoords.latitude)
        ]
        :null;

    if(pickup)points.push(pickup);
    if(destination)points.push(destination);

    if(points.length>1){
        const bounds=points
            .slice(1)
            .reduce(
                (current,point)=>current.extend(point),
                new mapboxgl.LngLatBounds(points[0],points[0])
            );

        map.fitBounds(bounds,{
            padding:{top:80,bottom:210,left:55,right:55},
            maxZoom:15,
            duration:500
        });
    }else if(points[0]){
        map.easeTo({
            center:points[0],
            zoom:15,
            duration:500
        });
    }
}

function setAvatar(url,name){
    const avatar=document.getElementById("avatar");
    avatar.replaceChildren();

    if(url){
        const img=document.createElement("img");
        img.alt="Driver profile picture";
        img.referrerPolicy="no-referrer";
        img.src=String(url);
        img.onerror=()=>{
            avatar.replaceChildren();
            avatar.textContent=(name||"A").charAt(0).toUpperCase();
        };
        avatar.appendChild(img);
        return;
    }

    avatar.textContent=(name||"A").charAt(0).toUpperCase();
}

function render(trip,taxi){
    const ended=Boolean(trip?.ended);
    trackingEnded=ended;

    statusEl.textContent=ended?"TRIP ENDED":"LIVE";
    statusEl.style.background=ended?"#ececec":"#e9fff0";
    statusEl.style.color=ended?"#555":"#137a39";

    document.getElementById("destination").textContent=
        trip?.destination||
        trip?.destinationName||
        "Not available yet";

    const name=[
        taxi?.name,
        taxi?.surname
    ].filter(Boolean).join(" ")||
        trip?.driverName||
        "Waiting for driver";

    document.getElementById("driverName").textContent=name;

    const vehicle=[
        taxi?.vehicleColor||trip?.vehicleColor,
        taxi?.vehicleMake||trip?.vehicleMake,
        taxi?.vehicleModel||trip?.vehicleModel,
        taxi?.taxiRegistrationNumber||trip?.vehicleReg
    ].filter(Boolean).join(" · ");

    document.getElementById("vehicle").textContent=
        vehicle||
        (trip?.taxiId?"Driver assigned":"Live location will update automatically");

    setAvatar(
        taxi?.profileImageUrl||trip?.driverProfileImageUrl||"",
        name
    );

    const taxiPos=coords(taxi,["latitude"],["longitude"]);
    taxiMarker=ensurePoint(taxiMarker,taxiPos,"taxi-marker");

    const pickup=trip?.commuterLocation&&
        validNumber(trip.commuterLocation.latitude)&&
        validNumber(trip.commuterLocation.longitude)
        ?[
            Number(trip.commuterLocation.longitude),
            Number(trip.commuterLocation.latitude)
        ]
        :null;

    const destination=trip?.destinationCoords&&
        validNumber(trip.destinationCoords.latitude)&&
        validNumber(trip.destinationCoords.longitude)
        ?[
            Number(trip.destinationCoords.longitude),
            Number(trip.destinationCoords.latitude)
        ]
        :null;

    pickupMarker=ensurePoint(
        pickupMarker,
        pickup,
        "person-marker"
    );

    if(destination&&!destinationMarker){
        destinationMarker=
            new mapboxgl.Marker({color:"#111"})
                .setLngLat(destination)
                .addTo(map);
    }

    loader.style.display="none";
    card.style.display="block";

    if(!hasRendered){
        fit(trip,taxi);
        hasRendered=true;
    }

    if(ended&&pollTimer){
        clearTimeout(pollTimer);
        pollTimer=null;
    }
}

function buildApiRequest(){
    const url=new URL(apiUrl);

    if(shareToken){
        url.searchParams.set("share",shareToken);
    }else if(legacyTripId){
        url.searchParams.set("trip",legacyTripId);
    }

    return url.toString();
}

async function refresh(){
    try{
        const response=await fetch(buildApiRequest(),{
            method:"GET",
            cache:"no-store",
            headers:{
                "Accept":"application/json"
            }
        });

        const payload=await response
            .json()
            .catch(()=>({}));

        if(!response.ok||!payload.trip){
            const message=
                payload.error||
                "Live tracking is unavailable.";

            if(!hasRendered){
                fail(message);
            }else{
                statusEl.textContent="RECONNECTING";
            }

            if(response.status===404||response.status===410){
                return;
            }

        }else{
            render(
                payload.trip,
                payload.taxi||null
            );
        }
    }catch(error){
        if(!hasRendered){
            fail("Unable to connect to this live trip.");
        }else{
            statusEl.textContent="RECONNECTING";
        }
    }

    if(!trackingEnded&&!pollTimer){
        pollTimer=setTimeout(()=>{
            pollTimer=null;
            refresh();
        },4000);
    }
}

function start(){
    if(!shareToken&&!legacyTripId){
        fail("Invalid tracking link");
        return;
    }

    map=new mapboxgl.Map({
        container:"map",
        style:"mapbox://styles/mapbox/streets-v12",
        center:[28.0473,-26.2041],
        zoom:11
    });

    map.addControl(
        new mapboxgl.NavigationControl({
            showCompass:false
        }),
        "top-right"
    );

    map.on("load",refresh);
}

start();
</script>
</body>
</html>
