<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="robots" content="noindex,nofollow">
    <title>Asiye | Live Trip</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        *{box-sizing:border-box} body{margin:0;font-family:Manrope,sans-serif;background:#f5f6f8;color:#101114}
        #map{position:fixed;inset:0}.loader{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#fff}
        .loader-card{max-width:320px;padding:24px;text-align:center}.loader-card strong{display:block;font-size:19px;margin-bottom:8px}
        .card{position:fixed;z-index:10;left:14px;right:14px;bottom:18px;background:rgba(255,255,255,.97);border-radius:22px;padding:16px;box-shadow:0 16px 44px rgba(0,0,0,.18);display:none}
        .row{display:flex;align-items:center;gap:12px}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;overflow:hidden;flex:0 0 auto}
        .avatar img{width:100%;height:100%;object-fit:cover;object-position:50% 38%}.info{min-width:0;flex:1}.info h1{font-size:17px;margin:0 0 3px}.muted{color:#6b7280;font-size:12px}
        .badge{font-size:11px;font-weight:800;background:#e9fff0;color:#137a39;padding:7px 10px;border-radius:999px}.destination{margin-top:12px;padding:12px;border-radius:14px;background:#f3f5f7;font-size:13px}
        .taxi-marker{width:46px;height:46px;background:url('data/quantum.png') center/contain no-repeat;filter:drop-shadow(0 5px 8px rgba(0,0,0,.32))}
        .person-marker{width:16px;height:16px;border:4px solid #fff;border-radius:50%;background:#111;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    </style>
</head>
<body>
<div id="loader" class="loader"><div class="loader-card"><strong>Connecting to live trip…</strong><span class="muted">Your family member's live Asiye trip will appear here.</span></div></div>
<div id="map"></div>
<section id="card" class="card">
    <div class="row">
        <div id="avatar" class="avatar">A</div>
        <div class="info"><h1 id="driverName">Waiting for driver</h1><div id="vehicle" class="muted">Live location will update automatically</div></div>
        <div id="status" class="badge">LIVE</div>
    </div>
    <div class="destination"><strong>Destination</strong><div id="destination" class="muted">Not available yet</div></div>
</section>
<script>
const firebaseConfig={apiKey:"AIzaSyCX_euO2EEPhfhuG5DTsSi5vCpZ9MFZczY",authDomain:"asiye-80386.firebaseapp.com",databaseURL:"https://asiye-80386-default-rtdb.firebaseio.com",projectId:"asiye-80386",storageBucket:"asiye-80386.firebasestorage.app",appId:"1:531902350858:web:f8a4a246bf350d50e3c1f3"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
mapboxgl.accessToken="pk.eyJ1IjoiYXNpeWUxIiwiYSI6ImNtcWR2dHBydDEyMjIycXF5eThzcWUzcXUifQ.KgsJuS9O1OLDvAN2CMmrKw";
const params=new URLSearchParams(location.search);
const tripId=params.get("trip")||params.get("id")||params.get("requestId")||"";
let map,taxiMarker,pickupMarker,destinationMarker,taxiRef,taxiListener,lastTrip=null;
const loader=document.getElementById("loader"),card=document.getElementById("card"),statusEl=document.getElementById("status");
function fail(msg){loader.innerHTML='<div class="loader-card"><strong>'+msg+'</strong><span class="muted">Ask the passenger to share a new Asiye live-trip link.</span></div>'}
function valid(n){return Number.isFinite(Number(n))}
function coords(obj, latKeys, lngKeys){let lat,lng;for(const k of latKeys){if(valid(obj?.[k])){lat=Number(obj[k]);break}}for(const k of lngKeys){if(valid(obj?.[k])){lng=Number(obj[k]);break}}return valid(lat)&&valid(lng)?[lng,lat]:null}
function ensurePoint(marker, position, kind){if(!position)return marker; if(!marker){const el=document.createElement("div");el.className=kind;marker=new mapboxgl.Marker({element:el}).setLngLat(position).addTo(map)}else marker.setLngLat(position);return marker}
function fit(trip,taxi){const points=[];const taxiPos=coords(taxi,["latitude"],["longitude"]);if(taxiPos)points.push(taxiPos);const pickup=trip?.commuterLocation&&valid(trip.commuterLocation.latitude)&&valid(trip.commuterLocation.longitude)?[Number(trip.commuterLocation.longitude),Number(trip.commuterLocation.latitude)]:null;const dest=trip?.destinationCoords&&valid(trip.destinationCoords.latitude)&&valid(trip.destinationCoords.longitude)?[Number(trip.destinationCoords.longitude),Number(trip.destinationCoords.latitude)]:null;if(pickup)points.push(pickup);if(dest)points.push(dest);if(points.length>1){const b=points.slice(1).reduce((x,p)=>x.extend(p),new mapboxgl.LngLatBounds(points[0],points[0]));map.fitBounds(b,{padding:{top:80,bottom:210,left:55,right:55},maxZoom:15,duration:700})}else if(points[0])map.easeTo({center:points[0],zoom:15,duration:700})}
function render(trip,taxi){lastTrip=trip;const ended=["completed","cancelled_by_driver","cancelled_by_commuter","cancelled_by_admin","rejected"].includes(String(trip.status||"").toLowerCase());statusEl.textContent=ended?"TRIP ENDED":"LIVE";statusEl.style.background=ended?"#ececec":"#e9fff0";statusEl.style.color=ended?"#555":"#137a39";document.getElementById("destination").textContent=trip.destination||trip.destinationName||"Not available yet";if(taxi){const name=[taxi.name,taxi.surname].filter(Boolean).join(" ")||trip.driverName||"Asiye driver";document.getElementById("driverName").textContent=name;document.getElementById("vehicle").textContent=[taxi.vehicleColor,taxi.vehicleMake,taxi.vehicleModel,taxi.taxiRegistrationNumber||taxi.registration].filter(Boolean).join(" · ")||"Driver assigned";const url=taxi.profile_picture_url||taxi.profileImageUrl||trip.driverProfileImageUrl||"";const avatar=document.getElementById("avatar");avatar.innerHTML=url?'<img alt="Driver profile picture" src="'+String(url).replace(/"/g,"&quot;")+'">':name.charAt(0).toUpperCase();const p=coords(taxi,["latitude"],["longitude"]);taxiMarker=ensurePoint(taxiMarker,p,"taxi-marker");}const pickup=trip.commuterLocation&&valid(trip.commuterLocation.latitude)&&valid(trip.commuterLocation.longitude)?[Number(trip.commuterLocation.longitude),Number(trip.commuterLocation.latitude)]:null;const dest=trip.destinationCoords&&valid(trip.destinationCoords.latitude)&&valid(trip.destinationCoords.longitude)?[Number(trip.destinationCoords.longitude),Number(trip.destinationCoords.latitude)]:null;pickupMarker=ensurePoint(pickupMarker,pickup,"person-marker");if(dest&&!destinationMarker)destinationMarker=new mapboxgl.Marker({color:"#111"}).setLngLat(dest).addTo(map);loader.style.display="none";card.style.display="block";fit(trip,taxi)}
function followTaxi(id,trip){if(!id){render(trip,null);return}if(taxiRef)taxiRef.off("value",taxiListener);taxiRef=db.ref("taxis/"+id);taxiListener=taxiRef.on("value",s=>render(lastTrip||trip,s.val()||null))}
function start(){if(!tripId){fail("Invalid tracking link");return}db.ref("requests/"+tripId).on("value",snap=>{const trip=snap.val();if(!trip){fail("Trip not found");return}lastTrip=trip;followTaxi(trip.taxiId,trip)})}
if(!tripId){fail("Invalid tracking link")}else{map=new mapboxgl.Map({container:"map",style:"mapbox://styles/mapbox/streets-v12",center:[28.0473,-26.2041],zoom:11});map.addControl(new mapboxgl.NavigationControl({showCompass:false}),"top-right");map.on("load",start)}
</script>
</body>
</html>
