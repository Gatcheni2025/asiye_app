<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Asiye Payment</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f5f7fb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);background:#fff;border-radius:28px;padding:32px;box-shadow:0 18px 60px rgba(0,0,0,.10);text-align:center}
    .mark{width:72px;height:72px;border-radius:24px;margin:0 auto 18px;display:grid;place-items:center;background:#111;color:#fff;font-size:30px;font-weight:800}
    h1{font-size:28px;margin:0 0 10px}
    p{line-height:1.55;color:#5a6270}
    .ref{margin:20px 0;padding:14px;border-radius:16px;background:#f4f5f7;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}
    .note{font-size:14px}
    button{border:0;border-radius:16px;padding:14px 18px;font:inherit;font-weight:700;cursor:pointer;background:#111;color:#fff;width:100%}
  </style>
</head>
<body>
<main>
  <div class="mark">A</div>
  <h1>Payment submitted</h1>
  <p>Paystack has returned you to Asiye. Your wallet will only be credited after Asiye verifies the payment with Paystack.</p>
  <div class="ref" id="reference">Checking reference…</div>
  <p class="note">Return to the Asiye app and tap <b>Check payment</b>. Successful payments are also confirmed automatically by Paystack's secure webhook.</p>
  <button type="button" id="closeButton">Close this page</button>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const reference = params.get('reference') || params.get('trxref') || '';
  document.getElementById('reference').textContent =
    reference ? 'Reference: ' + reference : 'Payment reference received by Asiye';
  document.getElementById('closeButton').onclick = () => {
    window.close();
    setTimeout(() => history.back(), 150);
  };
})();
</script>
</body>
</html>
