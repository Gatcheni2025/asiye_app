<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard · Asye</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <!-- Google Maps Places API for autocomplete -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCX_euO2EEPhfhuG5DTsSi5vCpZ9MFZczY&libraries=places&callback=initAutocomplete" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #e8ecf4;
            min-height: 100vh;
        }

        /* ----- TOP NAV BAR ----- */
        .navbar {
            background: #141a24;
            border-bottom: 1px solid #2a3340;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .navbar .brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        .navbar .brand span {
            color: #5b7cfa;
        }
        .navbar .user-info {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            font-size: 0.85rem;
            color: #8b95a9;
        }
        .navbar .user-info .email {
            color: #e8ecf4;
        }
        .navbar .user-info .btn-logout {
            background: #2a3340;
            border: none;
            color: #f28b82;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .navbar .user-info .btn-logout:hover {
            background: #3a2a2a;
        }

        /* ----- MAIN LAYOUT ----- */
        .dashboard {
            display: grid;
            grid-template-columns: 240px 1fr;
            min-height: calc(100vh - 68px);
        }

        /* ----- SIDEBAR ----- */
        .sidebar {
            background: #10161e;
            border-right: 1px solid #1f2836;
            padding: 1.5rem 0;
        }
        .sidebar .menu-item {
            padding: 0.7rem 1.8rem;
            color: #8b95a9;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            border-left: 3px solid transparent;
        }
        .sidebar .menu-item:hover {
            background: #1a222e;
            color: #e8ecf4;
        }
        .sidebar .menu-item.active {
            color: #ffffff;
            background: #1a222e;
            border-left-color: #5b7cfa;
        }
        .sidebar .menu-item .icon {
            margin-right: 0.6rem;
        }
        .sidebar .divider {
            border-top: 1px solid #1f2836;
            margin: 0.8rem 1.5rem;
        }
        .sidebar .menu-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4d5b70;
            padding: 0.4rem 1.8rem;
        }

        /* ----- MAIN CONTENT ----- */
        .main-content {
            padding: 2rem 2.5rem;
            overflow-y: auto;
            max-height: calc(100vh - 68px);
        }
        .main-content .page-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }
        .main-content .page-sub {
            color: #8b95a9;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }

        /* ----- FORM ----- */
        .form-card {
            background: #141a24;
            border: 1px solid #2a3340;
            border-radius: 16px;
            padding: 1.8rem 2rem;
            max-width: 700px;
        }
        .form-card .form-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            color: #c8d0dc;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 0.3rem;
        }
        .form-group label .required {
            color: #f28b82;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            background: #1e2632;
            border: 1px solid #2f3a48;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: #f0f4fa;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.25s, box-shadow 0.25s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #5b7cfa;
            box-shadow: 0 0 0 4px rgba(91, 124, 250, 0.12);
        }
        .form-group input::placeholder {
            color: #5d6a7e;
        }
        .form-group select option {
            background: #141a24;
            color: #e8ecf4;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .btn-submit {
            background: #5b7cfa;
            border: none;
            border-radius: 40px;
            padding: 0.8rem 2.5rem;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(91, 124, 250, 0.3);
        }
        .btn-submit:hover {
            background: #4a6ae8;
            box-shadow: 0 6px 24px rgba(91, 124, 250, 0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-submit .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #2f3a48;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-msg {
            background: #1a2a1a;
            border: 1px solid #2a4a2a;
            border-radius: 12px;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            color: #6f8a6f;
            font-size: 0.85rem;
            display: none;
        }
        .success-msg.show {
            display: block;
        }
        .error-msg {
            background: #1e1a1f;
            border: 1px solid #4a2a2a;
            border-radius: 12px;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            color: #f28b82;
            font-size: 0.85rem;
            display: none;
        }
        .error-msg.show {
            display: block;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
            .main-content {
                padding: 1.5rem;
                max-height: none;
            }
            .navbar {
                padding: 0.6rem 1rem;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-card {
                padding: 1.2rem;
            }
        }
        @media print {
            .navbar, .sidebar { display: none; }
            .dashboard { display: block; }
        }

        /* Google Places autocomplete override */
        .pac-container {
            background: #1e2632;
            border: 1px solid #2f3a48;
            border-radius: 12px;
            margin-top: 4px;
            color: #e8ecf4;
            font-family: 'Inter', sans-serif;
        }
        .pac-item {
            color: #e8ecf4;
            padding: 0.6rem 1rem;
            border-bottom: 1px solid #2a3340;
        }
        .pac-item:hover {
            background: #2a3340;
        }
        .pac-item-query {
            color: #ffffff;
        }
        .pac-matched {
            color: #5b7cfa;
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- NAV BAR -->
    <!-- ============================================================ -->
    <nav class="navbar">
        <div class="brand">Asye<span>Admin</span></div>
        <div class="user-info">
            <span class="email" id="userEmail">Loading...</span>
            <button class="btn-logout" id="logoutBtn">Sign Out</button>
        </div>
    </nav>

    <!-- ============================================================ -->
    <!-- DASHBOARD -->
    <!-- ============================================================ -->
    <div class="dashboard">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="menu-item active"><span class="icon">📊</span> Dashboard</div>
            <div class="menu-item"><span class="icon">🚗</span> Vehicles</div>
            <div class="menu-item"><span class="icon">👥</span> Drivers</div>
            <div class="menu-item"><span class="icon">📝</span> Trips</div>
            <div class="divider"></div>
            <div class="menu-label">System</div>
            <div class="menu-item"><span class="icon">🔐</span> Security</div>
            <div class="menu-item"><span class="icon">⚙️</span> Settings</div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            <div class="page-title">🚗 Vehicle Registration</div>
            <div class="page-sub">Register a new vehicle in the system</div>

            <!-- Success / Error Messages -->
            <div id="successMsg" class="success-msg"></div>
            <div id="errorMsg" class="error-msg"></div>

            <!-- FORM -->
            <div class="form-card">
                <div class="form-title">Vehicle Details</div>

                <form id="vehicleForm" onsubmit="return false;">

                    <!-- Vehicle Type (Minibus taxis REMOVED) -->
                    <div class="form-group">
                        <label for="vehicleType">Vehicle Type <span class="required">*</span></label>
                        <select id="vehicleType" required>
                            <option value="">Select vehicle type...</option>
                            <option value="Sedan">Sedan</option>
                            <option value="SUV">SUV</option>
                            <option value="Hatchback">Hatchback</option>
                            <option value="Bakkie / Pickup">Bakkie / Pickup</option>
                            <option value="Van">Van</option>
                            <option value="Bus">Bus</option>
                            <option value="Truck">Truck</option>
                            <option value="Motorcycle">Motorcycle</option>
                            <option value="Bicycle">Bicycle</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- Vehicle Make -->
                    <div class="form-group">
                        <label for="vehicleMake">Make <span class="required">*</span></label>
                        <input type="text" id="vehicleMake" placeholder="e.g. Toyota, Ford, BMW" required />
                    </div>

                    <!-- Vehicle Model -->
                    <div class="form-group">
                        <label for="vehicleModel">Model <span class="required">*</span></label>
                        <input type="text" id="vehicleModel" placeholder="e.g. Corolla, F-150, X5" required />
                    </div>

                    <!-- Year & Color (row) -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="vehicleYear">Year</label>
                            <input type="number" id="vehicleYear" placeholder="e.g. 2020" min="1950" max="2026" />
                        </div>
                        <div class="form-group">
                            <label for="vehicleColor">Color</label>
                            <input type="text" id="vehicleColor" placeholder="e.g. Red, Blue, White" />
                        </div>
                    </div>

                    <!-- License Plate -->
                    <div class="form-group">
                        <label for="licensePlate">License Plate <span class="required">*</span></label>
                        <input type="text" id="licensePlate" placeholder="e.g. ABC 123 GP" required />
                    </div>

                    <!-- ========================================================== -->
                    <!-- AREA – with Google Places Autocomplete                     -->
                    <!-- (Replaces "Assigned Rank" – removed)                      -->
                    <!-- ========================================================== -->
                    <div class="form-group">
                        <label for="area">Area <span class="required">*</span></label>
                        <input type="text" id="area" placeholder="Start typing an address or location..." required />
                        <div style="font-size:0.7rem; color:#5d6a7e; margin-top:0.3rem;">
                            🌍 Type an address, city, or landmark for geo-location
                        </div>
                    </div>

                    <!-- Hidden fields for lat/lng (populated by autocomplete) -->
                    <input type="hidden" id="areaLat" />
                    <input type="hidden" id="areaLng" />

                    <!-- Submit -->
                    <button type="submit" class="btn-submit" id="submitBtn">
                        Register Vehicle
                    </button>
                </form>
            </div>

        </main>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT                                                   -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCX_euO2EEPhfhuG5DTsSi5vCpZ9MFZczY",
            authDomain: "asiye-80386.firebaseapp.com",
            databaseURL: "https://asiye-80386-default-rtdb.firebaseio.com",
            projectId: "asiye-80386",
            storageBucket: "asiye-80386.firebasestorage.app",
            appId: "1:531902350858:web:f8a4a246bf350d50e3c1f3"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // ============================================================
        // DOM REFS
        // ============================================================
        const userEmailEl = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');

        const vehicleForm = document.getElementById('vehicleForm');
        const vehicleType = document.getElementById('vehicleType');
        const vehicleMake = document.getElementById('vehicleMake');
        const vehicleModel = document.getElementById('vehicleModel');
        const vehicleYear = document.getElementById('vehicleYear');
        const vehicleColor = document.getElementById('vehicleColor');
        const licensePlate = document.getElementById('licensePlate');
        const areaInput = document.getElementById('area');
        const areaLat = document.getElementById('areaLat');
        const areaLng = document.getElementById('areaLng');
        const submitBtn = document.getElementById('submitBtn');

        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');

        // ============================================================
        // AUTH CHECK
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                userEmailEl.textContent = user.email || 'admin@asiye.cloud';
                console.log('✅ Dashboard loaded for:', user.email);
            } else {
                console.log('🔒 No user found, redirecting to login...');
                window.location.href = 'admin-login.html';
            }
        });

        // ============================================================
        // LOGOUT
        // ============================================================
        logoutBtn.addEventListener('click', function() {
            auth.signOut()
                .then(() => {
                    window.location.href = 'admin-login.html';
                })
                .catch((error) => {
                    alert('Error signing out: ' + error.message);
                });
        });

        // ============================================================
        // GOOGLE PLACES AUTOCOMPLETE
        // ============================================================
        let autocomplete;

        function initAutocomplete() {
            // Create the autocomplete object
            autocomplete = new google.maps.places.Autocomplete(areaInput, {
                types: ['geocode', 'establishment'],
                componentRestrictions: { country: 'za' } // Restrict to South Africa
            });

            // When a place is selected, populate lat/lng
            autocomplete.addListener('place_changed', function() {
                const place = autocomplete.getPlace();

                if (!place.geometry) {
                    // User entered a non-geocodable value
                    areaLat.value = '';
                    areaLng.value = '';
                    return;
                }

                const lat = place.geometry.location.lat();
                const lng = place.geometry.location.lng();

                areaLat.value = lat;
                areaLng.value = lng;

                console.log('📍 Location selected:', place.formatted_address, 'Lat:', lat, 'Lng:', lng);
            });
        }

        // Expose initAutocomplete globally for Google Maps callback
        window.initAutocomplete = initAutocomplete;

        // ============================================================
        // FORM SUBMISSION
        // ============================================================
        function showSuccess(message) {
            successMsg.textContent = message;
            successMsg.className = 'success-msg show';
            errorMsg.className = 'error-msg';
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.className = 'error-msg show';
            successMsg.className = 'success-msg';
        }

        function hideMessages() {
            successMsg.className = 'success-msg';
            errorMsg.className = 'error-msg';
        }

        function setButtonLoading(loading) {
            if (loading) {
                submitBtn.innerHTML = '<span class="spinner"></span> Saving...';
                submitBtn.disabled = true;
            } else {
                submitBtn.innerHTML = 'Register Vehicle';
                submitBtn.disabled = false;
            }
        }

        vehicleForm.addEventListener('submit', function(e) {
            e.preventDefault();
            hideMessages();

            // Validate required fields
            const type = vehicleType.value.trim();
            const make = vehicleMake.value.trim();
            const model = vehicleModel.value.trim();
            const plate = licensePlate.value.trim();
            const area = areaInput.value.trim();

            if (!type || !make || !model || !plate || !area) {
                showError('Please fill in all required fields (marked with *).');
                return;
            }

            // Get current user
            const user = auth.currentUser;
            if (!user) {
                showError('You must be logged in to register a vehicle.');
                return;
            }

            setButtonLoading(true);

            // Build vehicle data object
            const vehicleData = {
                type: type,
                make: make,
                model: model,
                year: vehicleYear.value.trim() || null,
                color: vehicleColor.value.trim() || null,
                licensePlate: plate.toUpperCase(),
                area: area,
                areaLat: areaLat.value || null,
                areaLng: areaLng.value || null,
                registeredBy: user.uid,
                registeredByEmail: user.email,
                registeredAt: firebase.database.ServerValue.TIMESTAMP,
                status: 'active'
            };

            // Save to Firebase Realtime Database
            const newVehicleRef = database.ref('vehicles').push();

            newVehicleRef.set(vehicleData)
                .then(() => {
                    setButtonLoading(false);
                    showSuccess('✅ Vehicle registered successfully!');

                    // Reset form (except area which we keep for reference)
                    vehicleType.value = '';
                    vehicleMake.value = '';
                    vehicleModel.value = '';
                    vehicleYear.value = '';
                    vehicleColor.value = '';
                    licensePlate.value = '';
                    // Keep area but clear lat/lng
                    areaLat.value = '';
                    areaLng.value = '';

                    // Log the new vehicle ID
                    console.log('🚗 Vehicle ID:', newVehicleRef.key);
                })
                .catch((error) => {
                    setButtonLoading(false);
                    showError('❌ Error saving vehicle: ' + error.message);
                    console.error('Firebase error:', error);
                });
        });

        // ============================================================
        // DEMO: Pre-fill with some test data (optional)
        // ============================================================
        // You can uncomment this to pre-fill the form for testing
        /*
        vehicleType.value = 'Sedan';
        vehicleMake.value = 'Toyota';
        vehicleModel.value = 'Corolla';
        vehicleYear.value = '2020';
        vehicleColor.value = 'Silver';
        licensePlate.value = 'ABC 123 GP';
        areaInput.value = 'Johannesburg, South Africa';
        areaLat.value = '-26.204103';
        areaLng.value = '28.047305';
        */

        console.log('✅ Admin dashboard ready.');
        console.log('📌 Vehicle Type: Minibus taxis removed.');
        console.log('📌 Assigned Rank removed.');
        console.log('📌 Area field with geo-location autocomplete added.');
    </script>

</body>
</html>
