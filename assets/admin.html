<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Asiye Admin | Operations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-functions.js"></script>

  <style>
    :root{
      --black:#111111;
      --black2:#1b1b1b;
      --white:#ffffff;
      --bg:#f4f4f2;
      --panel:#ffffff;
      --soft:#f0f0ed;
      --soft2:#f8f8f6;
      --line:#e6e6e3;
      --muted:#777777;
      --muted2:#9b9b9b;
      --green:#16845e;
      --green-bg:#eaf8f2;
      --amber:#9a6800;
      --amber-bg:#fff5d9;
      --red:#b23c3c;
      --red-bg:#fff0f0;
      --blue:#285d9f;
      --blue-bg:#edf5ff;
      --shadow:0 18px 50px rgba(0,0,0,.07);
      --font:"Manrope",sans-serif;
      --sidebar:250px;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{min-height:100%;font-family:var(--font);background:var(--bg);color:var(--black)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    [hidden]{display:none!important}

    .app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) 1fr}

    .sidebar{
      position:sticky;
      top:0;
      height:100vh;
      padding:22px 14px;
      background:#111;
      color:#fff;
      display:flex;
      flex-direction:column;
      z-index:40;
      overflow:auto;
    }

    .brand{
      height:56px;
      padding:0 12px;
      display:flex;
      align-items:center;
      gap:12px;
      border-bottom:1px solid rgba(255,255,255,.08);
      margin-bottom:18px;
    }

    .brand img{
      width:82px;
      height:42px;
      object-fit:contain;
      filter:brightness(0) invert(1);
    }

    .brand-copy{display:flex;flex-direction:column;gap:1px}
    .brand-copy strong{font-size:11px;letter-spacing:.08em;text-transform:uppercase}
    .brand-copy span{font-size:8px;color:#888;text-transform:uppercase;letter-spacing:.08em}

    .nav-label{
      padding:14px 12px 7px;
      color:#666;
      font-size:8px;
      font-weight:800;
      letter-spacing:.11em;
      text-transform:uppercase;
    }

    .nav-item{
      width:100%;
      min-height:44px;
      padding:0 12px;
      margin:2px 0;
      border:0;
      border-radius:13px;
      background:transparent;
      color:#aaa;
      display:flex;
      align-items:center;
      gap:11px;
      text-align:left;
      font-size:11px;
      font-weight:700;
      transition:.18s ease;
    }

    .nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
    .nav-item.active{background:#fff;color:#111}

    .nav-icon{
      width:25px;height:25px;border-radius:9px;
      display:grid;place-items:center;
      background:rgba(255,255,255,.07);
      font-size:10px;font-weight:800;
      flex:0 0 auto;
    }

    .nav-item.active .nav-icon{background:#ededeb}
    .nav-count{
      margin-left:auto;
      min-width:22px;
      height:20px;
      padding:0 6px;
      border-radius:999px;
      background:rgba(255,255,255,.10);
      display:grid;
      place-items:center;
      color:#ccc;
      font-size:8px;
      font-weight:800;
    }
    .nav-item.active .nav-count{background:#eee;color:#111}

    .sidebar-footer{
      margin-top:auto;
      padding:16px 12px 4px;
      border-top:1px solid rgba(255,255,255,.08);
    }

    .admin-mini{
      display:flex;align-items:center;gap:10px;
      min-width:0;
    }

    .admin-avatar{
      width:36px;height:36px;border-radius:50%;
      background:#2b2b2b;
      display:grid;place-items:center;
      font-size:10px;font-weight:800;
      flex:0 0 auto;
    }

    .admin-mini-copy{min-width:0;flex:1}
    .admin-mini-copy strong,
    .admin-mini-copy span{
      display:block;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .admin-mini-copy strong{font-size:9px}
    .admin-mini-copy span{margin-top:2px;color:#777;font-size:8px}

    .logout{
      margin-top:11px;
      width:100%;
      height:38px;
      border:1px solid rgba(255,255,255,.10);
      border-radius:11px;
      background:transparent;
      color:#aaa;
      font-size:9px;
      font-weight:800;
    }

    .main{min-width:0;min-height:100vh}

    .topbar{
      position:sticky;
      top:0;
      z-index:30;
      height:78px;
      padding:0 28px;
      border-bottom:1px solid var(--line);
      background:rgba(244,244,242,.91);
      backdrop-filter:blur(16px);
      display:flex;
      align-items:center;
      gap:16px;
    }

    .mobile-menu{
      width:42px;height:42px;border:0;border-radius:12px;
      background:#111;color:#fff;display:none;place-items:center;
      font-size:17px;
    }

    .page-identity{min-width:170px}
    .page-identity small{
      display:block;color:#999;font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase
    }
    .page-identity strong{
      display:block;margin-top:2px;font-size:18px;letter-spacing:-.035em
    }

    .search{
      flex:1;
      max-width:560px;
      height:46px;
      margin-left:auto;
      padding:0 15px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fff;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .search span{color:#999;font-size:13px}
    .search input{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      color:#111;
      font-size:11px;
      font-weight:700;
    }

    .top-action{
      height:42px;
      padding:0 15px;
      border:1px solid var(--line);
      border-radius:13px;
      background:#fff;
      color:#111;
      font-size:10px;
      font-weight:800;
    }

    .content{padding:28px;max-width:1500px;margin:0 auto}
    .hero-row{
      display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px
    }
    .hero-row h1{font-size:32px;line-height:1;letter-spacing:-.05em}
    .hero-row p{margin-top:8px;color:#777;font-size:11px;line-height:1.6;max-width:620px}
    .hero-meta{color:#999;font-size:9px;text-align:right}

    .notice{
      margin-bottom:18px;
      padding:13px 15px;
      border-radius:14px;
      background:#fff;
      border:1px solid var(--line);
      color:#666;
      font-size:10px;
      line-height:1.6;
    }
    .notice strong{color:#111}

    .stats{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:12px;
      margin-bottom:20px;
    }
    .stat{
      min-height:120px;
      padding:18px;
      border-radius:20px;
      background:#fff;
      border:1px solid var(--line);
      box-shadow:0 8px 28px rgba(0,0,0,.025);
    }
    .stat-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .stat-label{color:#888;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
    .stat-dot{width:9px;height:9px;border-radius:50%;background:#111}
    .stat strong{display:block;margin-top:18px;font-size:30px;line-height:1;letter-spacing:-.055em}
    .stat span{display:block;margin-top:7px;color:#999;font-size:9px}

    .grid-2{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
    .panel{
      border-radius:22px;
      background:#fff;
      border:1px solid var(--line);
      overflow:hidden;
    }
    .panel-head{
      min-height:62px;
      padding:14px 17px;
      border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;gap:12px
    }
    .panel-head h3{font-size:13px;letter-spacing:-.02em}
    .panel-head p{margin-top:3px;color:#999;font-size:8px}
    .panel-body{padding:14px}

    .toolbar{
      margin-bottom:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .filters{display:flex;gap:7px;flex-wrap:wrap}
    .filter{
      height:34px;
      padding:0 12px;
      border:1px solid var(--line);
      border-radius:999px;
      background:#fff;
      color:#777;
      font-size:9px;
      font-weight:800;
    }
    .filter.active{background:#111;color:#fff;border-color:#111}

    .table-wrap{
      overflow:auto;
      border-radius:18px;
      border:1px solid var(--line);
      background:#fff;
    }
    table{
      width:100%;
      border-collapse:collapse;
      min-width:820px;
    }
    th{
      padding:11px 13px;
      background:#f8f8f6;
      border-bottom:1px solid var(--line);
      color:#888;
      font-size:8px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.06em;
      text-align:left;
    }
    td{
      padding:13px;
      border-bottom:1px solid #eeeeeb;
      font-size:10px;
      color:#4d4d4d;
      vertical-align:middle;
    }
    tbody tr:last-child td{border-bottom:0}
    tbody tr:hover{background:#fcfcfb}
    .primary-text{color:#111;font-weight:800}
    .secondary-text{margin-top:3px;color:#999;font-size:8px}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px}

    .avatar{
      width:38px;height:38px;border-radius:50%;
      background:#ececea;overflow:hidden;
      display:grid;place-items:center;
      color:#555;font-size:9px;font-weight:800;
      flex:0 0 auto;
    }
    .avatar img{width:100%;height:100%;object-fit:cover}

    .person{display:flex;align-items:center;gap:10px;min-width:180px}

    .badge{
      display:inline-flex;
      min-height:24px;
      padding:0 9px;
      border-radius:999px;
      align-items:center;
      font-size:8px;
      font-weight:800;
      text-transform:capitalize;
      white-space:nowrap;
      background:#eee;color:#555;
    }
    .badge.green{background:var(--green-bg);color:var(--green)}
    .badge.amber{background:var(--amber-bg);color:var(--amber)}
    .badge.red{background:var(--red-bg);color:var(--red)}
    .badge.blue{background:var(--blue-bg);color:var(--blue)}

    .row-actions{display:flex;gap:6px;flex-wrap:wrap}
    .btn{
      min-height:34px;
      padding:0 12px;
      border:1px solid var(--line);
      border-radius:10px;
      background:#fff;
      color:#111;
      font-size:9px;
      font-weight:800;
      white-space:nowrap;
    }
    .btn.dark{background:#111;color:#fff;border-color:#111}
    .btn.green{background:var(--green);color:#fff;border-color:var(--green)}
    .btn.red{background:var(--red);color:#fff;border-color:var(--red)}
    .btn.soft{background:#f3f3f0}
    .btn:disabled{opacity:.45;cursor:not-allowed}

    .empty{
      padding:52px 20px;
      text-align:center;
      color:#999;
    }
    .empty strong{display:block;color:#333;font-size:14px}
    .empty span{display:block;margin-top:7px;font-size:10px}

    .activity-list{display:grid;gap:8px}
    .activity{
      padding:12px;
      border-radius:14px;
      background:#f7f7f5;
      display:grid;
      grid-template-columns:32px 1fr auto;
      gap:10px;
      align-items:center;
    }
    .activity-icon{
      width:32px;height:32px;border-radius:10px;
      background:#111;color:#fff;
      display:grid;place-items:center;
      font-size:9px;font-weight:800;
    }
    .activity strong{display:block;font-size:9px}
    .activity p{margin-top:3px;color:#888;font-size:8px;line-height:1.45}
    .activity time{color:#aaa;font-size:8px;white-space:nowrap}

    .loading{
      min-height:340px;
      display:grid;
      place-items:center;
      text-align:center;
      color:#888;
    }
    .spinner{
      width:34px;height:34px;
      margin:0 auto 12px;
      border:3px solid #e5e5e2;
      border-top-color:#111;
      border-radius:50%;
      animation:spin .7s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}

    .modal-backdrop{
      position:fixed;
      inset:0;
      z-index:100;
      padding:18px;
      background:rgba(17,17,17,.66);
      backdrop-filter:blur(8px);
      display:none;
      align-items:center;
      justify-content:center;
    }
    .modal-backdrop.open{display:flex}
    .modal{
      width:min(100%,780px);
      max-height:min(90vh,900px);
      overflow:auto;
      border-radius:28px;
      background:#fff;
      box-shadow:0 30px 100px rgba(0,0,0,.25);
    }
    .modal-head{
      position:sticky;top:0;z-index:2;
      min-height:70px;
      padding:15px 18px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.96);
      backdrop-filter:blur(10px);
      display:flex;align-items:center;justify-content:space-between;gap:12px;
    }
    .modal-head small{display:block;color:#999;font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    .modal-head h2{margin-top:3px;font-size:18px;letter-spacing:-.035em}
    .modal-close{
      width:38px;height:38px;border:0;border-radius:50%;
      background:#f1f1ee;color:#111;font-size:17px;
    }
    .modal-body{padding:18px}
    .modal-section{
      padding:16px;
      margin-bottom:12px;
      border-radius:18px;
      background:#f7f7f5;
      border:1px solid #eeeeeb;
    }
    .modal-section h3{font-size:11px;margin-bottom:12px}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .field label{
      display:block;
      color:#777;
      font-size:8px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.05em;
    }
    .field input,.field select,.field textarea{
      width:100%;
      min-height:43px;
      margin-top:6px;
      padding:9px 11px;
      border:1px solid #ddd;
      border-radius:11px;
      outline:none;
      background:#fff;
      color:#111;
      font-size:10px;
      font-weight:700;
    }
    .field textarea{min-height:90px;resize:vertical;line-height:1.5}
    .field input:focus,.field select:focus,.field textarea:focus{
      border-color:#111;box-shadow:0 0 0 3px rgba(17,17,17,.05)
    }
    .field.full{grid-column:1/-1}
    .detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
    .detail{
      padding:11px;
      border-radius:12px;
      background:#fff;
      border:1px solid #e9e9e6;
    }
    .detail small{display:block;color:#999;font-size:7px;font-weight:800;text-transform:uppercase}
    .detail strong{display:block;margin-top:4px;font-size:10px;word-break:break-word}
    .docs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .doc{
      min-height:55px;padding:10px;border-radius:12px;background:#fff;border:1px solid #e8e8e5;
      display:flex;align-items:center;justify-content:space-between;gap:10px
    }
    .doc strong{font-size:9px}
    .doc a{color:#28609f;font-size:8px;font-weight:800}
    .modal-actions{
      padding:15px 18px;
      border-top:1px solid var(--line);
      display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;
      background:#fff;
    }

    .toast-wrap{
      position:fixed;right:18px;bottom:18px;z-index:200;
      display:grid;gap:8px;width:min(380px,calc(100% - 36px))
    }
    .toast{
      padding:13px 15px;border-radius:14px;
      background:#111;color:#fff;
      box-shadow:var(--shadow);
      font-size:10px;font-weight:700;line-height:1.5;
      animation:toastIn .2s ease
    }
    .toast.success{background:#176d51}
    .toast.error{background:#9f3838}
    @keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

    .sidebar-overlay{display:none}

    @media(max-width:1100px){
      .stats{grid-template-columns:repeat(2,1fr)}
      .grid-2{grid-template-columns:1fr}
    }

    @media(max-width:820px){
      .app{grid-template-columns:1fr}
      .sidebar{
        position:fixed;left:-270px;top:0;width:250px;
        transition:left .22s ease;
      }
      .sidebar.open{left:0}
      .sidebar-overlay{
        position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.35)
      }
      .sidebar-overlay.open{display:block}
      .mobile-menu{display:grid}
      .topbar{height:70px;padding:0 14px}
      .page-identity{min-width:0}
      .page-identity strong{font-size:15px}
      .search{display:none}
      .top-action{margin-left:auto}
      .content{padding:18px 14px 26px}
      .hero-row{align-items:flex-start;flex-direction:column}
      .hero-meta{text-align:left}
      .fields,.detail-grid,.docs{grid-template-columns:1fr}
    }

    @media(max-width:520px){
      .stats{grid-template-columns:1fr 1fr;gap:8px}
      .stat{min-height:100px;padding:14px}
      .stat strong{font-size:25px;margin-top:13px}
      .hero-row h1{font-size:27px}
      .modal-backdrop{padding:0;align-items:flex-end}
      .modal{width:100%;max-height:94vh;border-radius:25px 25px 0 0}
      .modal-actions .btn{flex:1}
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="data/AsiyeNew.png" alt="Asiye" onerror="this.style.display='none'">
        <div class="brand-copy">
          <strong>Admin</strong>
          <span>Operations</span>
        </div>
      </div>

      <div class="nav-label">Platform</div>

      <button class="nav-item active" data-view="overview">
        <span class="nav-icon">O</span>
        Overview
      </button>

      <button class="nav-item" data-view="registrations">
        <span class="nav-icon">R</span>
        Registrations
        <span class="nav-count" id="navRegistrations">0</span>
      </button>

      <button class="nav-item" data-view="drivers">
        <span class="nav-icon">D</span>
        Drivers
        <span class="nav-count" id="navDrivers">0</span>
      </button>

      <button class="nav-item" data-view="passengers">
        <span class="nav-icon">P</span>
        Passengers
        <span class="nav-count" id="navPassengers">0</span>
      </button>

      <div class="nav-label">Operations</div>

      <button class="nav-item" data-view="bookings">
        <span class="nav-icon">B</span>
        Bookings
        <span class="nav-count" id="navBookings">0</span>
      </button>

      <button class="nav-item" data-view="work">
        <span class="nav-icon">W</span>
        Asiye Work
        <span class="nav-count" id="navWork">0</span>
      </button>

      <button class="nav-item" data-view="deliveries">
        <span class="nav-icon">L</span>
        Deliveries
        <span class="nav-count" id="navDeliveries">0</span>
      </button>

      <button class="nav-item" data-view="support">
        <span class="nav-icon">S</span>
        Support
        <span class="nav-count" id="navSupport">0</span>
      </button>

      <div class="nav-label">Finance</div>

      <button class="nav-item" data-view="payments">
        <span class="nav-icon">R</span>
        Payments
      </button>

      <button class="nav-item" data-view="payouts">
        <span class="nav-icon">↗</span>
        Payouts
        <span class="nav-count" id="navPayouts">0</span>
      </button>

      <button class="nav-item" data-view="audit">
        <span class="nav-icon">A</span>
        Audit
      </button>

      <div class="sidebar-footer">
        <div class="admin-mini">
          <div class="admin-avatar" id="adminAvatar">AD</div>
          <div class="admin-mini-copy">
            <strong>Asiye Admin</strong>
            <span id="adminEmail">Checking access…</span>
          </div>
        </div>
        <button class="logout" id="logoutButton">Sign out</button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <section class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open navigation">☰</button>

        <div class="page-identity">
          <small>Asiye Admin</small>
          <strong id="topTitle">Overview</strong>
        </div>

        <label class="search">
          <span>⌕</span>
          <input id="globalSearch" type="search" placeholder="Search the current section">
        </label>

        <button class="top-action" id="refreshButton">Refresh</button>
      </header>

      <main class="content" id="content">
        <div class="loading">
          <div>
            <div class="spinner"></div>
            <strong>Loading Asiye operations…</strong>
          </div>
        </div>
      </main>
    </section>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <div>
          <small id="modalKicker">Details</small>
          <h2 id="modalTitle">Record</h2>
        </div>
        <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      </header>
      <div class="modal-body" id="modalBody"></div>
      <footer class="modal-actions" id="modalActions"></footer>
    </section>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCX_euO2EEPhfhuG5DTsSi5vCpZ9MFZczY",
      authDomain: "asiye-80386.firebaseapp.com",
      databaseURL: "https://asiye-80386-default-rtdb.firebaseio.com",
      projectId: "asiye-80386",
      storageBucket: "asiye-80386.firebasestorage.app",
      appId: "1:531902350858:web:f8a4a246bf350d50e3c1f3"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();
    const functions = firebase.functions();

    const callable = {
      who: functions.httpsCallable("adminWhoAmI"),
      fetch: functions.httpsCallable("adminFetchData"),
      manage: functions.httpsCallable("adminManagePlatform"),
      reviewEnrollment: functions.httpsCallable("reviewDriverEnrollment")
    };

    const state = {
      ready: false,
      loading: false,
      view: "overview",
      filter: "all",
      search: "",
      admin: null,
      data: {
        commuters: [],
        taxis: [],
        driverEnrollments: [],
        driverApprovals: [],
        driver_applications: [],
        requests: [],
        delivery_requests: [],
        support_chats: [],
        walletPayments: [],
        walletAdjustments: [],
        withdrawals: [],
        payout_requests: [],
        adminAudit: []
      }
    };

    const resourceLimits = {
      commuters: 500,
      taxis: 500,
      driverEnrollments: 500,
      driverApprovals: 500,
      driver_applications: 500,
      requests: 500,
      delivery_requests: 350,
      support_chats: 350,
      walletPayments: 350,
      walletAdjustments: 350,
      withdrawals: 350,
      payout_requests: 350,
      adminAudit: 350
    };

    const contentEl = document.getElementById("content");
    const searchEl = document.getElementById("globalSearch");
    const topTitle = document.getElementById("topTitle");
    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const modalBody = document.getElementById("modalBody");
    const modalTitle = document.getElementById("modalTitle");
    const modalKicker = document.getElementById("modalKicker");
    const modalActions = document.getElementById("modalActions");

    function esc(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function money(value) {
      const number = Number(value || 0);
      return "R" + (Number.isFinite(number) ? number : 0).toLocaleString("en-ZA", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function when(value) {
      const number = Number(value || 0);
      if (!number) return "—";
      try {
        return new Date(number).toLocaleString("en-ZA", {
          dateStyle: "medium",
          timeStyle: "short"
        });
      } catch (_) {
        return "—";
      }
    }

    function shortId(value) {
      const text = String(value || "");
      if (text.length <= 14) return text || "—";
      return text.slice(0, 6) + "…" + text.slice(-5);
    }

    function initials(name) {
      const parts = String(name || "Asiye").trim().split(/\s+/).filter(Boolean);
      return (parts[0]?.[0] || "A") + (parts[1]?.[0] || "");
    }

    function safeImage(value) {
      const url = String(value || "").trim();
      return /^https:\/\//i.test(url) ? url : "";
    }

    function avatar(name, image) {
      const url = safeImage(image);
      return '<div class="avatar">' +
        (url ? '<img src="' + esc(url) + '" alt="">' : esc(initials(name))) +
      '</div>';
    }

    function badge(status) {
      const value = String(status || "unknown").toLowerCase();
      let tone = "";
      if (["verified","approved","active","complete","completed","paid","successful","resolved","online"].includes(value)) tone = "green";
      else if (["pending","pending_review","awaiting_payment","sending","searching","pooling","driver_waiting","waiting_members","driver_busy"].includes(value)) tone = "amber";
      else if (["rejected","cancelled","cancelled_by_admin","cancelled_by_driver","cancelled_by_commuter","failed","instructions_failed","suspended","closed"].includes(value)) tone = "red";
      else if (["accepted","driver_on_way","arrived","in_transit","pool_ready","all_onboard","passenger_onboard"].includes(value)) tone = "blue";
      return '<span class="badge ' + tone + '">' + esc(value.replaceAll("_"," ")) + '</span>';
    }

    function objectToArray(object) {
      if (!object || typeof object !== "object") return [];
      return Object.entries(object).map(function(entry) {
        const key = entry[0];
        const value = entry[1];
        return Object.assign({ key: key }, value && typeof value === "object" ? value : { value: value });
      });
    }

    function byTime(list) {
      return [...list].sort(function(a,b) {
        const ta = Number(a.timestamp || a.createdAt || a.submittedAt || a.reviewedAt || a.updatedAt || a.completedAt || 0);
        const tb = Number(b.timestamp || b.createdAt || b.submittedAt || b.reviewedAt || b.updatedAt || b.completedAt || 0);
        return tb - ta;
      });
    }

    function toast(message, type) {
      const wrap = document.getElementById("toastWrap");
      const element = document.createElement("div");
      element.className = "toast" + (type ? " " + type : "");
      element.textContent = message;
      wrap.appendChild(element);
      setTimeout(function() {
        element.remove();
      }, 4300);
    }

    function openModal(kicker, title, body, actions) {
      modalKicker.textContent = kicker || "Details";
      modalTitle.textContent = title || "Record";
      modalBody.innerHTML = body || "";
      modalActions.innerHTML = actions || "";
      modalBackdrop.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      modalBackdrop.classList.remove("open");
      document.body.style.overflow = "";
      modalBody.innerHTML = "";
      modalActions.innerHTML = "";
    }

    document.getElementById("modalClose").onclick = closeModal;
    modalBackdrop.addEventListener("click", function(event) {
      if (event.target === modalBackdrop) closeModal();
    });

    function detail(label, value) {
      return '<div class="detail"><small>' + esc(label) + '</small><strong>' + esc(value == null || value === "" ? "—" : value) + '</strong></div>';
    }

    function field(id, label, value, type, extra) {
      return '<div class="field ' + (extra || "") + '">' +
        '<label for="' + esc(id) + '">' + esc(label) + '</label>' +
        '<input id="' + esc(id) + '" type="' + esc(type || "text") + '" value="' + esc(value == null ? "" : value) + '">' +
      '</div>';
    }

    function selectField(id, label, value, options, extra) {
      let html = '<div class="field ' + (extra || "") + '"><label for="' + esc(id) + '">' + esc(label) + '</label><select id="' + esc(id) + '">';
      options.forEach(function(option) {
        const optionValue = typeof option === "string" ? option : option.value;
        const optionLabel = typeof option === "string" ? option.replaceAll("_"," ") : option.label;
        html += '<option value="' + esc(optionValue) + '"' + (String(value) === String(optionValue) ? " selected" : "") + '>' + esc(optionLabel) + '</option>';
      });
      html += '</select></div>';
      return html;
    }

    function textArea(id, label, value, extra) {
      return '<div class="field ' + (extra || "") + '"><label for="' + esc(id) + '">' + esc(label) + '</label><textarea id="' + esc(id) + '">' + esc(value || "") + '</textarea></div>';
    }

    function emptyState(title, copy) {
      return '<div class="empty"><strong>' + esc(title) + '</strong><span>' + esc(copy) + '</span></div>';
    }

    function personCell(name, subtitle, image) {
      return '<div class="person">' +
        avatar(name, image) +
        '<div><div class="primary-text">' + esc(name || "Unknown") + '</div><div class="secondary-text">' + esc(subtitle || "") + '</div></div>' +
      '</div>';
    }

    function getApprovalMap() {
      const map = {};
      state.data.driverApprovals.forEach(function(item) {
        map[item.key] = item;
      });
      return map;
    }

    function registrations() {
      const approvals = getApprovalMap();
      const modern = state.data.driverEnrollments.map(function(item) {
        const approval = approvals[item.key] || {};
        return Object.assign({}, item, {
          source: "modern",
          displayStatus: approval.status || item.status || "pending"
        });
      });

      const modernIds = new Set(modern.map(function(item) { return item.key; }));

      const legacy = state.data.driver_applications
        .filter(function(item) {
          const id = item.authUid || item.userUid || item.key;
          return !modernIds.has(id);
        })
        .map(function(item) {
          return Object.assign({}, item, {
            source: "legacy",
            displayStatus: item.status || "pending"
          });
        });

      return byTime(modern.concat(legacy));
    }

    function passengerName(item) {
      return item.name || item.fullName || item.firstName || "Passenger";
    }

    function driverName(item) {
      return item.name || item.fullName || [item.firstName,item.surname].filter(Boolean).join(" ") || "Driver";
    }

    function requestName(item) {
      return item.commuterName || item.sender?.name || item.passengerName || "Passenger";
    }

    function requestFare(item) {
      return Number(item.finalAmount || item.agreedFare || item.calculatedPrice || item.totalPoolFare || 0);
    }

    function requestTime(item) {
      return item.createdAt || item.timestamp || item.acceptedAt || 0;
    }

    function terminalStatus(status) {
      return ["completed","cancelled_by_admin","cancelled_by_driver","cancelled_by_commuter","rejected"].includes(String(status || ""));
    }

    function activeRequests() {
      return state.data.requests.filter(function(item) {
        return !terminalStatus(item.status);
      });
    }

    function workRequests() {
      return state.data.requests.filter(function(item) {
        return item.type === "club";
      });
    }

    function deliveryRecords() {
      const map = new Map();
      state.data.delivery_requests.forEach(function(item) {
        map.set(item.key, item);
      });
      state.data.requests.filter(function(item) {
        return item.type === "delivery";
      }).forEach(function(item) {
        if (!map.has(item.key)) map.set(item.key, item);
      });
      return byTime([...map.values()]);
    }

    function openSupportCount() {
      return state.data.support_chats.filter(function(item) {
        return !["resolved","closed"].includes(String(item.status || "open"));
      }).length;
    }

    function pendingPayouts() {
      return state.data.payout_requests.filter(function(item) {
        return String(item.status || "pending") === "pending";
      }).length + state.data.withdrawals.filter(function(item) {
        return String(item.status || "pending") === "pending";
      }).length;
    }

    function pendingRegistrations() {
      return registrations().filter(function(item) {
        return ["pending","pending_review"].includes(String(item.displayStatus || ""));
      }).length;
    }

    function updateNavCounts() {
      document.getElementById("navRegistrations").textContent = pendingRegistrations();
      document.getElementById("navDrivers").textContent = state.data.taxis.length;
      document.getElementById("navPassengers").textContent = state.data.commuters.length;
      document.getElementById("navBookings").textContent = activeRequests().filter(function(item){ return item.type !== "club" && item.type !== "delivery"; }).length;
      document.getElementById("navWork").textContent = workRequests().filter(function(item){ return !terminalStatus(item.status); }).length;
      document.getElementById("navDeliveries").textContent = deliveryRecords().filter(function(item){ return !terminalStatus(item.status); }).length;
      document.getElementById("navSupport").textContent = openSupportCount();
      document.getElementById("navPayouts").textContent = pendingPayouts();
    }

    function filterSearch(list) {
      const query = state.search.trim().toLowerCase();
      if (!query) return list;
      return list.filter(function(item) {
        return JSON.stringify(item).toLowerCase().includes(query);
      });
    }

    async function fetchResource(name) {
      const result = await callable.fetch({
        resource: name,
        limit: resourceLimits[name] || 250
      });

      state.data[name] = objectToArray(result?.data?.data || {});
    }

    async function loadData(showLoading) {
      if (state.loading) return;
      state.loading = true;

      if (showLoading !== false) {
        contentEl.innerHTML = '<div class="loading"><div><div class="spinner"></div><strong>Loading Asiye operations…</strong></div></div>';
      }

      const resources = Object.keys(resourceLimits);
      const results = await Promise.allSettled(resources.map(fetchResource));

      const failed = [];
      results.forEach(function(result, index) {
        if (result.status === "rejected") failed.push(resources[index]);
      });

      state.loading = false;
      state.ready = true;
      updateNavCounts();

      if (failed.length) {
        toast("Some admin data could not load: " + failed.join(", "), "error");
      }

      renderCurrent();
    }

    function pageHeader(title, copy, meta) {
      return '<div class="hero-row">' +
        '<div><h1>' + esc(title) + '</h1><p>' + esc(copy) + '</p></div>' +
        '<div class="hero-meta">' + esc(meta || "Latest records loaded from Asiye") + '</div>' +
      '</div>';
    }

    function statsHtml(cards) {
      return '<div class="stats">' + cards.map(function(card) {
        return '<article class="stat">' +
          '<div class="stat-top"><div class="stat-label">' + esc(card.label) + '</div><span class="stat-dot" style="background:' + esc(card.dot || "#111") + '"></span></div>' +
          '<strong>' + esc(card.value) + '</strong>' +
          '<span>' + esc(card.copy || "") + '</span>' +
        '</article>';
      }).join("") + '</div>';
    }

    function table(headers, rows, emptyTitle) {
      if (!rows.length) return emptyState(emptyTitle || "No records found", "Try another filter or refresh the dashboard.");
      return '<div class="table-wrap"><table><thead><tr>' +
        headers.map(function(header) { return '<th>' + esc(header) + '</th>'; }).join("") +
        '</tr></thead><tbody>' + rows.join("") + '</tbody></table></div>';
    }

    function renderOverview() {
      const pending = pendingRegistrations();
      const active = activeRequests();
      const verified = state.data.taxis.filter(function(item) {
        return item.verificationStatus === "verified" || item.provisionalActivation === true;
      }).length;
      const successfulPayments = state.data.walletPayments.filter(function(item) {
        return String(item.status || "").toLowerCase() === "complete";
      });
      const paymentValue = successfulPayments.reduce(function(sum,item) {
        return sum + Number(item.amount || 0);
      },0);

      const latestOps = byTime(
        active.map(function(item) {
          return {
            kind: item.type === "club" ? "Work" : item.type === "delivery" ? "Delivery" : "Ride",
            title: requestName(item),
            copy: (item.pickupAddress || "Pickup") + " → " + (item.destination || item.destinationName || "Destination"),
            time: requestTime(item),
            status: item.status
          };
        })
      ).slice(0,7);

      const audits = byTime(state.data.adminAudit).slice(0,7);

      contentEl.innerHTML =
        pageHeader(
          "Platform overview",
          "A live operational view of registrations, active movement, customer support and money moving through Asiye.",
          "Showing up to the latest 500 records per area"
        ) +
        '<div class="notice"><strong>Admin actions are server-verified.</strong> Driver approvals, wallet adjustments, booking changes and payout updates are written through Firebase Functions and recorded in the audit trail.</div>' +
        statsHtml([
          {label:"Passengers",value:state.data.commuters.length,copy:"Loaded passenger profiles",dot:"#111"},
          {label:"Verified drivers",value:verified,copy:"Approved driver profiles",dot:"#16845e"},
          {label:"Pending registrations",value:pending,copy:"Needs an admin decision",dot:"#d19316"},
          {label:"Active operations",value:active.length,copy:"Ride, Work and delivery requests",dot:"#285d9f"},
          {label:"Open support",value:openSupportCount(),copy:"Support records awaiting closure",dot:"#8a5eab"},
          {label:"Pending payouts",value:pendingPayouts(),copy:"Withdrawal or payout review",dot:"#b66b21"},
          {label:"Wallet payments",value:successfulPayments.length,copy:"Verified completed top-ups",dot:"#16845e"},
          {label:"Loaded payment value",value:money(paymentValue),copy:"From loaded completed wallet payments",dot:"#111"}
        ]) +
        '<div class="grid-2">' +
          '<section class="panel"><div class="panel-head"><div><h3>Active movement</h3><p>Current requests across the platform</p></div><button class="btn soft" onclick="setView(\'bookings\')">Open bookings</button></div><div class="panel-body">' +
            (latestOps.length ? '<div class="activity-list">' + latestOps.map(function(item) {
              return '<div class="activity"><div class="activity-icon">' + esc(item.kind[0]) + '</div><div><strong>' + esc(item.kind + " · " + item.title) + '</strong><p>' + esc(item.copy) + '</p></div><div>' + badge(item.status) + '</div></div>';
            }).join("") + '</div>' : emptyState("No active requests","New ride, Work and delivery requests will appear here.")) +
          '</div></section>' +
          '<section class="panel"><div class="panel-head"><div><h3>Admin activity</h3><p>Recent sensitive operational changes</p></div><button class="btn soft" onclick="setView(\'audit\')">Full audit</button></div><div class="panel-body">' +
            (audits.length ? '<div class="activity-list">' + audits.map(function(item) {
              return '<div class="activity"><div class="activity-icon">A</div><div><strong>' + esc(String(item.action || "admin action").replaceAll("_"," ")) + '</strong><p>' + esc(shortId(item.target)) + ' · ' + esc(item.adminEmail || shortId(item.adminUid)) + '</p></div><time>' + esc(when(item.createdAt)) + '</time></div>';
            }).join("") + '</div>' : emptyState("No audit entries yet","Admin actions will be recorded here after the new backend is deployed.")) +
          '</div></section>' +
        '</div>';
    }

    function renderRegistrations() {
      let list = filterSearch(registrations());

      if (state.filter !== "all") {
        list = list.filter(function(item) {
          if (state.filter === "pending") return ["pending","pending_review"].includes(String(item.displayStatus || ""));
          return String(item.displayStatus || "") === state.filter;
        });
      }

      const rows = list.map(function(item) {
        const vehicle = [item.vehicleMake || item.vehiclePending?.make, item.vehicleModel || item.vehiclePending?.model].filter(Boolean).join(" ");
        return '<tr>' +
          '<td>' + personCell(item.fullName || item.name || "Driver applicant", item.phone || item.email || shortId(item.key), item.profile_picture_url || item.documents?.selfie || item.documents?.FACE) + '</td>' +
          '<td><div class="primary-text">' + esc(vehicle || "Vehicle not supplied") + '</div><div class="secondary-text">' + esc(item.vehicleReg || item.vehiclePending?.registration || "—") + '</div></td>' +
          '<td>' + badge(item.displayStatus) + '<div class="secondary-text">' + esc(item.source === "modern" ? "New enrollment" : "Legacy application") + '</div></td>' +
          '<td>' + esc(when(item.submittedAt || item.createdAt)) + '</td>' +
          '<td><div class="row-actions"><button class="btn dark" onclick="openRegistration(\'' + esc(item.source) + '\',\'' + esc(item.key) + '\')">Review</button></div></td>' +
        '</tr>';
      });

      contentEl.innerHTML =
        pageHeader("Driver registrations","Review the current driver enrollment flow and older applications from one place.") +
        '<div class="toolbar"><div class="filters">' +
          '<button class="filter ' + (state.filter === "all" ? "active" : "") + '" onclick="setFilter(\'all\')">All</button>' +
          '<button class="filter ' + (state.filter === "pending" ? "active" : "") + '" onclick="setFilter(\'pending\')">Pending</button>' +
          '<button class="filter ' + (state.filter === "approved" ? "active" : "") + '" onclick="setFilter(\'approved\')">Approved</button>' +
          '<button class="filter ' + (state.filter === "rejected" ? "active" : "") + '" onclick="setFilter(\'rejected\')">Rejected</button>' +
        '</div><div class="hero-meta">' + esc(list.length) + ' records</div></div>' +
        table(["Applicant","Vehicle","Status","Submitted","Action"],rows,"No driver registrations");
    }

    function renderDrivers() {
      let list = filterSearch(byTime(state.data.taxis));

      if (state.filter === "online") list = list.filter(function(item){ return item.isOnline === true; });
      if (state.filter === "verified") list = list.filter(function(item){ return item.verificationStatus === "verified" || item.provisionalActivation === true; });
      if (state.filter === "suspended") list = list.filter(function(item){ return item.verificationStatus === "suspended" || item.verificationStatus === "unverified"; });

      const rows = list.map(function(item) {
        const vehicle = [item.vehicleMake || item.vehicle?.make,item.vehicleModel || item.vehicle?.model].filter(Boolean).join(" ");
        const ratingCount = Number(item.ratingSummary?.count || item.ratingCount || 0);
        const rating = ratingCount ? Number(item.ratingSummary?.total || 0) / ratingCount : Number(item.rating || 0);
        return '<tr>' +
          '<td>' + personCell(driverName(item), item.phone || item.email || shortId(item.key), item.profile_picture_url || item.profileImageUrl) + '</td>' +
          '<td><div class="primary-text">' + esc(vehicle || "—") + '</div><div class="secondary-text">' + esc(item.vehicleReg || item.taxiRegistrationNumber || "—") + '</div></td>' +
          '<td>' + badge(item.isOnline ? "online" : "offline") + '</td>' +
          '<td>' + badge(item.verificationStatus || (item.provisionalActivation ? "verified" : "unverified")) + '</td>' +
          '<td><div class="primary-text">' + esc(rating ? rating.toFixed(1) : "New") + '</div><div class="secondary-text">' + esc(item.totalTrips || 0) + ' trips</div></td>' +
          '<td><div class="primary-text">' + money(item.walletBalance) + '</div><div class="secondary-text">' + money(item.totalEarnings) + ' earned</div></td>' +
          '<td><button class="btn dark" onclick="openDriver(\'' + esc(item.key) + '\')">Manage</button></td>' +
        '</tr>';
      });

      contentEl.innerHTML =
        pageHeader("Drivers","Manage verified profiles, vehicles, online state and operational access.") +
        '<div class="toolbar"><div class="filters">' +
          '<button class="filter ' + (state.filter === "all" ? "active" : "") + '" onclick="setFilter(\'all\')">All</button>' +
          '<button class="filter ' + (state.filter === "verified" ? "active" : "") + '" onclick="setFilter(\'verified\')">Verified</button>' +
          '<button class="filter ' + (state.filter === "online" ? "active" : "") + '" onclick="setFilter(\'online\')">Online</button>' +
          '<button class="filter ' + (state.filter === "suspended" ? "active" : "") + '" onclick="setFilter(\'suspended\')">Restricted</button>' +
        '</div><div class="hero-meta">' + esc(list.length) + ' drivers</div></div>' +
        table(["Driver","Vehicle","Availability","Approval","Rating","Money","Action"],rows,"No drivers found");
    }

    function renderPassengers() {
      let list = filterSearch(byTime(state.data.commuters));

      if (state.filter === "active") list = list.filter(function(item){ return item.isActive !== false; });
      if (state.filter === "inactive") list = list.filter(function(item){ return item.isActive === false; });

      const rows = list.map(function(item) {
        return '<tr>' +
          '<td>' + personCell(passengerName(item), item.phone || item.email || shortId(item.key), item.profile_picture_url || item.profileImageUrl || item.photoURL) + '</td>' +
          '<td>' + badge(item.isActive === false ? "inactive" : "active") + '</td>' +
          '<td><div class="primary-text">' + money(item.walletBalance ?? item.credits) + '</div><div class="secondary-text">Wallet balance</div></td>' +
          '<td><div class="primary-text">' + esc(item.totalTrips || 0) + '</div><div class="secondary-text">Trips</div></td>' +
          '<td><div class="primary-text">' + esc(item.currentRequest ? shortId(item.currentRequest) : "None") + '</div><div class="secondary-text">Current request</div></td>' +
          '<td><button class="btn dark" onclick="openPassenger(\'' + esc(item.key) + '\')">Manage</button></td>' +
        '</tr>';
      });

      contentEl.innerHTML =
        pageHeader("Passengers","Edit passenger profiles, review activity and make audited wallet adjustments.") +
        '<div class="toolbar"><div class="filters">' +
          '<button class="filter ' + (state.filter === "all" ? "active" : "") + '" onclick="setFilter(\'all\')">All</button>' +

        console.error("Admin action failed:", error);

    function openRegistration(source, key) {
      const record = registrations().find(function(item) {
        return item.source === source && item.key === key;
      });
      if (!record) return;

      const vehicle = record.approvedVehicle || record.vehiclePending || record.vehicle || {};
      const docs = record.documents || {};

      const body =
        '<div class="modal-section"><h3>Applicant</h3><div class="detail-grid">' +
          detail("Name",record.fullName || record.name) +
          detail("Phone",record.phone) +
          detail("Email",record.email) +
          detail("Status",record.displayStatus) +
          detail("Submitted",when(record.submittedAt || record.createdAt)) +
          detail("Source",source === "modern" ? "New driver enrollment" : "Legacy application") +
        '</div></div>' +

        '<div class="modal-section"><h3>Vehicle approval</h3><div class="fields">' +
          field("regVehicleType","Type",vehicle.type || record.vehicleType || "ehailing") +
          field("regVehicleMake","Make",vehicle.make || record.vehicleMake) +
          field("regVehicleModel","Model",vehicle.model || record.vehicleModel) +
          field("regVehicleColor","Colour",vehicle.colour || vehicle.color || record.vehicleColor) +
          field("regVehicleReg","Registration",vehicle.registration || record.vehicleReg || record.taxiRegistrationNumber) +
          field("regVehicleSeats","Passenger seats",vehicle.seats || record.vehicleSeats || 4,"number") +
        '</div></div>' +

        '<div class="modal-section"><h3>Documents</h3><div class="docs">' +
          docCard("Live face",record.profile_picture_url || docs.selfie || docs.FACE) +
          docCard("Vehicle",record.vehiclePhoto || docs.car || docs.CAR_FRONT) +
          docCard("Identity",docs.identity || docs.ID_FRONT || docs.ID_DOC) +
          docCard("Driver licence",docs.licence || docs.LICENCE || docs.PDP) +
        '</div></div>' +

        '<div class="modal-section"><h3>References & banking</h3><div class="detail-grid">' +
          detail("Reference 1",record.references?.reference1?.name || "—") +
          detail("Reference 2",record.references?.reference2?.name || "—") +
          detail("Reference 3",record.references?.reference3?.name || "—") +
          detail("Bank",record.banking?.bank || "—") +
          detail("Account holder",record.banking?.accountHolder || "—") +
          detail("Account",record.banking?.accountNumber ? "••••" + String(record.banking.accountNumber).slice(-4) : "—") +
        '</div></div>';

      const canReview = ["pending","pending_review"].includes(String(record.displayStatus || ""));

      openModal(
        "Driver registration",
        record.fullName || record.name || "Driver applicant",
        body,
        '<button class="btn" onclick="closeModal()">Close</button>' +
        (canReview ? '<button class="btn red" onclick="rejectRegistration(\'' + esc(source) + '\',\'' + esc(key) + '\')">Reject</button><button class="btn green" onclick="approveRegistration(\'' + esc(source) + '\',\'' + esc(key) + '\')">Approve driver</button>' : '')
      );
    }

    async function approveRegistration(source, key) {
      const vehicle = {
        type: document.getElementById("regVehicleType")?.value || "ehailing",
        make: document.getElementById("regVehicleMake")?.value || "",
        model: document.getElementById("regVehicleModel")?.value || "",
        colour: document.getElementById("regVehicleColor")?.value || "",
        registration: document.getElementById("regVehicleReg")?.value || "",
        seats: Number(document.getElementById("regVehicleSeats")?.value || 4)
      };

      if (!vehicle.make || !vehicle.model || !vehicle.registration) {
        toast("Complete vehicle make, model and registration before approval.", "error");
        return;
      }

      if (!confirm("Approve this driver and activate the driver profile?")) return;

      if (source === "modern") {
        await reviewEnrollment({
          uid:key,
          decision:"approved",
          vehicle:vehicle
        },"Driver approved and profile activated.");
      } else {
        await manage({
          action:"reviewLegacyDriver",
          id:key,
          decision:"approved",
          vehicle:vehicle
        },"Legacy driver approved.");
      }

      closeModal();
    }

    async function rejectRegistration(source, key) {
      const reason = prompt("Reason for rejection:");
      if (reason === null) return;
      if (!reason.trim()) {
        toast("Add a rejection reason.", "error");
        return;
      }

      if (source === "modern") {
        await reviewEnrollment({
          uid:key,
          decision:"rejected",
          reason:reason
        },"Driver application rejected.");
      } else {
        await manage({
          action:"reviewLegacyDriver",
          id:key,
          decision:"rejected",
          reason:reason
        },"Legacy driver application rejected.");
      }

      closeModal();
    }

      );
    }

    async function savePassenger(key) {
      await manage({
        action:"updatePassenger",
        id:key,
        patch:{
          name:document.getElementById("pName")?.value || "",
          phone:document.getElementById("pPhone")?.value || "",
          email:document.getElementById("pEmail")?.value || "",
          homeAddress:document.getElementById("pHome")?.value || "",
          workAddress:document.getElementById("pWork")?.value || "",
          isActive:document.getElementById("pActive")?.value !== "inactive"
        }
      },"Passenger profile updated.");
      closeModal();
    }

    async function adjustPassengerWallet(key) {
      const delta = Number(document.getElementById("walletDelta")?.value);
      const reason = document.getElementById("walletReason")?.value?.trim() || "";

      if (!Number.isFinite(delta) || delta === 0) {
        toast("Enter a non-zero wallet adjustment.", "error");
        return;
      }
      if (!reason) {
        toast("A wallet adjustment reason is required.", "error");
        return;
      }

      if (!confirm("Apply " + money(delta) + " adjustment to this passenger wallet?")) return;

      const result = await manage({
        action:"adjustWallet",
        passengerId:key,
        delta:delta,
        reason:reason
      },"Wallet updated.");

      toast("New balance: " + money(result?.balance), "success");
      closeModal();
    }

    function openDriver(key) {
      const item = state.data.taxis.find(function(record){ return record.key === key; });
      if (!item) return;

      const body =
        '<div class="modal-section"><h3>Driver profile</h3><div class="fields">' +
          field("dName","Name",driverName(item)) +
          field("dPhone","Phone",item.phone) +
          field("dEmail","Email",item.email,"email") +
          field("dArea","Area",item.area || item.assignedRank) +
          selectField("dVerification","Verification",item.verificationStatus || (item.provisionalActivation ? "verified" : "unverified"),["verified","unverified","suspended"]) +
          selectField("dOnline","Availability",item.isOnline ? "online" : "offline",["online","offline"]) +
        '</div></div>' +
        '<div class="modal-section"><h3>Vehicle</h3><div class="fields">' +
          field("dVehicleType","Type",item.vehicleType || item.vehicle?.type) +
          field("dVehicleMake","Make",item.vehicleMake || item.vehicle?.make) +
          field("dVehicleModel","Model",item.vehicleModel || item.vehicle?.model) +
          field("dVehicleColor","Colour",item.vehicleColor || item.vehicle?.colour) +
          field("dVehicleReg","Registration",item.vehicleReg || item.taxiRegistrationNumber || item.vehicle?.registration) +
          field("dVehicleSeats","Passenger seats",item.vehicleSeats || item.seats || item.vehicle?.seats || 4,"number") +
        '</div></div>' +
        '<div class="modal-section"><h3>Operations</h3><div class="detail-grid">' +
          detail("Current request",shortId(item.currentRequest)) +
          detail("Total trips",item.totalTrips || 0) +
          detail("Wallet",money(item.walletBalance)) +
          detail("Total earnings",money(item.totalEarnings)) +
          detail("Verified",when(item.verifiedAt)) +
          detail("Auth UID",shortId(item.authUid || item.userUid)) +
        '</div></div>';

      openModal(
        "Driver",
        driverName(item),
        body,
        '<button class="btn" onclick="closeModal()">Close</button><button class="btn dark" onclick="saveDriver(\'' + esc(key) + '\')">Save driver</button>'
      );
    }

    async function saveDriver(key) {
      const verification = document.getElementById("dVerification")?.value || "unverified";
      const isOnline = document.getElementById("dOnline")?.value === "online";

      await manage({
        action:"updateDriver",
        id:key,
        patch:{
          name:document.getElementById("dName")?.value || "",
          fullName:document.getElementById("dName")?.value || "",
          phone:document.getElementById("dPhone")?.value || "",
          email:document.getElementById("dEmail")?.value || "",
          area:document.getElementById("dArea")?.value || "",
          assignedRank:document.getElementById("dArea")?.value || "",
          verificationStatus:verification,
          isOnline:isOnline,
          vehicleType:document.getElementById("dVehicleType")?.value || "",
          vehicleMake:document.getElementById("dVehicleMake")?.value || "",
          vehicleModel:document.getElementById("dVehicleModel")?.value || "",
          vehicleColor:document.getElementById("dVehicleColor")?.value || "",
          vehicleReg:document.getElementById("dVehicleReg")?.value || "",
          taxiRegistrationNumber:document.getElementById("dVehicleReg")?.value || "",
          vehicleSeats:Number(document.getElementById("dVehicleSeats")?.value || 4)
        }
      },"Driver updated.");

      closeModal();
    }

    function driverOptions(selected) {
      const drivers = state.data.taxis
        .filter(function(item) {
          return item.verificationStatus === "verified" || item.provisionalActivation === true;
        })
        .sort(function(a,b) {
          return driverName(a).localeCompare(driverName(b));
        });

      let html = '<option value="">Choose a verified driver</option>';
      drivers.forEach(function(driver) {
        html += '<option value="' + esc(driver.key) + '"' + (String(selected || "") === String(driver.key) ? " selected" : "") + '>' +
          esc(driverName(driver) + " · " + (driver.vehicleReg || driver.taxiRegistrationNumber || "No reg")) +
        '</option>';
      });
      return html;
    }

    function openRequest(key) {
      const item = state.data.requests.find(function(record){ return record.key === key; }) ||
        state.data.delivery_requests.find(function(record){ return record.key === key; });
      if (!item) return;

      const statuses = [
        "pending","searching","driver_busy","pooling","waiting_members","driver_waiting","pool_ready",
        "accepted","driver_on_way","arrived","collecting_passengers","all_onboard","passenger_onboard",
        "in_transit","completed","cancelled_by_admin","cancelled_by_driver","cancelled_by_commuter","rejected"
      ];

      let passengerInfo = "";
      if (item.type === "club") {
        const passengers = Object.entries(item.passengers || {});
        passengerInfo = '<div class="modal-section"><h3>Work passengers</h3><div class="activity-list">' +
          passengers.map(function(entry) {
            const id = entry[0];
            const passenger = entry[1] || {};
            return '<div class="activity"><div class="activity-icon">P</div><div><strong>' + esc(passenger.name || "Passenger") + '</strong><p>' + esc(passenger.pickupAddress || "") + ' → ' + esc(passenger.destination || "") + '</p></div><div>' + badge(passenger.status || "waiting") + '</div></div>';
          }).join("") +
        '</div></div>';
      }

      const body =
        '<div class="modal-section"><h3>Trip</h3><div class="detail-grid">' +
          detail("Reference",item.key) +
          detail("Service",item.type === "club" ? "Asiye Work" : item.type === "delivery" ? "Delivery" : "Asiye Go") +
          detail("Passenger",requestName(item)) +
          detail("Phone",item.commuterPhone || item.sender?.phone) +
          detail("Pickup",item.pickupAddress) +
          detail("Destination",item.destination || item.destinationName) +
          detail("Distance",item.routeDistanceKm ? Number(item.routeDistanceKm).toFixed(1) + " km" : "—") +
          detail("Created",when(requestTime(item))) +
        '</div></div>' +
        '<div class="modal-section"><h3>Manage booking</h3><div class="fields">' +
          selectField("rStatus","Status",item.status || "pending",statuses) +
          field("rFare","Final amount",requestFare(item),"number") +
          field("rPayment","Payment method",item.paymentMethod || "cash") +
          '<div class="field"><label for="rDriver">Driver assignment</label><select id="rDriver">' + driverOptions(item.taxiId) + '</select></div>' +
        '</div></div>' +
        passengerInfo;

      openModal(
        item.type === "club" ? "Asiye Work booking" : item.type === "delivery" ? "Delivery" : "Asiye Go booking",
        shortId(item.key),
        body,
        '<button class="btn" onclick="closeModal()">Close</button>' +
        (!terminalStatus(item.status) ? '<button class="btn red" onclick="cancelAdminRequest(\'' + esc(item.key) + '\')">Cancel booking</button>' : '') +
        '<button class="btn soft" onclick="assignAdminDriver(\'' + esc(item.key) + '\')">Assign driver</button>' +
        '<button class="btn dark" onclick="saveRequest(\'' + esc(item.key) + '\')">Save booking</button>'
      );
    }

    async function saveRequest(key) {
      const fare = Number(document.getElementById("rFare")?.value || 0);

      await manage({
        action:"updateRequest",
        id:key,
        patch:{
          status:document.getElementById("rStatus")?.value || "pending",
          finalAmount:fare,
          agreedFare:fare,
          paymentMethod:document.getElementById("rPayment")?.value || "cash"
        }
      },"Booking updated.");

      closeModal();
    }

    async function assignAdminDriver(key) {
      const driverId = document.getElementById("rDriver")?.value || "";
      if (!driverId) {
        toast("Choose a verified driver first.", "error");
        return;
      }
      if (!confirm("Assign this driver to the booking?")) return;

      await manage({
        action:"assignDriver",
        requestId:key,
        driverId:driverId
      },"Driver assigned.");

      closeModal();
    }

    async function cancelAdminRequest(key) {
      const reason = prompt("Reason for cancelling this booking:");
      if (reason === null) return;
      if (!confirm("Cancel this booking as Asiye Admin?")) return;

      await manage({
        action:"cancelRequest",
        requestId:key,
        reason:reason || "Cancelled by Asiye Admin"
      },"Booking cancelled.");

      closeModal();
    }

    function openSupport(key) {
      const item = state.data.support_chats.find(function(record){ return record.key === key; });
      if (!item) return;

      const body =
        '<div class="modal-section"><h3>Support record</h3><div class="detail-grid">' +
          detail("Customer",item.name || item.userName || item.customerName || "Asiye user") +
          detail("Contact",item.email || item.phone || item.userId) +
          detail("Subject",item.subject || item.title || item.category || "Support request") +
          detail("Created",when(item.createdAt || item.timestamp)) +
        '</div></div>' +
        '<div class="modal-section"><h3>Message</h3><div class="detail"><strong style="line-height:1.6">' + esc(item.message || item.lastMessage || item.text || "No message body") + '</strong></div></div>' +
        '<div class="modal-section"><h3>Admin handling</h3><div class="fields">' +
          selectField("sStatus","Status",item.status || "open",["open","pending","resolved","closed"]) +
          textArea("sNote","Internal admin note",item.adminNote || "","full") +
        '</div></div>';

      openModal(
        "Support",
        item.subject || item.title || "Support request",
        body,
        '<button class="btn" onclick="closeModal()">Close</button><button class="btn dark" onclick="saveSupport(\'' + esc(key) + '\')">Save support record</button>'
      );
    }

    async function saveSupport(key) {
      await manage({
        action:"updateSupport",
        id:key,
        status:document.getElementById("sStatus")?.value || "open",
        note:document.getElementById("sNote")?.value || ""
      },"Support record updated.");

      closeModal();
    }

    function openPayment(key) {
      const item = state.data.walletPayments.find(function(record){ return record.key === key; });
      if (!item) return;

      const passenger = state.data.commuters.find(function(user) {
        return user.key === item.passengerId || user.key === item.uid || user.authUid === item.uid;
      });

      const manualEft = item.provider === "manual_eft";
      const awaiting = manualEft && paymentStatus(item) === "awaiting_payment";

      const body =
        '<div class="modal-section"><h3>Payment</h3><div class="detail-grid">' +
          detail("Passenger",passenger ? passengerName(passenger) : shortId(item.passengerId || item.uid)) +
          detail("Amount",money(item.amount)) +
          detail("Status",paymentStatus(item)) +
          detail("Method",manualEft ? "FNB manual EFT" : (item.provider || "Legacy payment")) +
          detail("Bank",item.bank || "—") +
          detail("Bank account",item.accountNumber || "—") +
          detail("EFT reference",item.reference || "—") +
          detail("SMS destination",item.phone || "—") +
          detail("SMS status",item.smsStatus || "—") +
          detail("Created",when(item.createdAt)) +
          detail("Completed",when(item.completedAt || item.reconciledAt)) +
          detail("Bank trace",item.bankTrace || "—") +
        '</div></div>' +
        (manualEft
          ? '<div class="notice"><strong>Before crediting:</strong> confirm the FNB bank statement shows the same amount and the exact reference <b>' + esc(item.reference || "") + '</b>. Twilio delivery is not proof of payment.</div>'
          : '<div class="notice">This is a legacy payment record retained for history.</div>') +
        '<div class="modal-section"><div class="fields">' +
          (awaiting ? field("bankTrace","Bank trace / statement note",item.bankTrace || "") : "") +
          textArea("paymentNote","Admin note",item.adminNote || "","full") +
        '</div></div>';

      openModal(
        "Wallet payment",
        item.reference || shortId(item.key),
        body,
        '<button class="btn" onclick="closeModal()">Close</button>' +
        (awaiting ? '<button class="btn red" onclick="cancelEftPayment(\'' + esc(key) + '\')">Cancel request</button><button class="btn green" onclick="reconcileEftPayment(\'' + esc(key) + '\')">Mark EFT paid & credit wallet</button>' : '') +
        '<button class="btn dark" onclick="savePaymentNote(\'' + esc(key) + '\')">Save note</button>'
      );
    }

    async function reconcileEftPayment(key) {
      const item = state.data.walletPayments.find(function(record){ return record.key === key; });
      if (!item) return;

      const trace = document.getElementById("bankTrace")?.value?.trim() || "";
      const note = document.getElementById("paymentNote")?.value?.trim() || "";

      if (!confirm(
        "Confirm FNB received " +
        money(item.amount) +
        " with reference " +
        (item.reference || "") +
        "? This will credit the passenger wallet."
      )) return;

      const result = await manage({
        action:"reconcileEftTopup",
        id:key,
        bankTrace:trace,
        note:note
      },"EFT reconciled and wallet credited.");

      toast("Passenger wallet balance: " + money(result?.balance), "success");
      closeModal();
    }

    async function cancelEftPayment(key) {
      const note = document.getElementById("paymentNote")?.value?.trim() || "";
      if (!confirm("Cancel this pending EFT instruction request?")) return;

      await manage({
        action:"cancelEftTopup",
        id:key,
        note:note
      },"EFT request cancelled.");

      closeModal();
    }

    async function savePaymentNote(key) {
      await manage({
        action:"updatePaymentNote",
        id:key,
        note:document.getElementById("paymentNote")?.value || ""
      },"Payment note saved.");

      closeModal();
    }

    function openPayout(collection, key) {
      const source = collection === "withdrawals" ? state.data.withdrawals : state.data.payout_requests;
      const item = source.find(function(record){ return record.key === key; });
      if (!item) return;

      const body =
        '<div class="modal-section"><h3>Payout</h3><div class="detail-grid">' +
          detail("Recipient",item.name || item.driverName || item.handlerName || item.phone || shortId(item.userId || item.driverId)) +
          detail("Amount",money(item.amount || item.value)) +
          detail("Status",item.status || "pending") +
          detail("Bank",item.bank || item.bankName || item.banking?.bank || "—") +
          detail("Account",item.accountNumber ? "••••" + String(item.accountNumber).slice(-4) : item.banking?.accountNumber ? "••••" + String(item.banking.accountNumber).slice(-4) : "—") +
          detail("Requested",when(item.requestedAt || item.createdAt || item.timestamp)) +
        '</div></div>' +
        '<div class="modal-section"><div class="fields">' +
          selectField("payoutStatus","Status",item.status || "pending",["pending","approved","rejected","paid"]) +
          textArea("payoutNote","Admin note",item.adminNote || "","full") +
        '</div></div>';

      openModal(
        "Payout review",
        shortId(item.key),
        body,
        '<button class="btn" onclick="closeModal()">Close</button><button class="btn dark" onclick="savePayout(\'' + esc(collection) + '\',\'' + esc(key) + '\')">Save payout</button>'
      );
    }

    async function savePayout(collection, key) {
      const status = document.getElementById("payoutStatus")?.value || "pending";
      if (status === "paid" && !confirm("Confirm that this payout has actually been paid?")) return;

      await manage({
        action:"reviewPayout",
        collection:collection,
        id:key,
        status:status,
        note:document.getElementById("payoutNote")?.value || ""
      },"Payout updated.");

      closeModal();
    }

    function openAudit(key) {
      const item = state.data.adminAudit.find(function(record){ return record.key === key; });
      if (!item) return;

      const body =
        '<div class="modal-section"><h3>Audit event</h3><div class="detail-grid">' +
          detail("Action",String(item.action || "").replaceAll("_"," ")) +
          detail("Target",item.target) +
          detail("Admin",item.adminEmail || item.adminUid) +
          detail("Created",when(item.createdAt)) +
        '</div></div>' +
        '<div class="modal-section"><h3>Details</h3><pre style="white-space:pre-wrap;word-break:break-word;font-size:9px;line-height:1.6">' + esc(JSON.stringify(item.details || {},null,2)) + '</pre></div>';

      openModal(
        "Audit trail",
        String(item.action || "Admin action").replaceAll("_"," "),
        body,
        '<button class="btn dark" onclick="closeModal()">Close</button>'
      );
    }

    window.closeModal = closeModal;
    window.openRegistration = openRegistration;
    window.approveRegistration = approveRegistration;
    window.rejectRegistration = rejectRegistration;
    window.openPassenger = openPassenger;
    window.savePassenger = savePassenger;
    window.adjustPassengerWallet = adjustPassengerWallet;
    window.openDriver = openDriver;
    window.saveDriver = saveDriver;
    window.openRequest = openRequest;
    window.saveRequest = saveRequest;
    window.assignAdminDriver = assignAdminDriver;
    window.cancelAdminRequest = cancelAdminRequest;
    window.openSupport = openSupport;
    window.saveSupport = saveSupport;
    window.openPayment = openPayment;
    window.reconcileEftPayment = reconcileEftPayment;
    window.cancelEftPayment = cancelEftPayment;
    window.savePaymentNote = savePaymentNote;
    window.openPayout = openPayout;
    window.savePayout = savePayout;
    window.openAudit = openAudit;

    document.querySelectorAll(".nav-item[data-view]").forEach(function(button) {
      button.addEventListener("click", function() {
        setView(button.dataset.view);
      });
    });

    searchEl.addEventListener("input", function() {
      state.search = searchEl.value;
      renderCurrent();
    });

    document.getElementById("refreshButton").addEventListener("click", function() {
      loadData(true);
    });

    document.getElementById("logoutButton").addEventListener("click", async function() {
      await auth.signOut();
      window.location.replace("admin-login.html");
    });

    function closeSidebar() {
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("open");
    }

    document.getElementById("mobileMenu").addEventListener("click", function() {
      sidebar.classList.add("open");
      sidebarOverlay.classList.add("open");
    });

    sidebarOverlay.addEventListener("click", closeSidebar);

    auth.onAuthStateChanged(async function(user) {
      if (!user) {
        window.location.replace("admin-login.html");
        return;
      }

      try {
        const result = await callable.who({});
        if (!result?.data?.ok) throw new Error("Admin access denied.");

        state.admin = result.data;
        document.getElementById("adminEmail").textContent = result.data.email || user.email || user.uid;
        document.getElementById("adminAvatar").textContent = initials(result.data.email || user.email || "Admin");

        await loadData(true);
      } catch (error) {
        console.error("Admin access verification failed:", error);
        await auth.signOut().catch(function(){});
        alert(error?.message || "This account is not authorised for Asiye Admin.");
        window.location.replace("admin-login.html");
      }
    });
  </script>
</body>
</html>
