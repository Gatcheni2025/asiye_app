<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard · Asye</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <!-- Mapbox GL JS & Geocoder -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.css" type="text/css" />
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #e8ecf4;
            min-height: 100vh;
        }

        /* ----- TOP NAV BAR ----- */
        .navbar {
            background: #141a24;
            border-bottom: 1px solid #2a3340;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .navbar .brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        .navbar .brand span {
            color: #5b7cfa;
        }
        .navbar .user-info {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            font-size: 0.85rem;
            color: #8b95a9;
        }
        .navbar .user-info .email {
            color: #e8ecf4;
        }
        .navbar .user-info .btn-logout {
            background: #2a3340;
            border: none;
            color: #f28b82;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .navbar .user-info .btn-logout:hover {
            background: #3a2a2a;
        }

        /* ----- MAIN LAYOUT ----- */
        .dashboard {
            display: grid;
            grid-template-columns: 240px 1fr;
            min-height: calc(100vh - 68px);
        }

        /* ----- SIDEBAR ----- */
        .sidebar {
            background: #10161e;
            border-right: 1px solid #1f2836;
            padding: 1.5rem 0;
        }
        .sidebar .menu-item {
            padding: 0.7rem 1.8rem;
            color: #8b95a9;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            border-left: 3px solid transparent;
        }
        .sidebar .menu-item:hover {
            background: #1a222e;
            color: #e8ecf4;
        }
        .sidebar .menu-item.active {
            color: #ffffff;
            background: #1a222e;
            border-left-color: #5b7cfa;
        }
        .sidebar .menu-item .icon {
            margin-right: 0.6rem;
        }
        .sidebar .divider {
            border-top: 1px solid #1f2836;
            margin: 0.8rem 1.5rem;
        }
        .sidebar .menu-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4d5b70;
            padding: 0.4rem 1.8rem;
        }

        /* ----- MAIN CONTENT ----- */
        .main-content {
            padding: 2rem 2.5rem;
            overflow-y: auto;
            max-height: calc(100vh - 68px);
        }
        .main-content .page-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }
        .main-content .page-sub {
            color: #8b95a9;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }

        /* ----- FORM ----- */
        .form-card {
            background: #141a24;
            border: 1px solid #2a3340;
            border-radius: 16px;
            padding: 1.8rem 2rem;
            max-width: 700px;
        }
        .form-card .form-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            color: #c8d0dc;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 0.3rem;
        }
        .form-group label .required {
            color: #f28b82;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            background: #1e2632;
            border: 1px solid #2f3a48;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: #f0f4fa;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.25s, box-shadow 0.25s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #5b7cfa;
            box-shadow: 0 0 0 4px rgba(91, 124, 250, 0.12);
        }
        .form-group input::placeholder {
            color: #5d6a7e;
        }
        .form-group select option {
            background: #141a24;
            color: #e8ecf4;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .btn-submit {
            background: #5b7cfa;
            border: none;
            border-radius: 40px;
            padding: 0.8rem 2.5rem;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(91, 124, 250, 0.3);
        }
        .btn-submit:hover {
            background: #4a6ae8;
            box-shadow: 0 6px 24px rgba(91, 124, 250, 0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-submit .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #2f3a48;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-msg {
            background: #1a2a1a;
            border: 1px solid #2a4a2a;
            border-radius: 12px;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            color: #6f8a6f;
            font-size: 0.85rem;
            display: none;
        }
        .success-msg.show {
            display: block;
        }
        .error-msg {
            background: #1e1a1f;
            border: 1px solid #4a2a2a;
            border-radius: 12px;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            color: #f28b82;
            font-size: 0.85rem;
            display: none;
        }
        .error-msg.show {
            display: block;
        }

        /* ----- Mapbox Geocoder Overrides ----- */
        .mapboxgl-ctrl-geocoder {
            width: 100% !important;
            max-width: 100% !important;
            background: #1e2632 !important;
            border: 1px solid #2f3a48 !important;
            border-radius: 12px !important;
            box-shadow: none !important;
            font-family: 'Inter', sans-serif !important;
        }
        .mapboxgl-ctrl-geocoder input {
            background: #1e2632 !important;
            color: #f0f4fa !important;
            font-size: 0.95rem !important;
            padding: 0.75rem 1rem !important;
            height: auto !important;
        }
        .mapboxgl-ctrl-geocoder input::placeholder {
            color: #5d6a7e !important;
        }
        .mapboxgl-ctrl-geocoder .suggestions {
            background: #1e2632 !important;
            border: 1px solid #2f3a48 !important;
            border-radius: 12px !important;
            margin-top: 4px !important;
        }
        .mapboxgl-ctrl-geocoder .suggestion {
            color: #e8ecf4 !important;
            padding: 0.6rem 1rem !important;
            border-bottom: 1px solid #2a3340 !important;
        }
        .mapboxgl-ctrl-geocoder .suggestion:hover {
            background: #2a3340 !important;
        }
        .mapboxgl-ctrl-geocoder .suggestion .name {
            color: #ffffff !important;
        }
        .mapboxgl-ctrl-geocoder .suggestion .address {
            color: #8b95a9 !important;
        }
        .mapboxgl-ctrl-geocoder .mapboxgl-ctrl-geocoder--icon {
            display: none !important;
        }
        .mapboxgl-ctrl-geocoder .mapboxgl-ctrl-geocoder--pin-right {
            display: none !important;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
            .main-content {
                padding: 1.5rem;
                max-height: none;
            }
            .navbar {
                padding: 0.6rem 1rem;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-card {
                padding: 1.2rem;
            }
        }
        @media print {
            .navbar, .sidebar { display: none; }
            .dashboard { display: block; }
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- NAV BAR -->
    <!-- ============================================================ -->
    <nav class="navbar">
        <div class="brand">Asye<span>Admin</span></div>
        <div class="user-info">
            <span class="email" id="userEmail">Loading...</span>
            <button class="btn-logout" id="logoutBtn">Sign Out</button>
        </div>
    </nav>

    <!-- ============================================================ -->
    <!-- DASHBOARD -->
    <!-- ============================================================ -->
    <div class="dashboard">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="menu-item active"><span class="icon">📊</span> Dashboard</div>
            <div class="menu-item"><span class="icon">🚗</span> Vehicles</div>
            <div class="menu-item"><span class="icon">👥</span> Drivers</div>
            <div class="menu-item"><span class="icon">📝</span> Trips</div>
            <div class="divider"></div>
            <div class="menu-label">System</div>
            <div class="menu-item"><span class="icon">🔐</span> Security</div>
            <div class="menu-item"><span class="icon">⚙️</span> Settings</div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            <div class="page-title">🚗 Vehicle Registration</div>
            <div class="page-sub">Register a new vehicle in the system</div>

            <!-- Success / Error Messages -->
            <div id="successMsg" class="success-msg"></div>
            <div id="errorMsg" class="error-msg"></div>

            <!-- FORM -->
            <div class="form-card">
                <div class="form-title">Vehicle Details</div>

                <form id="vehicleForm" onsubmit="return false;">

                    <!-- Vehicle Type (Minibus taxis REMOVED) -->
                    <div class="form-group">
                        <label for="vehicleType">Vehicle Type <span class="required">*</span></label>
                        <select id="vehicleType" required>
                            <option value="">Select vehicle type...</option>
                            <option value="Sedan">Sedan</option>
                            <option value="SUV">SUV</option>
                            <option value="Hatchback">Hatchback</option>
                            <option value="Bakkie / Pickup">Bakkie / Pickup</option>
                            <option value="Van">Van</option>
                            <option value="Bus">Bus</option>
                            <option value="Truck">Truck</option>
                            <option value="Motorcycle">Motorcycle</option>
                            <option value="Bicycle">Bicycle</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- Vehicle Make -->
                    <div class="form-group">
                        <label for="vehicleMake">Make <span class="required">*</span></label>
                        <input type="text" id="vehicleMake" placeholder="e.g. Toyota, Ford, BMW" required />
                    </div>

                    <!-- Vehicle Model -->
                    <div class="form-group">
                        <label for="vehicleModel">Model <span class="required">*</span></label>
                        <input type="text" id="vehicleModel" placeholder="e.g. Corolla, F-150, X5" required />
                    </div>

                    <!-- Year & Color (row) -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="vehicleYear">Year</label>
                            <input type="number" id="vehicleYear" placeholder="e.g. 2020" min="1950" max="2026" />
                        </div>
                        <div class="form-group">
                            <label for="vehicleColor">Color</label>
                            <input type="text" id="vehicleColor" placeholder="e.g. Red, Blue, White" />
                        </div>
                    </div>

                    <!-- License Plate -->
                    <div class="form-group">
                        <label for="licensePlate">License Plate <span class="required">*</span></label>
                        <input type="text" id="licensePlate" placeholder="e.g. ABC 123 GP" required />
                    </div>

                    <!-- ========================================================== -->
                    <!-- AREA – with Mapbox Geocoder (replaces Assigned Rank)       -->
                    <!-- ========================================================== -->
                    <div class="form-group">
                        <label for="area">Area <span class="required">*</span></label>
                        <div id="geocoder-container"></div>
                        <div style="font-size:0.7rem; color:#5d6a7e; margin-top:0.3rem;">
                            🌍 Type an address, city, or landmark for geo-location
                        </div>
                    </div>

                    <!-- Hidden fields for lat/lng (populated by geocoder) -->
                    <input type="hidden" id="areaLat" />
                    <input type="hidden" id="areaLng" />
                    <input type="hidden" id="areaName" />

                    <!-- Submit -->
                    <button type="submit" class="btn-submit" id="submitBtn">
                        Register Vehicle
                    </button>
                </form>
            </div>

        </main>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT                                                   -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCX_euO2EEPhfhuG5DTsSi5vCpZ9MFZczY",
            authDomain: "asiye-80386.firebaseapp.com",
            databaseURL: "https://asiye-80386-default-rtdb.firebaseio.com",
            projectId: "asiye-80386",
            storageBucket: "asiye-80386.firebasestorage.app",
            appId: "1:531902350858:web:f8a4a246bf350d50e3c1f3"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // ============================================================
        // DOM REFS
        // ============================================================
        const userEmailEl = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');

        const vehicleForm = document.getElementById('vehicleForm');
        const vehicleType = document.getElementById('vehicleType');
        const vehicleMake = document.getElementById('vehicleMake');
        const vehicleModel = document.getElementById('vehicleModel');
        const vehicleYear = document.getElementById('vehicleYear');
        const vehicleColor = document.getElementById('vehicleColor');
        const licensePlate = document.getElementById('licensePlate');
        const areaLat = document.getElementById('areaLat');
        const areaLng = document.getElementById('areaLng');
        const areaName = document.getElementById('areaName');
        const submitBtn = document.getElementById('submitBtn');

        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');

        // ============================================================
        // MAPBOX CONFIG - TOKEN FROM ENVIRONMENT VARIABLE
        // ============================================================
        // IMPORTANT: Replace this with your actual token, but DO NOT commit it to Git!
        // Use environment variables or a config file that is .gitignored.
        // For development, you can set a local variable (but don't commit it).
        const MAPBOX_TOKEN = 'YOUR_MAPBOX_TOKEN_HERE';

        // ============================================================
        // AUTH CHECK
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                userEmailEl.textContent = user.email || 'admin@asiye.cloud';
                console.log('✅ Dashboard loaded for:', user.email);
            } else {
                console.log('🔒 No user found, redirecting to login...');
                window.location.href = 'admin-login.html';
            }
        });

        // ============================================================
        // LOGOUT
        // ============================================================
        logoutBtn.addEventListener('click', function() {
            auth.signOut()
                .then(() => {
                    window.location.href = 'admin-login.html';
                })
                .catch((error) => {
                    alert('Error signing out: ' + error.message);
                });
        });

        // ============================================================
        // MAPBOX GEOCODER
        // ============================================================
        let geocoder;

        function initMapboxGeocoder() {
            try {
                // Check if token is set
                if (MAPBOX_TOKEN === 'YOUR_MAPBOX_TOKEN_HERE' || !MAPBOX_TOKEN) {
                    console.warn('⚠️ Mapbox token not set. Please set your Mapbox token.');
                    showFallbackInput();
                    return;
                }

                // Set the access token
                mapboxgl.accessToken = MAPBOX_TOKEN;

                // Initialize the geocoder
                geocoder = new MapboxGeocoder({
                    accessToken: mapboxgl.accessToken,
                    placeholder: 'Start typing an address or location...',
                    countries: 'za', // Restrict to South Africa
                    types: 'address,place,locality,neighborhood,country',
                    marker: false,
                    mapboxgl: mapboxgl
                });

                // Add to container
                const container = document.getElementById('geocoder-container');
                if (container) {
                    container.appendChild(geocoder.onAdd());
                }

                // When a result is selected
                geocoder.on('result', function(event) {
                    const result = event.result;
                    const center = result.center || result.geometry?.coordinates;

                    if (center) {
                        const lat = center[1];
                        const lng = center[0];
                        const placeName = result.place_name || result.text || '';

                        areaLat.value = lat;
                        areaLng.value = lng;
                        areaName.value = placeName;

                        console.log('📍 Location selected:', placeName, 'Lat:', lat, 'Lng:', lng);
                    }
                });

                // Clear lat/lng when user clears input
                geocoder.on('clear', function() {
                    areaLat.value = '';
                    areaLng.value = '';
                    areaName.value = '';
                });

                console.log('🗺️ Mapbox Geocoder initialized successfully.');

            } catch (error) {
                console.error('❌ Mapbox Geocoder initialization error:', error);
                showFallbackInput();
            }
        }

        function showFallbackInput() {
            const container = document.getElementById('geocoder-container');
            if (container) {
                const fallbackInput = document.createElement('input');
                fallbackInput.type = 'text';
                fallbackInput.id = 'areaFallback';
                fallbackInput.className = 'form-control';
                fallbackInput.placeholder = 'Enter area name (fallback)';
                fallbackInput.style.cssText = `
                    width: 100%;
                    background: #1e2632;
                    border: 1px solid #2f3a48;
                    border-radius: 12px;
                    padding: 0.75rem 1rem;
                    color: #f0f4fa;
                    font-size: 0.95rem;
                    outline: none;
                `;
                container.appendChild(fallbackInput);

                fallbackInput.addEventListener('input', function() {
                    areaName.value = this.value;
                    areaLat.value = '';
                    areaLng.value = '';
                });
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(initMapboxGeocoder, 500);
        });

        // Also try on load
        window.addEventListener('load', function() {
            if (!geocoder) {
                initMapboxGeocoder();
            }
        });

        // ============================================================
        // FORM SUBMISSION
        // ============================================================
        function showSuccess(message) {
            successMsg.textContent = message;
            successMsg.className = 'success-msg show';
            errorMsg.className = 'error-msg';
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.className = 'error-msg show';
            successMsg.className = 'success-msg';
        }

        function hideMessages() {
            successMsg.className = 'success-msg';
            errorMsg.className = 'error-msg';
        }

        function setButtonLoading(loading) {
            if (loading) {
                submitBtn.innerHTML = '<span class="spinner"></span> Saving...';
                submitBtn.disabled = true;
            } else {
                submitBtn.innerHTML = 'Register Vehicle';
                submitBtn.disabled = false;
            }
        }

        vehicleForm.addEventListener('submit', function(e) {
            e.preventDefault();
            hideMessages();

            // Get area value from geocoder or fallback
            let areaValue = areaName.value;
            if (!areaValue) {
                // Try to get from geocoder input
                const geocoderInput = document.querySelector('.mapboxgl-ctrl-geocoder input');
                if (geocoderInput) {
                    areaValue = geocoderInput.value;
                }
                // Fallback
                const fallbackInput = document.getElementById('areaFallback');
                if (fallbackInput) {
                    areaValue = fallbackInput.value;
                }
            }

            // Validate required fields
            const type = vehicleType.value.trim();
            const make = vehicleMake.value.trim();
            const model = vehicleModel.value.trim();
            const plate = licensePlate.value.trim();

            if (!type || !make || !model || !plate || !areaValue) {
                showError('Please fill in all required fields (marked with *).');
                return;
            }

            // Get current user
            const user = auth.currentUser;
            if (!user) {
                showError('You must be logged in to register a vehicle.');
                return;
            }

            setButtonLoading(true);

            // Build vehicle data object
            const vehicleData = {
                type: type,
                make: make,
                model: model,
                year: vehicleYear.value.trim() || null,
                color: vehicleColor.value.trim() || null,
                licensePlate: plate.toUpperCase(),
                area: areaValue,
                areaLat: areaLat.value || null,
                areaLng: areaLng.value || null,
                registeredBy: user.uid,
                registeredByEmail: user.email,
                registeredAt: firebase.database.ServerValue.TIMESTAMP,
                status: 'active'
            };

            // Save to Firebase Realtime Database
            const newVehicleRef = database.ref('vehicles').push();

            newVehicleRef.set(vehicleData)
                .then(() => {
                    setButtonLoading(false);
                    showSuccess('✅ Vehicle registered successfully!');

                    // Reset form
                    vehicleType.value = '';
                    vehicleMake.value = '';
                    vehicleModel.value = '';
                    vehicleYear.value = '';
                    vehicleColor.value = '';
                    licensePlate.value = '';
                    areaLat.value = '';
                    areaLng.value = '';
                    areaName.value = '';

                    // Clear geocoder input
                    const geocoderInput = document.querySelector('.mapboxgl-ctrl-geocoder input');
                    if (geocoderInput) {
                        geocoderInput.value = '';
                    }
                    const fallbackInput = document.getElementById('areaFallback');
                    if (fallbackInput) {
                        fallbackInput.value = '';
                    }

                    console.log('🚗 Vehicle ID:', newVehicleRef.key);
                })
                .catch((error) => {
                    setButtonLoading(false);
                    showError('❌ Error saving vehicle: ' + error.message);
                    console.error('Firebase error:', error);
                });
        });

        // ============================================================
        // DEMO: Pre-fill with test data (optional)
        // ============================================================
        console.log('✅ Admin dashboard ready.');
        console.log('📌 Vehicle Type: Minibus taxis removed.');
        console.log('📌 Assigned Rank removed.');
        console.log('📌 Area field with Mapbox geocoder added.');
        console.log('📌 Mapbox token: ' + (MAPBOX_TOKEN === 'YOUR_MAPBOX_TOKEN_HERE' ? '⚠️ NOT SET' : '✅ SET'));
    </script>

</body>
</html>
