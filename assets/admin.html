<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard · Asye</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0e14;
            color: #e8ecf4;
            min-height: 100vh;
        }

        .navbar {
            background: #141a24;
            border-bottom: 1px solid #2a3340;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .navbar .brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        .navbar .brand span {
            color: #5b7cfa;
        }
        .navbar .user-info {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            font-size: 0.85rem;
            color: #8b95a9;
        }
        .navbar .user-info .email {
            color: #e8ecf4;
        }
        .navbar .user-info .btn-logout {
            background: #2a3340;
            border: none;
            color: #f28b82;
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .navbar .user-info .btn-logout:hover {
            background: #3a2a2a;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 240px 1fr;
            min-height: calc(100vh - 68px);
        }

        .sidebar {
            background: #10161e;
            border-right: 1px solid #1f2836;
            padding: 1.5rem 0;
        }
        .sidebar .menu-item {
            padding: 0.7rem 1.8rem;
            color: #8b95a9;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            border-left: 3px solid transparent;
        }
        .sidebar .menu-item:hover {
            background: #1a222e;
            color: #e8ecf4;
        }
        .sidebar .menu-item.active {
            color: #ffffff;
            background: #1a222e;
            border-left-color: #5b7cfa;
        }
        .sidebar .menu-item .icon {
            margin-right: 0.6rem;
        }
        .sidebar .divider {
            border-top: 1px solid #1f2836;
            margin: 0.8rem 1.5rem;
        }
        .sidebar .menu-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4d5b70;
            padding: 0.4rem 1.8rem;
        }

        .main-content {
            padding: 2rem 2.5rem;
            overflow-y: auto;
            max-height: calc(100vh - 68px);
        }
        .main-content .page-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }
        .main-content .page-sub {
            color: #8b95a9;
            font-size: 0.9rem;
            margin-bottom: 1.8rem;
        }

        .form-card {
            background: #141a24;
            border: 1px solid #2a3340;
            border-radius: 16px;
            padding: 1.8rem 2rem;
            max-width: 700px;
        }
        .form-card .form-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.2rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            color: #c8d0dc;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 0.3rem;
        }
        .form-group label .required {
            color: #f28b82;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            background: #1e2632;
            border: 1px solid #2f3a48;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: #f0f4fa;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.25s, box-shadow 0.25s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #5b7cfa;
            box-shadow: 0 0 0 4px rgba(91, 124, 250, 0.12);
        }
        .form-group input::placeholder {
            color: #5d6a7e;
        }
        .form-group select option {
            background: #141a24;
            color: #e8ecf4;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .btn-submit {
            background: #5b7cfa;
            border: none;
            border-radius: 40px;
            padding: 0.8rem 2.5rem;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(91, 124, 250, 0.3);
        }
        .btn-submit:hover {
            background: #4a6ae8;
            box-shadow: 0 6px 24px rgba(91, 124, 250, 0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .btn-submit .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #2f3a48;
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .success-msg {
            background: #1a2a1a;
            border: 1px solid #2a4a2a;
            border-radius: 12px;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            color: #6f8a6f;
            font-size: 0.85rem;
            display: none;
        }
        .success-msg.show {
            display: block;
        }
        .error-msg {
            background: #1e1a1f;
            border: 1px solid #4a2a2a;
            border-radius: 12px;
            padding: 0.7rem 1rem;
            margin-bottom: 1rem;
            color: #f28b82;
            font-size: 0.85rem;
            display: none;
        }
        .error-msg.show {
            display: block;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .sidebar {
                display: none;
            }
            .main-content {
                padding: 1.5rem;
                max-height: none;
            }
            .navbar {
                padding: 0.6rem 1rem;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
            .form-card {
                padding: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">Asye<span>Admin</span></div>
        <div class="user-info">
            <span class="email" id="userEmail">Loading...</span>
            <button class="btn-logout" id="logoutBtn">Sign Out</button>
        </div>
    </nav>

    <div class="dashboard">

        <aside class="sidebar">
            <div class="menu-item active"><span class="icon">📊</span> Dashboard</div>
            <div class="menu-item"><span class="icon">🚗</span> Vehicles</div>
            <div class="menu-item"><span class="icon">👥</span> Drivers</div>
            <div class="menu-item"><span class="icon">📝</span> Trips</div>
            <div class="divider"></div>
            <div class="menu-label">System</div>
            <div class="menu-item"><span class="icon">🔐</span> Security</div>
            <div class="menu-item"><span class="icon">⚙️</span> Settings</div>
        </aside>

        <main class="main-content">

            <div class="page-title">👤 Driver Registration</div>
            <div class="page-sub">Register a new driver in the system</div>

            <div id="successMsg" class="success-msg"></div>
            <div id="errorMsg" class="error-msg"></div>

            <div class="form-card">
                <div class="form-title">Driver Details</div>

                <form id="driverForm" onsubmit="return false;">

                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="fullName">Full Name <span class="required">*</span></label>
                        <input type="text" id="fullName" placeholder="e.g. John Doe" required />
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email Address <span class="required">*</span></label>
                        <input type="email" id="email" placeholder="e.g. driver@example.com" required />
                    </div>

                    <!-- Phone -->
                    <div class="form-group">
                        <label for="phone">Phone Number <span class="required">*</span></label>
                        <input type="tel" id="phone" placeholder="e.g. 0821234567" required />
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Temporary Password <span class="required">*</span></label>
                        <input type="password" id="password" placeholder="Min 6 characters" required minlength="6" />
                        <div style="font-size:0.7rem; color:#5d6a7e; margin-top:0.3rem;">
                            🔒 This will be the driver's initial login PIN
                        </div>
                    </div>

                    <!-- License Number -->
                    <div class="form-group">
                        <label for="licenseNumber">License Number <span class="required">*</span></label>
                        <input type="text" id="licenseNumber" placeholder="e.g. DL1234567890" required />
                    </div>

                    <!-- Vehicle Make & Model (row) -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="vehicleMake">Vehicle Make</label>
                            <input type="text" id="vehicleMake" placeholder="e.g. Toyota" />
                        </div>
                        <div class="form-group">
                            <label for="vehicleModel">Vehicle Model</label>
                            <input type="text" id="vehicleModel" placeholder="e.g. Corolla" />
                        </div>
                    </div>

                    <!-- Year & Color (row) -->
                    <div class="form-row">
                        <div class="form-group">
                            <label for="vehicleYear">Vehicle Year</label>
                            <input type="number" id="vehicleYear" placeholder="e.g. 2020" min="1950" max="2026" />
                        </div>
                        <div class="form-group">
                            <label for="vehicleColor">Vehicle Color</label>
                            <input type="text" id="vehicleColor" placeholder="e.g. Red, Blue, White" />
                        </div>
                    </div>

                    <!-- License Plate -->
                    <div class="form-group">
                        <label for="licensePlate">License Plate <span class="required">*</span></label>
                        <input type="text" id="licensePlate" placeholder="e.g. ABC 123 GP" required />
                    </div>

                    <!-- AREA -->
                    <div class="form-group">
                        <label for="area">Area <span class="required">*</span></label>
                        <input type="text" id="area" placeholder="e.g. Johannesburg, Cape Town, Durban" required />
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">
                        Register Driver
                    </button>
                </form>
            </div>

        </main>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCX_euO2EEPhfhuG5DTsSi5vCpZ9MFZczY",
            authDomain: "asiye-80386.firebaseapp.com",
            databaseURL: "https://asiye-80386-default-rtdb.firebaseio.com",
            projectId: "asiye-80386",
            storageBucket: "asiye-80386.firebasestorage.app",
            appId: "1:531902350858:web:f8a4a246bf350d50e3c1f3"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // DOM REFS
        const userEmailEl = document.getElementById('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');

        const driverForm = document.getElementById('driverForm');
        const fullName = document.getElementById('fullName');
        const email = document.getElementById('email');
        const phone = document.getElementById('phone');
        const password = document.getElementById('password');
        const licenseNumber = document.getElementById('licenseNumber');
        const vehicleMake = document.getElementById('vehicleMake');
        const vehicleModel = document.getElementById('vehicleModel');
        const vehicleYear = document.getElementById('vehicleYear');
        const vehicleColor = document.getElementById('vehicleColor');
        const licensePlate = document.getElementById('licensePlate');
        const area = document.getElementById('area');
        const submitBtn = document.getElementById('submitBtn');

        const successMsg = document.getElementById('successMsg');
        const errorMsg = document.getElementById('errorMsg');

        // AUTH CHECK
        auth.onAuthStateChanged((user) => {
            if (user) {
                userEmailEl.textContent = user.email || 'admin@asiye.cloud';
                console.log('✅ Dashboard loaded for:', user.email);
            } else {
                console.log('🔒 No user found, redirecting to login...');
                window.location.href = 'admin-login.html';
            }
        });

        // LOGOUT
        logoutBtn.addEventListener('click', function() {
            auth.signOut().then(() => {
                window.location.href = 'admin-login.html';
            }).catch((error) => {
                alert('Error signing out: ' + error.message);
            });
        });

        // FORM SUBMISSION - SAVES TO /taxis/ NODE
        function showSuccess(message) {
            successMsg.textContent = message;
            successMsg.className = 'success-msg show';
            errorMsg.className = 'error-msg';
        }

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.className = 'error-msg show';
            successMsg.className = 'success-msg';
        }

        function setButtonLoading(loading) {
            if (loading) {
                submitBtn.innerHTML = '<span class="spinner"></span> Creating Driver...';
                submitBtn.disabled = true;
            } else {
                submitBtn.innerHTML = 'Register Driver';
                submitBtn.disabled = false;
            }
        }

        driverForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = fullName.value.trim();
            const emailVal = email.value.trim();
            const phoneVal = phone.value.trim();
            const passVal = password.value.trim();
            const licenseVal = licenseNumber.value.trim();
            const plateVal = licensePlate.value.trim();
            const areaVal = area.value.trim();

            if (!name || !emailVal || !phoneVal || !passVal || !licenseVal || !plateVal || !areaVal) {
                showError('Please fill in all required fields (marked with *).');
                return;
            }

            if (passVal.length < 6) {
                showError('Password must be at least 6 characters.');
                return;
            }

            const adminUser = auth.currentUser;
            if (!adminUser) {
                showError('You must be logged in to register a driver.');
                return;
            }

            setButtonLoading(true);

            // STEP 1: Create Firebase Auth account
            auth.createUserWithEmailAndPassword(emailVal, passVal)
                .then((userCredential) => {
                    const driverUid = userCredential.user.uid;

                    // STEP 2: Save driver data to /taxis/ node (not /drivers/)
                    const driverData = {
                        name: name,
                        email: emailVal,
                        phone: phoneVal,
                        tempPassword: passVal,
                        licenseNumber: licenseVal,
                        vehicleMake: vehicleMake.value.trim() || null,
                        vehicleModel: vehicleModel.value.trim() || null,
                        vehicleYear: vehicleYear.value.trim() || null,
                        vehicleColor: vehicleColor.value.trim() || null,
                        licensePlate: plateVal.toUpperCase(),
                        area: areaVal,
                        registeredBy: adminUser.uid,
                        registeredByEmail: adminUser.email,
                        registeredAt: firebase.database.ServerValue.TIMESTAMP,
                        status: 'active',
                        isOnline: false,
                        destination: null,
                        // Additional fields expected by the driver app
                        profilePhoto: null,
                        rating: 0,
                        totalTrips: 0,
                        earnings: 0
                    };

                    console.log('📝 Saving driver to /taxis/:', driverData);

                    return database.ref('taxis/' + driverUid).set(driverData);
                })
                .then(() => {
                    setButtonLoading(false);
                    showSuccess('✅ Driver registered successfully in /taxis/!');

                    // Reset form
                    fullName.value = '';
                    email.value = '';
                    phone.value = '';
                    password.value = '';
                    licenseNumber.value = '';
                    vehicleMake.value = '';
                    vehicleModel.value = '';
                    vehicleYear.value = '';
                    vehicleColor.value = '';
                    licensePlate.value = '';
                    area.value = '';

                    console.log('👤 Driver registered successfully in /taxis/ node!');
                })
                .catch((error) => {
                    setButtonLoading(false);

                    let errorMessage = error.message;
                    if (error.code === 'auth/email-already-in-use') {
                        errorMessage = 'This email is already registered. Please use a different email.';
                    } else if (error.code === 'auth/weak-password') {
                        errorMessage = 'Password is too weak. Please use at least 6 characters.';
                    } else if (error.code === 'auth/invalid-email') {
                        errorMessage = 'Please enter a valid email address.';
                    } else if (error.code === 'auth/network-request-failed') {
                        errorMessage = 'Network error. Please check your internet connection.';
                    } else if (error.message.includes('PERMISSION_DENIED')) {
                        errorMessage = 'Permission denied. Please check Firebase rules for /taxis node.';
                    }

                    showError('❌ Error: ' + errorMessage);
                    console.error('Firebase error details:', error);
                });
        });

        console.log('✅ Admin dashboard ready.');
        console.log('📌 Drivers saved to /taxis/ node with phone & email.');
    </script>

</body>
</html>
