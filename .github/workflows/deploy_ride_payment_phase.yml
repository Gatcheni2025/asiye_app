name: Deploy Ride Payment Phase

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy_ride_payment_phase.yml'
  workflow_dispatch:

permissions:
  contents: read

# Redeploy after restoring Paystack wallet/card flow and payment CORS.

jobs:
  deploy:
    name: Validate, deploy and smoke-test ride payments
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIREBASE_CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASIYE_80386 || secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout validated Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: security-payments-phase5

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Install security test dependencies
        working-directory: test/security
        run: npm install --no-audit --no-fund

      - name: Validate payment and ride JavaScript
        run: |
          set -euo pipefail
          node --check functions/index.js
          node --check functions/paystack-wallet.js
          node --check functions/club-pool-security.js
          node --check functions/ride-payment-validation.js
          node --check functions/production-trip-validation.js
          node --check assets/member-pages.js
          node --check assets/passenger-v2/js/wallet.js
          node --check assets/passenger-v2/js/booking.js
          node --check assets/passenger-v2/js/club.js
          node --check assets/passenger-v2/js/ride-controller.js
          node --check assets/driver-v2/js/trip-controller.js
          node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8')); console.log('database.rules.json OK')"

      - name: Run Firebase security suite
        working-directory: test/security
        run: npx firebase emulators:exec --only database --project asiye-security-validation --config ../../firebase.json "npm test"

      - name: Verify Firebase deployment secret
        shell: bash
        run: |
          if [ -z "$FIREBASE_CREDS" ]; then
            echo "::error::Firebase service-account secret is unavailable."
            exit 1
          fi

      - name: Authenticate to Firebase production
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_CREDS }}

      - name: Deploy hardened Realtime Database rules
        run: >
          npx --yes firebase-tools@latest deploy
          --project asiye-80386
          --only database
          --non-interactive

      - name: Deploy ride payment functions
        run: >
          npx --yes firebase-tools@latest deploy
          --project asiye-80386
          --only "functions:prepareTripPayment,functions:verifyTripCardPayment,functions:settleTripPayment,functions:releaseTripPayment,functions:initializePaystackWalletTopup,functions:verifyPaystackWalletTopup,functions:paystackPaymentReturn,functions:paystackWebhook,functions:joinClubPoolSecure,functions:notifyDriversWhenClubReady,functions:refreshClubPaymentReadinessAfterSafetyShare,functions:releaseCancelledGoTripPayment,functions:releaseCancelledClubPassengerPayment"
          --non-interactive

      - name: Run production cash-card-wallet smoke
        working-directory: functions
        run: node ride-payment-validation.js

      - name: Re-run production Go and Club compatibility
        working-directory: functions
        run: node production-trip-validation.js

      - name: Payment deployment summary
        run: |
          echo "RIDE PAYMENT PHASE: PASS"
          echo "Cash, Card, Wallet hold/settlement and Go/Club compatibility validated."
