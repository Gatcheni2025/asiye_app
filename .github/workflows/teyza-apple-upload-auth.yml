name: Teyza Apple upload credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    if: github.repository == 'Gatcheni2025/asiye_app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography==46.0.3'
      - name: Save existing Apple API authentication to Teyza without displaying values
        env:
          GH_TOKEN: ${{ secrets.TEYZA_SIGNING_TRANSFER_TOKEN }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import base64,os,re,subprocess,sys,uuid
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          try:
              if not os.environ.get('GH_TOKEN'): raise ValueError()
              key_id=os.environ['ASC_KEY_ID'].strip()
              issuer=str(uuid.UUID(os.environ['ASC_ISSUER_ID'].strip()))
              if not re.fullmatch(r'[A-Za-z0-9]{10}',key_id): raise ValueError()
              text=os.environ['ASC_PRIVATE_KEY'].strip()
              if 'BEGIN PRIVATE KEY' not in text: text=base64.b64decode(text).decode('ascii')
              text=text.replace('\\n','\n')
              private=serialization.load_pem_private_key(text.encode('ascii'),password=None)
              if not isinstance(private,ec.EllipticCurvePrivateKey) or not isinstance(private.curve,ec.SECP256R1): raise ValueError()
              normalized=private.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()).decode('ascii')
              values={'TEYZA_ASC_KEY_ID':key_id,'TEYZA_ASC_ISSUER_ID':issuer,'TEYZA_ASC_PRIVATE_KEY':normalized}
              for name,value in values.items():
                  result=subprocess.run(['gh','secret','set',name,'--repo','Gatcheni2025/Business-lift'],input=value.encode('ascii'),stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=60)
                  if result.returncode: raise ValueError()
              print('Three Teyza App Store Connect upload secrets saved. No app has been uploaded or submitted by this helper.')
          except Exception:
              print('Upload authentication setup stopped. Check existing Apple API secrets and transfer-token Secrets write access.',file=sys.stderr)
              sys.exit(1)
          PY
