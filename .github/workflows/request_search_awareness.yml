name: Request Search Awareness

on:
  push:
    branches:
      - feature/11.0.61-331-pricing-search
    paths:
      - 'functions/index.js'
      - 'assets/passenger-v2/js/ride-controller.js'
      - 'assets/passenger-v2/js/app.js'
      - 'assets/passenger-v2/css/app.css'
      - 'test/request-search-awareness.test.cjs'
      - '.github/workflows/request_search_awareness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JavaScript syntax
        run: |
          node --check functions/index.js
          node --check assets/passenger-v2/js/ride-controller.js
          node --check assets/passenger-v2/js/app.js

      - name: Validate passenger request awareness
        run: node --test test/request-search-awareness.test.cjs
