name: Deploy active trip and payment cash pickup and PIN 340
on:
  push:
    branches: [fix/11.0.67-club-booking-arrival-pin-timer]
    paths: ['.github/workflows/deploy_active_trip_339.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asiye-secure-functions-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/fix/11.0.67-club-booking-arrival-pin-timer'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FIREBASE_CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASIYE_80386 || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm source and credentials
        run: |
          test "$(awk '/^version:/ {print $2}' pubspec.yaml)" = '11.0.70+340'
          test -n "$FIREBASE_CREDS"
      - name: Install dependencies
        run: |
          npm --prefix functions install --no-audit --no-fund
          npm --prefix test/security install --no-audit --no-fund
      - name: Validate continuation and regression tests
        run: |
          node --check functions/index.js
          node --check functions/go-continuation.js
          node --test test/go-continuation.test.cjs test/club-lifecycle.test.cjs test/card-booking-sequence.test.cjs test/go-fare-negotiation.test.cjs test/go-fare-settlement-lifecycle.test.cjs test/active-booking-recovery.test.cjs test/preloader-readiness.test.cjs
      - name: Validate database rules and restoration behavior
        working-directory: test/security
        run: npx firebase emulators:exec --only database --project asiye-security-validation --config ../../firebase.json "npm test"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_CREDS }}
      - name: Deploy matching endpoints, then database protections
        run: |
          set -euo pipefail
          for FN in goTripActionSecure finalizeNegotiatedGoBooking continueGoAfterPayment createTripShareToken clubDriverActionSecure prepareTripPayment verifyTripCardPayment paystackWebhook acceptGoFareOffer acceptGoFareCounter settleTripPayment; do
            npx --yes firebase-tools@latest deploy --project asiye-80386 --only "functions:$FN" --non-interactive
          done
          npx --yes firebase-tools@latest deploy --project asiye-80386 --only database --non-interactive
      - name: Verify isolated cash pickup, PIN and dropoff flow
        working-directory: functions
        run: node production-cash-pickup-validation.js
      - name: Check installed-app endpoint access
        run: |
          node - <<'JS'
          const {checkEndpoint} = require('./scripts/club-network-readiness.cjs');
          (async () => {
            for (const endpoint of ['goTripActionSecure','prepareTripPayment','finalizeNegotiatedGoBooking','settleTripPayment'])
              for (const origin of ['https://appassets.androidplatform.net','https://app.asiye.cloud']) {
                await checkEndpoint(endpoint, origin);
                console.log(`PASS ${endpoint} ${origin}`);
              }
          })().catch(error => {console.error(error.message);process.exitCode=1;});
          JS
