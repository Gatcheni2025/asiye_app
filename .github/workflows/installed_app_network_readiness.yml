name: Installed App Network Readiness

on:
  push:
    branches:
      - security-payments-phase5
    paths:
      - '.github/workflows/installed_app_network_readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cors:
    name: Verify installed WebView API reachability
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify appassets CORS preflight on ride and profile endpoints
        shell: bash
        run: |
          set -euo pipefail

          endpoints=(
            createTripShareToken
            joinClubPoolSecure
            uploadProfileImageProxy
            confirmTripWalletReady
          )

          for endpoint in "${endpoints[@]}"; do
            headers="/tmp/${endpoint}.headers"
            code=$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}'               -X OPTIONS               -H 'Origin: https://appassets.androidplatform.net'               -H 'Access-Control-Request-Method: POST'               -H 'Access-Control-Request-Headers: authorization,content-type'               "https://us-central1-asiye-80386.cloudfunctions.net/${endpoint}")

            if [ "$code" != "204" ]; then
              echo "::error::${endpoint} preflight returned HTTP ${code}"
              cat "$headers"
              exit 1
            fi

            grep -qi '^access-control-allow-origin:' "$headers"
            grep -qi '^access-control-allow-headers:.*Authorization' "$headers"
            grep -qi '^access-control-allow-methods:.*POST' "$headers"

            echo "PASS ${endpoint} WebView CORS"
          done

      - name: Verify endpoints are reachable rather than network-blocked
        shell: bash
        run: |
          set -euo pipefail

          for endpoint in createTripShareToken joinClubPoolSecure uploadProfileImageProxy confirmTripWalletReady; do
            code=$(curl -sS -o "/tmp/${endpoint}.json" -w '%{http_code}'               -X POST               -H 'Origin: https://appassets.androidplatform.net'               -H 'Content-Type: application/json'               --data '{}'               "https://us-central1-asiye-80386.cloudfunctions.net/${endpoint}")

            if [ "$code" != "401" ]; then
              echo "::error::${endpoint} unauthenticated reachability check returned HTTP ${code}"
              cat "/tmp/${endpoint}.json"
              exit 1
            fi

            echo "PASS ${endpoint} reachable and authentication-protected"
          done
