name: Paystack Technical Readiness
on:
  workflow_dispatch:
  push:
    branches: ['fix/paystack-subaccounts-cash-card-no-wallet']
    paths:
      - 'functions/index.js'
      - 'functions/paystack-*.js'
      - 'database.rules.json'
      - 'scripts/paystack*.cjs'
      - 'scripts/paystack_function_manifest.json'
      - '.github/workflows/paystack_technical_readiness.yml'
permissions:
  contents: read
jobs:
  external-prerequisites:
    name: Read-only Paystack and Firebase prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix functions install --no-audit --no-fund
      - name: Check TEST subaccount and deployed endpoint / rule inventory
        env:
          PAYSTACK_TEST_SECRET_KEY: ${{ secrets.PAYSTACK_TEST_SECRET_KEY }}
          PAYSTACK_TEST_DRIVER_SUBACCOUNT: ${{ vars.PAYSTACK_TEST_DRIVER_SUBACCOUNT }}
          FIREBASE_CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASIYE_80386 || secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_STAGING_PROJECT: ${{ vars.FIREBASE_STAGING_PROJECT }}
          FIREBASE_STAGING_CREDS: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT }}
        run: node scripts/paystack_technical_readiness.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asiye-paystack-technical-readiness
          path: paystack-readiness/technical-readiness.json
          if-no-files-found: error
          retention-days: 14
