name: Deploy Security Functions

on:
  workflow_dispatch:
  push:
    branches:
      - security-compatibility-phase4
      - release/11.0.60-330-work-final
      - feature/11.0.61-331-pricing-search
    paths:
      - 'functions/index.js'
      - 'functions/club-pool-security.js'
      - 'functions/trip-share-security.js'
      - '.github/workflows/deploy_security_functions.yml'

permissions:
  contents: read

concurrency:
  group: asiye-secure-functions-deploy
  cancel-in-progress: true

# Redeploy after tracking-host compatibility fix.

# Fresh runs read repository secrets when queued.

jobs:
  deploy:
    name: Deploy secure trip functions
    runs-on: ubuntu-latest
    env:
      FIREBASE_CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASIYE_80386 || secrets.FIREBASE_SERVICE_ACCOUNT }}
    timeout-minutes: 45

    steps:
      - name: Checkout compatibility branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Validate function syntax
        run: |
          node --check functions/index.js
          node --check functions/club-pool-security.js
          node --check functions/trip-share-security.js
          node --check functions/production-go-negotiation-validation.js

      - name: Test protected Go financial lifecycle
        run: node --test test/go-fare-negotiation.test.cjs test/go-fare-settlement-lifecycle.test.cjs

      - name: Verify Firebase deployment secret
        shell: bash
        run: |
          if [ -z "$FIREBASE_CREDS" ]; then
            echo "::error::Firebase service-account secret is not available to this workflow. Add it as a repository Actions secret named FIREBASE_SERVICE_ACCOUNT_ASIYE_80386 (preferred) or FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi

      - name: Authenticate to Firebase project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_CREDS }}

      - name: Deploy protected Go and Work functions sequentially
        shell: bash
        run: |
          set -euo pipefail

          # Work/privacy functions are already deployed from the validated
          # 330/331 runs. Deploy only the Go search + negotiation + financial
          # lifecycle functions touched by this release, one at a time to stay
          # below the Cloud Run regional CPU deployment quota.
          FUNCTIONS=(
            dispatchGoRideRequest
            submitGoFareOffer
            counterGoFare
            acceptGoFareOffer
            acceptGoFareCounter
            declineGoFareCounter
            finalizeNegotiatedGoBooking
            prepareTripPayment
            verifyTripCardPayment
            settleTripPayment
            releaseTripPayment
            releaseCancelledGoTripPayment
            disburseCompletedCardTrips
          )

          for FN in "${FUNCTIONS[@]}"; do
            echo "Deploying function: $FN"
            npx --yes firebase-tools@latest deploy               --project asiye-80386               --only "functions:$FN"               --non-interactive
            sleep 3
          done

      - name: Run isolated production negotiated Go lifecycle
        run: node functions/production-go-negotiation-validation.js
