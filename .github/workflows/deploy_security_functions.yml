name: Deploy Security Functions

on:
  workflow_dispatch:
  push:
    branches:
      - security-compatibility-phase4
    paths:
      - '.github/workflows/deploy_security_functions.yml'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy secure trip functions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout compatibility branch
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Validate function syntax
        run: |
          node --check functions/index.js
          node --check functions/club-pool-security.js
          node --check functions/trip-share-security.js

      - name: Authenticate to Firebase project
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASIYE_80386 }}

      - name: Deploy compatibility functions only
        run: >
          npx --yes firebase-tools@latest deploy
          --project asiye-80386
          --only "functions:createTripShareToken,functions:getTripShare,functions:joinClubPoolSecure"
          --non-interactive
