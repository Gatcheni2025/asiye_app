name: Asiye 348 Android and iOS Release Candidates

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Build and upload the signed iOS beta to TestFlight'
        required: true
        type: choice
        options: ['no', 'yes']
        default: 'no'
  push:
    branches: ['fix/paystack-subaccounts-cash-card-no-wallet']
    paths:
      - '.github/workflows/android_paystack_review_apk.yml'

permissions:
  contents: read

concurrency:
  group: android-paystack-review-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ASIYE_SOURCE_VERSION: '11.0.78+348'
  ASIYE_IOS_MARKETING_VERSION: '46522.0.6'

jobs:
  validation:
    name: Payment, booking and Firebase security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify release ancestry and selected review version
        run: |
          test "$GITHUB_REF_NAME" = 'fix/paystack-subaccounts-cash-card-no-wallet'
          test "$(awk '/^version:/ {print $2}' pubspec.yaml)" = '11.0.78+348'
          bash scripts/verify_payment_release_341_lineage.sh
          node scripts/ios_release_preflight.cjs
      - name: Check JavaScript syntax
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find functions -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test signed mobile asset parity validator
        run: |
          python3 -m unittest discover -s test -p 'test_mobile_bundle_assets.py'
          python3 -m unittest discover -s test -p 'test_android_native_pages.py'
          python3 -m unittest discover -s test -p 'test_ios_release_metadata.py'
      - name: Paystack failure, duplicate callback, Parcel PIN, cancellation and booking regressions
        run: >
          node --test
          test/paystack-subaccount-migration.test.cjs
          test/paystack-payment-safety.test.cjs
          test/paystack-card-journey-simulation.test.cjs
          test/parcel-security.test.cjs
          test/driver-first-card-booking.test.cjs
          test/go-continuation.test.cjs
          test/club-lifecycle.test.cjs
          test/card-booking-sequence.test.cjs
          test/go-fare-settlement-lifecycle.test.cjs
          test/member-pages.test.cjs
          test/admin-portal.test.cjs
      - name: Authentication and active booking regressions
        run: >
          node --test
          test/login-otp.test.cjs
          test/native-auth-session.test.cjs
          test/native-social-phone-link.test.cjs
          test/staging-passenger-social-phone-link.test.cjs
          test/staging-auth-recaptcha.test.cjs
          test/card-payout-passenger.test.cjs
          test/club-work-readiness.test.cjs
          test/request-search-awareness.test.cjs
          test/go-fare-negotiation.test.cjs
          test/passenger-booking-identity.test.cjs
          test/active-booking-recovery.test.cjs
          test/preloader-readiness.test.cjs
          test/v2-navigation.test.cjs
      - name: Install emulator and handler test dependencies
        run: |
          npm --prefix test/security install --no-audit --no-fund
          npm --prefix functions install --no-audit --no-fund
      - name: Firebase authorization, cancellation, verified driver logout and exported handlers
        working-directory: test/security
        run: npx firebase emulators:exec --only database --project asiye-security-validation --config ../../firebase.json 'npm test'

      - name: Install headless Chromium
        working-directory: test/security
        run: npx playwright install --with-deps chromium --only-shell
      - name: Render and check phone layouts
        working-directory: test/security
        run: node render-ride-confirmation.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: asiye-11.0.78-348-ui-review
          path: ui-review/
          if-no-files-found: error
          retention-days: 7

  android:
    name: Signed Android 11.0.78 (348) APK and AAB
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Restore existing Asiye release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo '::error::Existing release keystore is unavailable.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/asiye-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=asiye-release.jks
          EOF
      - run: flutter pub get
      - name: Analyze Flutter compilation errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Verify native OTP linking and account collision recovery
        run: flutter test test/native_phone_auth_test.dart
      - name: Build signed Android App Bundle
        run: flutter build appbundle --release
      - name: Build review APK
        run: flutter build apk --release
      - name: Verify signature, Firebase certificate and APK version
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          CERTS=$(keytool -list -v -keystore android/app/asiye-release.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD")
          export RELEASE_SHA1=$(printf '%s\n' "$CERTS" | sed -n 's/.*SHA1: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          python3 - <<'PY'
          import json, os
          data = json.load(open('android/app/google-services.json', encoding='utf-8'))
          hashes = {oauth['android_info']['certificate_hash'].lower()
              for client in data.get('client', []) for oauth in client.get('oauth_client', [])
              if oauth.get('android_info', {}).get('package_name') == 'com.asiyeapp.asiye'
              and oauth.get('android_info', {}).get('certificate_hash')}
          actual = os.environ['RELEASE_SHA1']
          assert actual and actual in hashes, 'Release signing certificate is not registered with Firebase Phone Auth'
          print('Release signing certificate matches the Firebase configuration.')
          PY
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APK_PACKAGE=$("$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | sed -n '1p')
          printf '%s\n' "$APK_PACKAGE"
          printf '%s\n' "$APK_PACKAGE" | grep -F "name='com.asiyeapp.asiye'"
          printf '%s\n' "$APK_PACKAGE" | grep -F "versionCode='348'"
          printf '%s\n' "$APK_PACKAGE" | grep -F "versionName='11.0.78'"
          TARGET_API=$("$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | sed -n "s/^targetSdkVersion:'\([0-9]*\)'.*/\1/p")
          test "$TARGET_API" -ge 36
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 -v 4 build/app/outputs/flutter-apk/app-release.apk
      - name: Validate AAB signature and version
        run: |
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | tee aab-signature.txt
          grep -F 'jar verified' aab-signature.txt
          curl --fail --location --silent --show-error https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle=build/app/outputs/bundle/release/app-release.aab
          test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=build/app/outputs/bundle/release/app-release.aab --xpath='/manifest/@android:versionCode')" = '348'
          test "$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=build/app/outputs/bundle/release/app-release.aab --xpath='/manifest/@android:versionName')" = '11.0.78'
          java -jar "$RUNNER_TEMP/bundletool.jar" dump config --bundle=build/app/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/asiye-aab-config.json"
          grep -F 'PAGE_ALIGNMENT_16K' "$RUNNER_TEMP/asiye-aab-config.json"
      - name: Prepare installation download and build details
        shell: bash
        run: |
          python3 scripts/verify_mobile_bundle_assets.py --artifact build/app/outputs/flutter-apk/app-release.apk --expected-project asiye-80386
          python3 scripts/verify_mobile_bundle_assets.py --artifact build/app/outputs/bundle/release/app-release.aab --expected-project asiye-80386
          python3 scripts/verify_android_native_pages.py --artifact build/app/outputs/flutter-apk/app-release.apk
          python3 scripts/verify_android_native_pages.py --artifact build/app/outputs/bundle/release/app-release.aab
          mkdir -p review-apk
          cp build/app/outputs/flutter-apk/app-release.apk review-apk/Asiye-11.0.78-348.apk
          cp build/app/outputs/bundle/release/app-release.aab review-apk/Asiye-11.0.78-348.aab
          (
            cd review-apk
            sha256sum Asiye-11.0.78-348.apk Asiye-11.0.78-348.aab > SHA256SUMS.txt
          )
          cat > review-apk/BUILD-INFO.txt <<EOF
          Asiye Android 11.0.78 (348) — APK for testing and AAB for Play review
          Source commit: $GITHUB_SHA
          Source branch: $GITHUB_REF_NAME
          Package: com.asiyeapp.asiye
          Firebase project: asiye-80386 (production-configured candidate; NOT a staging build)
          Native Google/Apple phone verification links the OTP to the existing UID.
          All reviewed WebView assets match this commit inside each signed package.
          Signed using the existing Asiye release keystore; Firebase certificate checked.
          Automated payment, booking and Firebase authorization checks passed before build.
          Paystack responses and identity are simulated in engineering tests.
          Real provider transactions, refunds, settlements and device testing are not certified by this build.
          Secure Card and Parcel workflows require the matching reviewed backend and rules.
          This workflow does not deploy Firebase functions, rules, hosting or mobile stores.
          Go negotiation: valid offers are delivered during authenticated submission; 65% is the minimum, 90% is recommended and the 95% ceiling is retained. Drivers decide whether to accept, decline or counter.
          Go offers and counters remain open for a decision; no automatic driver rejection or counter expiry. Passenger counter acceptance is bound to the fare displayed.
          Cancelled bookings release only their own active reference and can be booked again without administrator intervention.
          Driver logout confirms offline availability before signing out; live incoming offers include recommended counters and net earnings.
          Live Card checkout requires server-recorded provider approval and technical validation; a live key alone cannot enable it.
          Refund reservations prevent duplicate provider requests; verified callbacks cannot reverse completed refunds.
          Go offer delivery status: docs/RELEASE_348.md; payment acceptance: docs/PAYSTACK_TECHNICAL_ACCEPTANCE_20261017.md
          Support: admin@asiye.cloud | 031 566 1165
          EOF
          cat review-apk/BUILD-INFO.txt >> "$GITHUB_STEP_SUMMARY"
          cat review-apk/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: asiye-11.0.78-348-android
          path: review-apk/
          if-no-files-found: error
          retention-days: 30


  ios:
    name: Signed iOS IPA (TestFlight upload only on explicit manual request)
    needs: validation
    runs-on: macos-latest
    timeout-minutes: 65
    env:
      ASIYE_TESTFLIGHT_UPLOAD_CONFIRMED: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight == 'yes' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate iOS source and signing tools
        run: |
          node scripts/ios_release_preflight.cjs
          ruby -c ios/fastlane/Fastfile
          fastlane --version
          plutil -lint ios/Runner/Info.plist ios/Runner/GoogleService-Info.plist
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore signing access
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          test -n "$GH_PAT" || { echo '::error::Missing GH_PAT signing secret'; exit 1; }
          MATCH_AUTH="$(printf 'x-access-token:%s' "$GH_PAT" | base64 | tr -d '\n')"
          echo "::add-mask::$MATCH_AUTH"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$MATCH_AUTH" >> "$GITHUB_ENV"
      - name: Build and verify signed IPA; upload only when explicitly requested
        id: ios
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          test -n "$MATCH_PASSWORD" || { echo '::error::Missing Match signing password'; exit 1; }
          test -n "$APP_STORE_CONNECT_KEY_ID" || { echo '::error::Missing App Store Connect key ID'; exit 1; }
          test -n "$APP_STORE_CONNECT_ISSUER_ID" || { echo '::error::Missing App Store Connect issuer'; exit 1; }
          test -n "$APP_STORE_CONNECT_PRIVATE_KEY" || { echo '::error::Missing App Store Connect private key'; exit 1; }
          if [ "$ASIYE_TESTFLIGHT_UPLOAD_CONFIRMED" = 'yes' ]; then
            fastlane beta
          else
            fastlane candidate
          fi
      - name: Upload signed iOS files
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: asiye-11.0.78-348-ios
          path: |
            ios/release-output/*.ipa
            ios/release-output/release-info.json
          if-no-files-found: warn
          retention-days: 30
