name: Asiye 347 Pre-Release Source Gate

on:
  workflow_dispatch:
  push:
    branches: ['fix/paystack-subaccounts-cash-card-no-wallet']
    paths:
      - '.github/workflows/asiye_347_pre_release_source_gate.yml'
      - 'docs/ASIYE_347_STAGING_TO_RELEASE_ACCEPTANCE_20261022.md'
      - 'assets/passenger-v2/login.html'
      - 'assets/passenger-v2/js/login.js'
      - 'assets/passenger-v2/css/login.css'
      - 'assets/driver-v2/js/login.js'
      - 'test/staging-passenger-social-phone-link.test.cjs'
      - 'test/staging-auth-recaptcha.test.cjs'
      - 'functions/**'
      - 'database.rules.json'

permissions:
  contents: read

jobs:
  static-source:
    name: Read-only source checks (NOT production acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release lineage and endpoint manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/paystack-subaccounts-cash-card-no-wallet'
          test "$(awk '/^version:/ {print $2}' pubspec.yaml)" = '11.0.77+347'
          node - <<'JS'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const manifest=JSON.parse(fs.readFileSync('scripts/paystack_function_manifest.json','utf8'));
          assert.equal(manifest.length,37,'Staging manifest must have exactly 37 functions');
          assert.equal(new Set(manifest).size,37,'Function names must be unique');
          for(const n of ['prepareTripPayment','verifyTripCardPayment','configureDriverCardPayout','paystackWebhook','createParcelRequestSecure','goTripActionSecure','joinClubPoolSecure','createTripShareToken','getTripShare'])
            assert.ok(manifest.includes(n),'Missing secure function: '+n);
          const pub=fs.readFileSync('assets/passenger-v2/login.html','utf8');
          for(const id of ['googleLoginButton','appleLoginButton','passengerPhoneInput','verifyPhoneStep','switchPassengerSignInButton'])
            assert.ok(pub.includes('id="'+id+'"'),'Passenger login missing '+id);
          console.log('PASS: 347 lineage, 37 secure function names, and passenger login method chooser.');
          JS
      - name: Syntax-check secure backend and passenger/driver login
        run: |
          node --check assets/passenger-v2/js/login.js
          node --check assets/driver-v2/js/login.js
          node --check functions/index.js
          node --check functions/paystack-payment-safety.js
          node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8'))"
      - name: Run auth, booking, Parcel and Paystack failure regressions
        run: |
          node --test \
            test/staging-passenger-social-phone-link.test.cjs \
            test/staging-auth-recaptcha.test.cjs \
            test/go-fare-negotiation.test.cjs \
            test/go-continuation.test.cjs \
            test/club-lifecycle.test.cjs \
            test/parcel-security.test.cjs \
            test/paystack-payment-safety.test.cjs \
            test/paystack-subaccount-migration.test.cjs
      - name: Record human acceptance gates — NOT PASSED
        if: always()
        shell: bash
        run: |
          mkdir -p release-readiness
          cat > release-readiness/readme.txt <<'EOF'
          Asiye 347 source gate only.
          The CI outcome does not approve public stores, backend production rollout,
          live Paystack checkout or the installation of this build on customer devices.
          Human acceptance still required: staged DB rules/source revision, test provider
          subaccount and webhook/refund checkout, Go/Club/Parcel device E2E, Cash pickup
          timing, historical Wallet reconciliations, merchant written approval and
          final signed Android/iOS candidate regression tests.
          EOF
          {
            echo '### Asiye 347 — CI is not production release approval'
            echo ''
            echo '- Source regression tests run without booking or charging users.'
            echo '- **Staging rules/source SHA:** independent cloud readback still required.'
            echo '- **Paystack TEST:** real charge, webhook, cancellation and subaccount split still required.'
            echo '- **Device UAT:** Android and iOS passengers/drivers, native auth, OTP, PIN, location and notifications still required.'
            echo '- **Release artifacts:** previous signed 347 artifacts predate the 22 October passenger changes.'
            echo '- **LIVE payments/store release:** remain DISABLED / NOT AUTHORIZED.'
            echo '- Checklist: `docs/ASIYE_347_STAGING_TO_RELEASE_ACCEPTANCE_20261022.md`.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asiye-347-source-not-release-clearance
          path: release-readiness/readme.txt
          retention-days: 14
