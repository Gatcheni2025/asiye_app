name: Deploy Club 11.0.67 Backend Repair

on:
  push:
    branches: [fix/11.0.67-club-booking-arrival-pin-timer]
    paths:
      - '.github/workflows/deploy_club_337_repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asiye-secure-functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/fix/11.0.67-club-booking-arrival-pin-timer'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FIREBASE_CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASIYE_80386 || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source version and Firebase credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(awk '/^version:/ {print $2}' pubspec.yaml)" = '11.0.67+337'
          if [ -z "$FIREBASE_CREDS" ]; then
            echo '::error::Missing Firebase service-account repository secret.'
            exit 1
          fi
          echo "Backend source: $GITHUB_SHA"
      - name: Install Functions and security dependencies
        run: |
          npm --prefix functions install --no-audit --no-fund
          npm --prefix test/security install --no-audit --no-fund
      - name: Validate Club source and deployment checks
        run: |
          node --check functions/index.js
          node --check functions/club-lifecycle.js
          node --check assets/club-live.js
          node --test test/club-lifecycle.test.cjs test/club-work-readiness.test.cjs scripts/club-network-readiness.test.cjs
      - name: Validate database rules, private PINs, concurrent joins and both countdowns
        working-directory: test/security
        run: npx firebase emulators:exec --only database --project asiye-security-validation --config ../../firebase.json "npm test"
      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_CREDS }}
      - name: Deploy only matching Club dependencies and lifecycle
        shell: bash
        run: |
          set -euo pipefail
          # Creation is enabled last, after rules and dependent handlers are ready.
          # Sequential deploys avoid the project's regional CPU deployment quota.
          FUNCTIONS=(
            prepareTripPayment
            verifyTripCardPayment
            settleTripPayment
            paystackWebhook
            createTripShareToken
            notifyDriversOfClubAreaBooking
            refreshDriversWhileClubPooling
            notifyDriversWhenClubReady
            refreshClubPaymentReadinessAfterSafetyShare
            releaseCancelledClubPassengerPayment
            adminManagePlatform
            getClubPickupPin
            clubDriverActionSecure
            submitWorkEarlyDepartureOffer
            joinClubPoolSecure
            synchronizeClubBooking
            expireClubWaiting
          )
          for FN in "${FUNCTIONS[@]}"; do
            echo "Deploying $FN from $GITHUB_SHA"
            npx --yes firebase-tools@latest deploy --project asiye-80386 --only "functions:$FN" --non-interactive
          done
          npx --yes firebase-tools@latest deploy --project asiye-80386 --only database --non-interactive
          npx --yes firebase-tools@latest deploy --project asiye-80386 --only functions:createClubBookingSecure --non-interactive
      - name: Verify installed app and web Club endpoints
        run: node scripts/club-network-readiness.cjs
      - name: Record deployment result
        shell: bash
        run: |
          {
            echo '### Club 11.0.67 backend deployed'
            echo "Source: $GITHUB_SHA"
            echo 'Security emulator, shared countdown UI, CORS and unauthenticated rejection checks passed.'
            echo 'The existing 11.0.67 (337) APK can now be used for passenger/driver device acceptance.'
            echo 'Physical-device booking, notification delivery and full 30-minute timeout still require acceptance testing.'
          } >> "$GITHUB_STEP_SUMMARY"
