name: Deploy Paystack Review to Isolated Staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asiye-paystack-staging
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STAGING_PROJECT: ${{ vars.FIREBASE_STAGING_PROJECT }}
      STAGING_CREDS: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT }}
      PAYSTACK_TEST_SECRET_KEY: ${{ secrets.PAYSTACK_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require isolated project, staging credentials and TEST key
        run: |
          test "$GITHUB_REF_NAME" = 'fix/paystack-subaccounts-cash-card-no-wallet'
          node - <<'JS'
          const assert = require('node:assert/strict');
          const project = process.env.STAGING_PROJECT || '';
          assert.match(project, /^[a-z][a-z0-9-]{4,28}[a-z0-9]$/);
          assert.notEqual(project, 'asiye-80386', 'Production deployment is forbidden in this workflow');
          assert.equal(JSON.parse(process.env.STAGING_CREDS || '{}').project_id, project);
          assert.match(process.env.PAYSTACK_TEST_SECRET_KEY || '', /^sk_test_[A-Za-z0-9]+$/);
          console.log('Isolated staging and TEST-key guards passed.');
          JS
      - name: Install dependencies and verify release ancestry
        run: |
          npm --prefix functions install --no-audit --no-fund
          npm --prefix test/security install --no-audit --no-fund
          bash scripts/verify_payment_release_341_lineage.sh
          node --check functions/index.js
          node --check functions/paystack-payment-safety.js
          node --test test/paystack-payment-safety.test.cjs test/paystack-subaccount-migration.test.cjs test/parcel-security.test.cjs test/paystack-card-journey-simulation.test.cjs
      - name: Verify Firebase rules and exported payment handlers
        working-directory: test/security
        run: npx firebase emulators:exec --only database --project asiye-security-validation --config ../../firebase.json 'npm test'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.STAGING_CREDS }}
      - name: Configure only the staging TEST secret
        shell: bash
        run: |
          set -euo pipefail
          KEY_FILE=$(mktemp "$RUNNER_TEMP/paystack-staging.XXXXXX")
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$PAYSTACK_TEST_SECRET_KEY" > "$KEY_FILE"
          npx --yes firebase-tools@latest functions:secrets:set PAYSTACK_SECRET_KEY --project "$STAGING_PROJECT" --data-file "$KEY_FILE" --non-interactive
      - name: Deploy the matching secure endpoints and rules only to staging
        run: |
          set -euo pipefail
          SELECTOR=$(node -e "console.log(require('./scripts/paystack_function_manifest.json').map(n=>'functions:'+n).join(','))")
          npx --yes firebase-tools@latest deploy --project "$STAGING_PROJECT" --only "$SELECTOR,database" --non-interactive
          printf 'Reviewed source: %s\nIsolated project: %s\nLive payments remain gated. No production deployment was performed.\n' "$GITHUB_SHA" "$STAGING_PROJECT" >> "$GITHUB_STEP_SUMMARY"
      - name: Read back active staging functions and database rules
        env:
          STAGING_PROJECT: ${{ vars.FIREBASE_STAGING_PROJECT }}
          STAGING_CREDS: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT }}
        run: node scripts/verify_paystack_staging.cjs
      - name: Preserve staging verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asiye-paystack-staging-verification
          path: paystack-readiness/staging-verification.json
          if-no-files-found: warn
          retention-days: 14
