name: Deploy Paystack Review to Isolated Staging
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asiye-paystack-staging
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STAGING_PROJECT: ${{ vars.FIREBASE_STAGING_PROJECT }}
      STAGING_CREDS: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT }}
      PAYSTACK_TEST_SECRET_KEY: ${{ secrets.PAYSTACK_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Firebase testing SDKs in this workflow require Node 24.12+.
      # The Cloud Functions deployment runtime remains Node 22 (functions/package.json).
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Restore npm download cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-asiye-paystack-staging-npm-v1-${{ hashFiles('functions/package.json', 'test/security/package.json') }}
          restore-keys: |
            ${{ runner.os }}-asiye-paystack-staging-npm-v1-
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require isolated project, staging credentials and TEST key
        run: |
          test "$GITHUB_REF_NAME" = 'fix/paystack-subaccounts-cash-card-no-wallet'
          node - <<'JS'
          const assert = require('node:assert/strict');
          const project = process.env.STAGING_PROJECT || '';
          assert.match(project, /^[a-z][a-z0-9-]{4,28}[a-z0-9]$/);
          assert.notEqual(project, 'asiye-80386', 'Production deployment is forbidden in this workflow');
          assert.equal(JSON.parse(process.env.STAGING_CREDS || '{}').project_id, project);
          assert.match(process.env.PAYSTACK_TEST_SECRET_KEY || '', /^sk_test_[A-Za-z0-9]+$/);
          console.log('Isolated staging and TEST-key guards passed.');
          JS
      - name: Install dependencies with network-reset recovery and verify release ancestry
        shell: bash
        run: |
          set -euo pipefail
          install_with_retries() {
            local folder="$1" attempt
            for attempt in 1 2 3; do
              echo "Installing $folder (attempt $attempt/3)"
              if npm --prefix "$folder" install --no-audit --no-fund --prefer-offline \
                  --fetch-retries=4 --fetch-retry-mintimeout=10000 \
                  --fetch-retry-maxtimeout=120000; then
                return 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::npm install in $folder failed after 3 attempts."
                return 1
              fi
              sleep $((attempt * 10))
            done
          }
          install_with_retries functions
          install_with_retries test/security
          test -x test/security/node_modules/.bin/firebase
          bash scripts/verify_payment_release_341_lineage.sh
          node --check functions/index.js
          node --check functions/paystack-payment-safety.js
          node --check scripts/build_staging_web_preview.cjs
          node --check scripts/summarize_staging_deploy_error.cjs
          node --test test/staging-deploy-diagnostics.test.cjs
          node --test test/staging-web-boundary.test.cjs
          node --test test/paystack-payment-safety.test.cjs test/paystack-subaccount-migration.test.cjs test/parcel-security.test.cjs test/paystack-card-journey-simulation.test.cjs
      - name: Verify Firebase rules and exported payment handlers
        working-directory: test/security
        # Isolate emulator test files: concurrent Club transactions can contend
        # with the other suites and hit a transient RTDB transaction maxretry.
        # All tests still run; no security checks are suppressed.
        run: ./node_modules/.bin/firebase emulators:exec --only database --project asiye-security-validation --config ../../firebase.json 'node --test --test-timeout=45000 --test-concurrency=1 *.test.cjs'
      - name: Prepare strictly isolated staging web-only passenger and driver preview
        env:
          FIREBASE_STAGING_WEB_CONFIG: ${{ vars.FIREBASE_STAGING_WEB_CONFIG }}
          FIREBASE_STAGING_PROJECT: ${{ vars.FIREBASE_STAGING_PROJECT }}
        run: node scripts/build_staging_web_preview.cjs
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.STAGING_CREDS }}
      # The staging deploy identity can authenticate to Firebase while still
      # lacking permission to discover required Google Cloud APIs. Check that
      # state explicitly, without changing services, roles or production.
      - name: Install Google Cloud SDK for staging diagnostics
        uses: google-github-actions/setup-gcloud@v2
      - name: Check Cloud Functions staging APIs and metadata (read only)
        shell: bash
        run: |
          set -euo pipefail
          case "$STAGING_PROJECT" in
            asiye-paystack-staging) ;;
            *) echo "::error::Refusing preflight outside the known isolated Asiye staging project"; exit 1 ;;
          esac
          echo "Checking enabled Google Cloud services in $STAGING_PROJECT (read-only)"
          if ! gcloud services list --enabled --project "$STAGING_PROJECT" --format="value(config.name)" > "$RUNNER_TEMP/staging-enabled-apis.txt" 2> "$RUNNER_TEMP/staging-service-errors.txt"; then
            echo "::error::The staging deployer cannot list enabled APIs. Verify Service Usage Viewer on the staging project."
            rm -f "$RUNNER_TEMP/staging-service-errors.txt"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/staging-service-errors.txt"
          # Asiye uses Firebase v2 database triggers (Eventarc) and
          # expireClubWaiting onSchedule (Cloud Scheduler + Pub/Sub).
          # Fail before writing rules/secrets if their deployment services are absent.
          REQUIRED_APIS=(cloudfunctions.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com run.googleapis.com eventarc.googleapis.com cloudscheduler.googleapis.com pubsub.googleapis.com)
          MISSING=0
          for service in "${REQUIRED_APIS[@]}"; do
            if grep -Fxq "$service" "$RUNNER_TEMP/staging-enabled-apis.txt"; then
              echo "Enabled: $service"
            else
              echo "::error::Disabled or unavailable in staging: $service"
              MISSING=1
            fi
          done
          for service in runtimeconfig.googleapis.com iam.googleapis.com; do
            if grep -Fxq "$service" "$RUNNER_TEMP/staging-enabled-apis.txt"; then
              echo "Additional enabled API: $service"
            else
              echo "Additional API not enabled or unavailable: $service (may be needed for selected function types)"
            fi
          done
          rm -f "$RUNNER_TEMP/staging-enabled-apis.txt"
          if [ "$MISSING" -ne 0 ]; then
            echo "::error::Enable the listed APIs in the staging Google Cloud console before running deploy."
            exit 1
          fi
          echo "Required Cloud Functions APIs are enabled for isolated staging."
          if ! gcloud functions list --project "$STAGING_PROJECT" --format="value(name)" > "$RUNNER_TEMP/staging-functions-visible.txt" 2> "$RUNNER_TEMP/staging-functions-errors.txt"; then
            echo "::error::Cloud Functions listing failed. Confirm staging Cloud Functions Developer and project permissions; use Cloud Audit Logs for the exact reason."
            rm -f "$RUNNER_TEMP/staging-functions-errors.txt" "$RUNNER_TEMP/staging-functions-visible.txt"
            exit 1
          fi
          echo "Cloud Functions metadata is accessible by the staging deployer."
          rm -f "$RUNNER_TEMP/staging-functions-errors.txt" "$RUNNER_TEMP/staging-functions-visible.txt"
      - name: Read-only staging Realtime Database instance visibility
        shell: bash
        run: |
          set -euo pipefail
          # This is metadata-only; it must not write client/user data.
          echo "Checking deployment account's staging RTDB instance visibility..."
          ./test/security/node_modules/.bin/firebase database:instances:list --project "$STAGING_PROJECT"
      - name: Configure only the staging TEST secret
        shell: bash
        run: |
          set -euo pipefail
          KEY_FILE=$(mktemp "$RUNNER_TEMP/paystack-staging.XXXXXX")
          chmod 600 "$KEY_FILE"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$PAYSTACK_TEST_SECRET_KEY" > "$KEY_FILE"
          ./test/security/node_modules/.bin/firebase functions:secrets:set PAYSTACK_SECRET_KEY --project "$STAGING_PROJECT" --data-file "$KEY_FILE" --non-interactive
      - name: Deploy staging RTDB security rules (separate diagnostic boundary)
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/asiye-staging-db-debug.log"
          if ./test/security/node_modules/.bin/firebase deploy --project "$STAGING_PROJECT" --only database --non-interactive --debug > "$LOG_FILE" 2>&1; then
            rm -f "$LOG_FILE" firebase-debug.log
            echo "Staging RTDB rule deployment completed." >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/summarize_staging_deploy_error.cjs "$LOG_FILE" "Realtime Database rules"
            rm -f "$LOG_FILE" firebase-debug.log
            exit 1
          fi
      - name: Deploy reviewed secure Cloud Functions to isolated staging
        shell: bash
        run: |
          set -euo pipefail
          SELECTOR=$(node -e "console.log(require('./scripts/paystack_function_manifest.json').map(n=>'functions:'+n).join(','))")
          LOG_FILE="$RUNNER_TEMP/asiye-staging-functions-debug.log"
          if ./test/security/node_modules/.bin/firebase deploy --project "$STAGING_PROJECT" --only "$SELECTOR" --non-interactive --debug > "$LOG_FILE" 2>&1; then
            rm -f "$LOG_FILE" firebase-debug.log
            printf 'Reviewed source: %s\nIsolated project: %s\nLive payments remain gated. No production deployment was performed.\n' "$GITHUB_SHA" "$STAGING_PROJECT" >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/summarize_staging_deploy_error.cjs "$LOG_FILE" "Cloud Functions"
            rm -f "$LOG_FILE" firebase-debug.log
            exit 1
          fi
      - name: Deploy staging-only web preview with no-index headers
        run: |
          set -euo pipefail
          ./test/security/node_modules/.bin/firebase deploy --project "$STAGING_PROJECT" --config firebase.staging.generated.json --only hosting --non-interactive
          echo "Staging WEB-only preview: https://${STAGING_PROJECT}.web.app/passenger-v2/index.html" >> "$GITHUB_STEP_SUMMARY"
          echo "Staging WEB-only driver: https://${STAGING_PROJECT}.web.app/driver-v2/index.html" >> "$GITHUB_STEP_SUMMARY"
          echo "Native Android/iOS staging acceptance is NOT included." >> "$GITHUB_STEP_SUMMARY"
      - name: Read back active staging functions and database rules
        env:
          STAGING_PROJECT: ${{ vars.FIREBASE_STAGING_PROJECT }}
          STAGING_CREDS: ${{ secrets.FIREBASE_STAGING_SERVICE_ACCOUNT }}
        run: node scripts/verify_paystack_staging.cjs
      - name: Preserve staging verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asiye-paystack-staging-verification
          path: paystack-readiness/staging-verification.json
          if-no-files-found: warn
          retention-days: 14
