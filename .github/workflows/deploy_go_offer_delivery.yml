name: Deploy and Verify Go Offer Delivery

on:
  workflow_dispatch:
  push:
    branches: ['fix/paystack-subaccounts-cash-card-no-wallet']
    paths: ['.github/workflows/deploy_go_offer_delivery.yml']

permissions:
  contents: read

concurrency:
  group: asiye-go-offer-delivery-repair
  cancel-in-progress: false

jobs:
  validate:
    name: Go booking and security gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Check syntax and Go regressions
        run: |
          node --check functions/index.js
          node --check functions/production-go-offer-delivery-validation.js
          node --test test/go-fare-negotiation.test.cjs test/go-fare-settlement-lifecycle.test.cjs test/request-search-awareness.test.cjs test/go-continuation.test.cjs
      - name: Install emulator and function dependencies
        run: |
          npm --prefix functions install --no-audit --no-fund
          npm --prefix test/security install --no-audit --no-fund
      - name: Verify Firebase authorization, real handlers and fare UI
        working-directory: test/security
        run: npx firebase emulators:exec --only database --project asiye-security-validation --config ../../firebase.json 'npm test'

  deploy:
    name: Update Go decisions and verify isolated delivery
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIREBASE_CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASIYE_80386 || secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify target and source
        run: |
          test "$GITHUB_REF_NAME" = 'fix/paystack-subaccounts-cash-card-no-wallet'
          node -e 'const c=JSON.parse(process.env.FIREBASE_CREDS || "{}"); if(c.project_id!=="asiye-80386")throw Error("Expected Asiye production deployment credential");'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_CREDS }}
      - name: Install deployment dependencies
        run: |
          npm --prefix functions install --no-audit --no-fund
          npm install --global firebase-tools
      - name: Deploy only Go offer submission, routing and driver decisions
        shell: bash
        run: |
          set -euo pipefail
          for FN in submitGoFareOffer dispatchGoRideRequest counterGoFare acceptGoFareOffer acceptGoFareCounter declineGoFareOffer declineGoFareCounter; do
            firebase deploy --project asiye-80386 --only "functions:$FN" --non-interactive
          done
      - name: Verify real Go offers with isolated temporary accounts
        env:
          ASIYE_GO_VALIDATION_CONFIRMED: 'yes'
        run: node functions/production-go-offer-delivery-validation.js
