name: TAVORA iOS TestFlight (existing Asiye signing)

on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload signed IPA to TestFlight after successful signing/build'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tavora-ios-match-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign existing certificate, build IPA, optional TestFlight upload
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      GH_PAT: ${{ secrets.GH_PAT }}
      PROFILE_BASE64: ${{ secrets.TAVORA_APPSTORE_PROFILE_BASE64 }}
      FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

    steps:
      - name: Check out TAVORA
        uses: actions/checkout@v4

      - name: Validate configuration (never print secrets)
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID IOS_BUNDLE_ID MATCH_PASSWORD GH_PAT PROFILE_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository variable/secret: ${name}"
              exit 1
            fi
          done
          if [ "$APPLE_TEAM_ID" != 'AC775BUGG5' ] || [ "$IOS_BUNDLE_ID" != 'cloud.tavora.tavoraMobile' ]; then
            echo '::error::Apple team or bundle ID does not match confirmed TAVORA identifiers.'
            exit 1
          fi
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner/Info.plist
          test -f pubspec.yaml

      - name: Verify Xcode and Flutter tools
        shell: bash
        run: |
          xcodebuild -version
          pod --version

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Restore optional Firebase configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$FIREBASE_PLIST_BASE64" ]; then
            python3 - <<'PY'
          import base64, os, pathlib
          dest = pathlib.Path('ios/Runner/GoogleService-Info.plist')
          dest.write_bytes(base64.b64decode(os.environ['FIREBASE_PLIST_BASE64'], validate=True))
          PY
            plutil -lint ios/Runner/GoogleService-Info.plist
          elif [ ! -f ios/Runner/GoogleService-Info.plist ]; then
            echo '::warning::GoogleService-Info.plist absent. If TAVORA uses native Firebase, add FIREBASE_IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 before publishing.'
          fi

      - name: Flutter dependencies and tests
        shell: bash
        run: |
          flutter pub get
          flutter test --no-pub

      - name: Import Asiye Match distribution signing identity (read-only)
        shell: bash
        run: |
          set -euo pipefail
          # A temporary Fastfile avoids touching Asiye's workflow or TAVORA source.
          mkdir -p "$RUNNER_TEMP/tavora-match/fastlane"
          cat > "$RUNNER_TEMP/tavora-match/fastlane/Fastfile" <<'RUBY'
          default_platform(:ios)
          platform :ios do
            lane :import_existing_signing do
              setup_ci(timeout: 0, keychain_name: 'tavora_ci_keychain')
              match(
                type: 'appstore',
                storage_mode: 'git',
                git_url: 'https://github.com/Gatcheni2025/asiye-certs',
                app_identifier: 'com.asiyeapp.asiye',
                team_id: ENV.fetch('APPLE_TEAM_ID'),
                readonly: true
              )
            end
          end
          RUBY
          # GH_PAT must have Contents:Read access to Gatcheni2025/asiye-certs.
          BASIC_AUTH="$(printf 'x-access-token:%s' "$GH_PAT" | base64 | tr -d '\n')"
          echo "::add-mask::$BASIC_AUTH"
          export MATCH_GIT_BASIC_AUTHORIZATION="$BASIC_AUTH"
          cd "$RUNNER_TEMP/tavora-match"
          fastlane ios import_existing_signing

      - name: Validate and install TAVORA provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, datetime, hashlib, os, pathlib, plistlib, re, subprocess, sys, tempfile
          team = os.environ['APPLE_TEAM_ID']
          bundle = os.environ['IOS_BUNDLE_ID']
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'TAVORA.mobileprovision'
          path.write_bytes(base64.b64decode(os.environ['PROFILE_BASE64'], validate=True))
          decoded = subprocess.check_output(['security','cms','-D','-i',str(path)])
          profile = plistlib.loads(decoded)
          name = profile.get('Name','')
          uuid = profile.get('UUID','')
          team_ids = profile.get('TeamIdentifier',[])
          ent = profile.get('Entitlements',{})
          app_id = ent.get('application-identifier','')
          expiration = profile.get('ExpirationDate')
          if team not in team_ids or app_id != f'{team}.{bundle}':
              sys.exit('::error::Provisioning profile does not match the TAVORA bundle identifier and team.')
          if not uuid or not name:
              sys.exit('::error::Provisioning profile lacks UUID or Name.')
          if expiration and expiration.replace(tzinfo=datetime.timezone.utc) <= datetime.datetime.now(datetime.timezone.utc):
              sys.exit('::error::Provisioning profile has expired.')
          if ent.get('get-task-allow',True):
              sys.exit('::error::This appears to be a development profile, not an App Store profile.')
          identities = subprocess.check_output(['security','find-identity','-v','-p','codesigning'], text=True)
          installed = {x.upper() for x in re.findall(r'\b[0-9A-Fa-f]{40}\b', identities)}
          in_profile = set()
          for cert in profile.get('DeveloperCertificates',[]):
              with tempfile.NamedTemporaryFile(suffix='.cer') as tmp:
                  tmp.write(bytes(cert)); tmp.flush()
                  v = subprocess.check_output(['openssl','x509','-inform','DER','-in',tmp.name,'-noout','-fingerprint','-sha1'],text=True)
                  in_profile.add(v.split('=',1)[-1].strip().replace(':','').upper())
          if not installed.intersection(in_profile):
              sys.exit('::error::TAVORA profile certificate DOES NOT MATCH the imported Asiye Match signing identity. Regenerate TAVORA profile choosing the same certificate as Match; do not revoke other certificates.')
          folder = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles'
          folder.mkdir(parents=True,exist_ok=True)
          (folder / f'{uuid}.mobileprovision').write_bytes(path.read_bytes())
          pathlib.Path(os.environ['RUNNER_TEMP'],'tavora_profile_name').write_text(name)
          pathlib.Path(os.environ['RUNNER_TEMP'],'tavora_profile_uuid').write_text(uuid)
          print(f'TAVORA App Store profile verified: {name} (expires {expiration.date() if expiration else "unknown"})')
          PY

      - name: Configure Xcode signing and export options (runner only)
        shell: bash
        run: |
          set -euo pipefail
          export TAVORA_PROFILE_NAME="$(cat "$RUNNER_TEMP/tavora_profile_name")"
          export TAVORA_PROFILE_UUID="$(cat "$RUNNER_TEMP/tavora_profile_uuid")"
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          target = project.targets.find { |t| t.name == 'Runner' }
          abort 'Runner app target not found' unless target
          target.build_configurations.each do |config|
            next unless ['Release','Profile'].include?(config.name)
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('IOS_BUNDLE_ID')
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('TAVORA_PROFILE_NAME')
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
          end
          project.save
          RUBY
          python3 - <<'PY'
          import os, plistlib, pathlib
          export_options = {
            'method':'app-store-connect',
            'destination':'export',
            'signingStyle':'manual',
            'signingCertificate':'Apple Distribution',
            'teamID':os.environ['APPLE_TEAM_ID'],
            'provisioningProfiles':{os.environ['IOS_BUNDLE_ID']:os.environ['TAVORA_PROFILE_UUID']},
          }
          with open('tavora-ExportOptions.plist','wb') as f:
            plistlib.dump(export_options,f)
          PY
          plutil -lint tavora-ExportOptions.plist

      - name: Build signed TAVORA 1.0 IPA
        shell: bash
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "TAVORA version 1.0, build $BUILD_NUMBER"
          flutter build ipa --release --no-pub --build-name=1.0 --build-number="$BUILD_NUMBER" --export-options-plist=tavora-ExportOptions.plist

      - name: Locate and verify signed IPA
        id: signed_ipa
        shell: bash
        run: |
          set -euo pipefail
          IPA="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -type f | head -n 1)"
          if [ -z "$IPA" ]; then echo '::error::IPA was not generated'; exit 1; fi
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          unzip -t "$IPA" | tail -n 1
          echo "Signed IPA: $(basename "$IPA")"

      - name: Upload signed IPA as a GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAVORA-iOS-1.0-signed-IPA
          path: ${{ steps.signed_ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Check upload credentials
        if: ${{ inputs.upload_to_testflight }}
        shell: bash
        env:
          ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          for name in ISSUER_ID API_KEY_ID API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then echo "::error::Missing $name"; exit 1; fi
          done

      - name: Upload signed IPA to TestFlight
        if: ${{ inputs.upload_to_testflight }}
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.signed_ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: 'false'
