name: Final App Readiness Gate

on:
  push:
    branches:
      - security-payments-phase5
    paths:
      - '.github/workflows/final_app_readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    name: Validate release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASIYE_80386 || secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout Phase 5 release candidate
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Install Firebase security test dependencies
        working-directory: test/security
        run: npm install --no-audit --no-fund

      - name: Static readiness checks
        shell: bash
        run: |
          set -euo pipefail
          node --check functions/index.js
          node --check functions/paystack-wallet.js
          node --check functions/paystack-test-validation.js
          node --check functions/production-trip-validation.js
          node --check assets/member-pages.js
          node --check assets/passenger-v2/js/booking.js
          node --check assets/passenger-v2/js/club.js
          node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8')); console.log('database.rules.json OK')"

          grep -q 'android:scheme="asiye"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="payment-complete"' android/app/src/main/AndroidManifest.xml
          grep -q 'com.asiyeapp.asiye/deeplink' android/app/src/main/kotlin/com/asiyeapp/asiye/MainActivity.kt
          grep -q 'onAsiyePaymentReturn' lib/main.dart
          grep -q 'onAsiyePaymentReturn' assets/member-pages.js
          grep -q 'paystackPaymentReturn' functions/index.js
          grep -q 'asiye://payment-complete' functions/index.js

          echo "PASS static Paystack return/deep-link wiring."

      - name: Run authentication regression tests
        run: node --test test/login-otp.test.cjs test/native-auth-session.test.cjs

      - name: Run Paystack wallet integrity unit tests
        run: node --test test/security/paystack-wallet.test.cjs

      - name: Run Firebase security emulator suite
        working-directory: test/security
        run: npx firebase emulators:exec --only database --project asiye-security-validation --config ../../firebase.json "npm test"

      - name: Verify Firebase deployment secret
        shell: bash
        run: |
          if [ -z "$FIREBASE_CREDS" ]; then
            echo "::error::Firebase service-account secret is unavailable."
            exit 1
          fi

      - name: Authenticate to Firebase production
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_CREDS }}

      - name: Verify live Paystack return endpoint reopens Asiye
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL             "https://us-central1-asiye-80386.cloudfunctions.net/paystackPaymentReturn?reference=ASIYE-READINESS-1234"             -o /tmp/paystack-return.html
          grep -q 'asiye://payment-complete?reference=' /tmp/paystack-return.html
          grep -q 'Return to Asiye' /tmp/paystack-return.html
          echo "PASS production Paystack return endpoint."

      - name: Run Paystack Test Mode backend smoke
        working-directory: functions
        run: node paystack-test-validation.js

      - name: Re-run controlled production Go and Club trip validation
        working-directory: functions
        run: node production-trip-validation.js

      - name: Readiness summary
        run: |
          echo "FINAL APP READINESS GATE: PASS"
          echo "Authentication, payment integrity, deep-link return, Firebase security, Go and Club/Work production flows all passed."
