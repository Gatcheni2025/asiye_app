name: Prepare Teyza Apple signing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teyza-apple-signing-transfer
  cancel-in-progress: false

jobs:
  signing:
    if: github.repository == 'Gatcheni2025/asiye_app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install certificate parser
        run: python -m pip install 'cryptography==46.0.3'
      - name: Validate helper with disposable signing fixtures
        run: python -m unittest discover -s tools -p test_teyza_signing_transfer.py -v
      - name: Match existing certificate to Teyza profile and save signing secrets
        env:
          GH_TOKEN: ${{ secrets.TEYZA_SIGNING_TRANSFER_TOKEN || secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          TEYZA_PROFILE_BASE64: ${{ secrets.TEYZA_PROFILE_FOR_SIGNING }}
        run: python tools/teyza_signing_transfer.py
