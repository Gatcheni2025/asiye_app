name: Deploy Ride Readiness Backend

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy_profile_upload_proxy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Deploy latest device-readiness fixes, including secure Go ride dispatch.

jobs:
  deploy:
    name: Deploy profile upload and wallet readiness functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_CREDS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASIYE_80386 || secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout latest Phase 5 branch
        uses: actions/checkout@v4
        with:
          ref: security-payments-phase5

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Firebase deployment secret
        shell: bash
        run: |
          if [ -z "$FIREBASE_CREDS" ]; then
            echo "::error::Firebase service-account secret is unavailable."
            exit 1
          fi

      - name: Authenticate to Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_CREDS }}

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Validate function syntax
        run: node --check functions/index.js

      - name: Deploy readiness functions only
        run: >
          npx --yes firebase-tools@latest deploy
          --project asiye-80386
          --only "functions:uploadProfileImageProxy,functions:confirmTripWalletReady,functions:dispatchGoRideRequest"
          --non-interactive
