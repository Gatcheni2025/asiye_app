name: iOS TestFlight Release

on:
  push:
    branches:
      - fix/native-authentication
  workflow_dispatch:

jobs:
  build-and-release-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      - name: Validate iOS release secrets
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          missing=0

          for name in MATCH_PASSWORD GH_PAT APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub secret $name is not configured."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Verify certificate repository access
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          STATUS="$(curl -sS -o /tmp/asiye-certs-repo.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Gatcheni2025/asiye-certs)"

          if [ "$STATUS" != "200" ]; then
            echo "::error::GH_PAT repository check failed with GitHub HTTP $STATUS."
            echo "::error::401 = invalid/old token. 403/404 = token lacks access to Gatcheni2025/asiye-certs."
            exit 1
          fi

          AUTH="$(printf 'Gatcheni2025:%s' "$GH_PAT" | base64 | tr -d '\n')"

          if ! git -c http.extraheader="AUTHORIZATION: Basic $AUTH" \
            ls-remote https://github.com/Gatcheni2025/asiye-certs.git HEAD \
            >/dev/null 2>&1; then
            echo "::error::GitHub API access succeeded, but Git clone authentication still failed."
            exit 1
          fi

          echo "Certificate repository access confirmed."

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Fastlane and CocoaPods
        run: gem install fastlane cocoapods --no-document

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify release version
        run: |
          grep '^version: 11.0.21+291$' pubspec.yaml

      - name: Build, verify and upload to TestFlight
        working-directory: ./ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GH_PAT: ${{ secrets.GH_PAT }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          export MATCH_GIT_BASIC_AUTHORIZATION="$(printf 'x-access-token:%s' "$GH_PAT" | base64 | tr -d '\n')"
          fastlane beta

      - name: Upload signed IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asiye-11.0.21-ios
          path: |
            ios/build/ipa/*.ipa
            ios/*.ipa
          if-no-files-found: warn
          retention-days: 30
