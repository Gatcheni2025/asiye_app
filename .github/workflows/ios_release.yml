name: iOS TestFlight Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout App Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # FIX 1: We tell it to look inside the nested folder for pubspec.yaml
      - name: Install Flutter Dependencies
        working-directory: ./asiye_app
        run: flutter pub get

      - name: Configure Git for Private Match Repo
        run: |
          git config --global url."https://${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      # FIX 2: We tell it to look inside the nested iOS folder for Fastlane
      - name: Install Fastlane Dependencies
        working-directory: ./asiye_app/ios
        run: bundle install

      # FIX 3: We tell it to run the fastlane command from the nested iOS folder
      - name: Build and Upload to TestFlight
        working-directory: ./asiye_app/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bundle exec fastlane beta
