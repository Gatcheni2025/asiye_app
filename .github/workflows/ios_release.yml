name: iOS TestFlight Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release-ios:
    runs-on: macos-latest
    
    steps:
      - name: Checkout App Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # FIX 1: We DO need a working directory because the code is inside the asiye_app folder!
      - name: Install Flutter Dependencies
        working-directory: ./asiye_app
        run: flutter pub get

      - name: Set Fastlane Auth
        env:
          TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::GH_PAT is missing! Private certificates repo clone will fail."
            exit 1
          fi
          # Encode "git:TOKEN" to Base64 for Fastlane match
          AUTH=$(echo -n "git:${TOKEN}" | base64)
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$AUTH" >> $GITHUB_ENV
          
          # Also configure git to use the token for any git commands
          git config --global url."https://${TOKEN}@github.com/".insteadOf "https://github.com/"

      # FIX 2: Fastlane must run inside the ios folder which is inside asiye_app
      - name: Build and Upload to TestFlight 
        working-directory: ./asiye_app/ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          # MATCH_GIT_BASIC_AUTHORIZATION is now loaded from GITHUB_ENV
        run: fastlane beta
