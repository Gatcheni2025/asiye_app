name: One-Time TAVORA Match Secret Transfer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    if: github.repository == 'Gatcheni2025/asiye_app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Transfer MATCH_PASSWORD to TAVORA without exposing it
        env:
          GH_TOKEN: ${{ secrets.TAVORA_SECRETS_WRITE_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${GH_TOKEN:-}" || -z "${MATCH_PASSWORD:-}" ]]; then
            echo '::error::Missing TAVORA_SECRETS_WRITE_PAT or MATCH_PASSWORD in Asiye repository secrets.'
            exit 1
          fi
          printf '%s' "$MATCH_PASSWORD" | gh secret set MATCH_PASSWORD --repo Gatcheni2025/tavora_mobile
          gh api --silent repos/Gatcheni2025/tavora_mobile/actions/secrets/MATCH_PASSWORD
          echo 'TAVORA MATCH_PASSWORD saved and verified by metadata; its value was not printed.'
