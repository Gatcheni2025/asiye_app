name: Asiye 327 Admin and Support Checks

on:
  pull_request:
    branches: [security-payments-phase5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-and-support:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: |
          node --check assets/driver-v2/js/enrollment-banks.js
          node --check assets/driver-v2/js/enrollment-address.js
          node --check assets/passenger-v2/js/profile.js
          node --check assets/passenger-v2/js/wallet.js
          node --check assets/passenger-v2/js/app.js
          node --check assets/driver-v2/js/enrollment.js
          node --check assets/driver-v2/js/enrollment-gate.js
          node --check assets/driver-v2/js/login.js
          node --check assets/member-pages.js
          node --check assets/support-chat.js
          node --check assets/admin-release.js
          node --check assets/passenger-v2/js/onboarding.js
          node --check assets/passenger-v2/js/login.js
          node --check functions/driver-card-payout.js
          node --check functions/index.js
          node --check functions/admin-operations.js
          node --check assets/admin/console.js
          node --check functions/enrollment-submission.js
          node --check test/release327-admin-support.test.cjs
      - name: Run release and existing member page tests
        run: |
          node --test test/release327-admin-support.test.cjs test/member-pages.test.cjs test/driver-enrollment-v2.test.cjs test/login-otp.test.cjs test/card-payout-passenger.test.cjs test/release328-recovery.test.cjs test/enrollment-validation.test.cjs test/registration-submission.test.cjs test/admin-portal.test.cjs
      - name: Validate database rules JSON
        run: node -e "JSON.parse(require('fs').readFileSync('database.rules.json','utf8'))"
