name: Promote reviewed production release (checkout off)
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: ['check', 'apply', 'hosting-only']
        default: 'check'
        required: true
  push:
    branches: ['release/production-card-backend-20261024']
    paths: ['scripts/production_release_run_20261024.json']
permissions:
  contents: read
concurrency:
  group: asiye-controlled-production-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.intent.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - id: intent
        name: Validate the recorded production operation and frozen runtime
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const record=require('./scripts/production_release_authorization.json');
          const run=require('./scripts/production_release_run_20261024.json');
          const guard=require('./scripts/deploy_production_release.cjs');
          guard.checkAuthorization(record,guard.reviewedDigest());
          assert.equal(run.project,'asiye-80386');
          assert.equal(run.checkoutActivation,false);
          assert.equal(typeof run.applyBackend,'boolean');
          assert.ok(!run.applyHosting || run.applyBackend===false);
          assert.equal(run.runtimeSha256,record.runtimeSha256);
          const mode=process.env.GITHUB_EVENT_NAME==='workflow_dispatch'?process.env.REQUESTED_MODE:run.applyHosting?'hosting-only':run.applyBackend?'apply':'check';
          assert.ok(['check','apply','hosting-only'].includes(mode));
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'mode='+mode+'\n');
          console.log('Reviewed production payload verified; checkout activation is excluded.');
          JS
      - run: bash scripts/verify_payment_release_341_lineage.sh
      - name: Validate deployment scope, privacy, stop conditions and immutable source audit
        run: |
          node --check scripts/deploy_production_release.cjs
          node --test test/production-release-promotion.test.cjs test/production-card-preflight.test.cjs test/paystack-payment-safety.test.cjs test/paystack-subaccount-migration.test.cjs test/paystack-return.test.cjs test/trip-ratings.test.cjs test/trip-end-safety.test.cjs
          python3 -m unittest discover -s test -p 'test_production_source_readback.py'
          python3 -m unittest discover -s test -p 'test_mobile_bundle_assets.py'
      - name: Install backend and exported-handler emulator dependencies
        run: |
          npm --prefix functions install --no-audit --no-fund
          npm --prefix test/security install --no-audit --no-fund
      - name: Run all exported handler, rules and browser regression tests
        working-directory: test/security
        run: npx firebase emulators:exec --only database --project asiye-security-validation --config ../../firebase.json 'node --test --test-timeout=45000 --test-concurrency=1 *.test.cjs'
  promote:
    name: Controlled production promotion with private rollback backup
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ASIYE_80386 || secrets.FIREBASE_SERVICE_ACCOUNT }}'
          project_id: asiye-80386
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: asiye-80386
      - run: npm --prefix .asiye-release-cli install --no-audit --no-fund --no-save firebase-tools@15.34.0
      - name: Promote only the accepted runtime and keep checkout off
        env:
          RELEASE_MODE: ${{ needs.validate.outputs.mode }}
        run: node scripts/deploy_production_release.cjs --"$RELEASE_MODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asiye-production-release-readback
          path: production-release-readback/
          if-no-files-found: ignore
          retention-days: 14
