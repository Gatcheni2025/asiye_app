name: Firebase Security Validation

on:
  pull_request:
    paths:
      - 'database.rules.json'
      - 'firebase.json'
      - 'test/security/**'
      - 'functions/index.js'
      - 'functions/club-pool-security.js'
      - 'assets/passenger-v2/js/club.js'
      - '.github/workflows/firebase_security_validation.yml'
  push:
    branches:
      - security-validation-phase3
    paths:
      - 'database.rules.json'
      - 'firebase.json'
      - 'test/security/**'
      - 'functions/index.js'
      - 'functions/club-pool-security.js'
      - 'assets/passenger-v2/js/club.js'
      - '.github/workflows/firebase_security_validation.yml'
  workflow_dispatch:

jobs:
  realtime-database-rules:
    name: Realtime Database security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install security test dependencies
        working-directory: test/security
        run: npm install --no-audit --no-fund

      - name: Validate changed JavaScript syntax
        run: |
          node --check functions/index.js
          node --check functions/club-pool-security.js
          node --check assets/passenger-v2/js/club.js

      - name: Run Firebase Realtime Database security tests
        working-directory: test/security
        run: npx firebase emulators:exec --only database --project asiye-security-validation --config ../../firebase.json "npm test"
