name: Firebase Security Validation

on:
  pull_request:
    paths:
      - 'database.rules.json'
      - 'firebase.json'
      - 'test/security/**'
      - 'functions/index.js'
      - 'functions/club-lifecycle.js'
      - 'functions/parcel-security.js'
      - 'functions/paystack-subaccount-split.js'
      - 'functions/paystack-payment-safety.js'
      - 'test/paystack-payment-safety.test.cjs'
      - 'test/parcel-security.test.cjs'
      - 'test/paystack-card-journey-simulation.test.cjs'
      - 'test/paystack-subaccount-migration.test.cjs'
      - 'functions/go-continuation.js'
      - 'assets/club-live.js'
      - 'test/club-lifecycle.test.cjs'
      - 'functions/club-pool-security.js'
      - 'functions/trip-share-security.js'
      - 'functions/paystack-wallet.js'
      - 'functions/paystack-test-validation.js'
      - 'functions/ride-payment-validation.js'
      - 'assets/member-pages.js'
      - 'android/app/src/main/kotlin/com/asiyeapp/asiye/MainActivity.kt'
      - 'lib/main.dart'
      - 'assets/driver-v2/js/trip-controller.js'
      - 'assets/driver-v2/js/requests.js'
      - 'assets/passenger-v2/js/parcels.js'
      - 'assets/passenger-v2/js/wallet.js'
      - 'assets/passenger-v2/js/booking.js'
      - 'assets/passenger-v2/js/club.js'
      - 'assets/track.html'
      - '.github/workflows/firebase_security_validation.yml'
  push:
    branches:
      - fix/11.0.67-club-booking-arrival-pin-timer
      - security-validation-phase3
      - security-compatibility-phase4
      - security-payments-phase5
    paths:
      - 'database.rules.json'
      - 'firebase.json'
      - 'test/security/**'
      - 'functions/index.js'
      - 'functions/club-lifecycle.js'
      - 'functions/parcel-security.js'
      - 'functions/paystack-subaccount-split.js'
      - 'functions/paystack-payment-safety.js'
      - 'test/paystack-payment-safety.test.cjs'
      - 'test/parcel-security.test.cjs'
      - 'test/paystack-card-journey-simulation.test.cjs'
      - 'test/paystack-subaccount-migration.test.cjs'
      - 'functions/go-continuation.js'
      - 'assets/club-live.js'
      - 'test/club-lifecycle.test.cjs'
      - 'functions/club-pool-security.js'
      - 'functions/trip-share-security.js'
      - 'functions/paystack-wallet.js'
      - 'functions/paystack-test-validation.js'
      - 'functions/ride-payment-validation.js'
      - 'assets/member-pages.js'
      - 'assets/driver-v2/js/requests.js'
      - 'assets/passenger-v2/js/parcels.js'
      - 'assets/passenger-v2/js/booking.js'
      - 'assets/passenger-v2/js/club.js'
      - 'assets/track.html'
      - '.github/workflows/firebase_security_validation.yml'
  workflow_dispatch:

jobs:
  realtime-database-rules:
    name: Realtime Database security rules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install security test dependencies
        working-directory: test/security
        run: |
          npm install --no-audit --no-fund
          npm --prefix ../../functions install --no-audit --no-fund

      - name: Validate changed JavaScript syntax
        run: |
          node --check functions/index.js
          node --check functions/club-lifecycle.js
          node --check functions/parcel-security.js
          node --check assets/passenger-v2/js/parcels.js
          node --check assets/passenger-v2/js/ride-controller.js
          node --check assets/club-live.js
          node --check functions/club-pool-security.js
          node --check functions/trip-share-security.js
          node --check functions/paystack-wallet.js
          node --check functions/paystack-test-validation.js
          node --check functions/ride-payment-validation.js
          node --check assets/member-pages.js
          node --check assets/passenger-v2/js/wallet.js
          node --check assets/passenger-v2/js/booking.js
          node --check assets/driver-v2/js/trip-controller.js
          node --check assets/passenger-v2/js/club.js

      - name: Run Firebase Realtime Database security tests
        working-directory: test/security
        # Keep all security assertions but run suites serially: concurrent RTDB transactions
        # from different files can exhaust emulator maxretry and time out unrelated suites.
        run: npx firebase emulators:exec --only database --project asiye-security-validation --config ../../firebase.json "node --test --test-timeout=45000 --test-concurrency=1 *.test.cjs"
