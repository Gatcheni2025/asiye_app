name: Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "pubspec.yaml"
      - "test/**"
      - ".github/workflows/android_release.yml"
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "assets/**"
      - "android/**"
      - "pubspec.yaml"
      - "test/**"
      - ".github/workflows/android_release.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Restore Android signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/asiye-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=asiye-release.jks
          EOF

      - name: Get packages
        run: flutter pub get

      - name: Read app version
        shell: bash
        run: |
          APP_VERSION=$(awk '/^version:/ {print $2}' pubspec.yaml)
          ARTIFACT_VERSION="${APP_VERSION/+/-}"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "ARTIFACT_VERSION=$ARTIFACT_VERSION" >> "$GITHUB_ENV"
          echo "Building Asiye $APP_VERSION"

      - name: Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find assets -type f -name "*.js" -print0 | xargs -0 -n1 node --check
          node --check functions/index.js

      - name: Test authentication
        run: |
          node --test test/login-otp.test.cjs test/native-auth-session.test.cjs

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Verify APK signature
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          echo "Release signing certificate fingerprints:"
          CERTS=$(keytool -list -v -keystore android/app/asiye-release.jks -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD")
          echo "$CERTS" | grep -E "SHA1:|SHA256:"
          ACTUAL_SHA1=$(echo "$CERTS" | sed -n 's/.*SHA1: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          ACTUAL_SHA256=$(echo "$CERTS" | sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "RELEASE_SHA1=$ACTUAL_SHA1" >> "$GITHUB_ENV"
          echo "RELEASE_SHA256=$ACTUAL_SHA256" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, os, sys
          data=json.load(open("android/app/google-services.json", encoding="utf-8"))
          hashes=set()
          for client in data.get("client", []):
              for oauth in client.get("oauth_client", []):
                  info=oauth.get("android_info") or {}
                  if info.get("package_name")=="com.asiyeapp.asiye" and info.get("certificate_hash"):
                      hashes.add(info["certificate_hash"].lower())
          sha1=os.environ.get("RELEASE_SHA1","").lower()
          print("Firebase google-services SHA-1 fingerprints:", ", ".join(sorted(hashes)) or "NONE")
          if sha1 and sha1 not in hashes:
              print("::error::Release SHA-1 is not registered in android/app/google-services.json. Firebase Phone Auth reCAPTCHA will fail.")
              sys.exit(1)
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asiye-${{ env.ARTIFACT_VERSION }}-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: asiye-${{ env.ARTIFACT_VERSION }}-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
