name: Validate Live Face Scan

on:
  pull_request:
    branches:
      - fix/native-authentication

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: face-scan-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 1

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Configure CI-only Android keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/asiye-ci-validation.jks \
            -storepass validation123 \
            -keypass validation123 \
            -alias validation \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Asiye CI Validation, OU=CI, O=Asiye, L=Durban, ST=KZN, C=ZA"

          printf 'storeFile=asiye-ci-validation.jks\nstorePassword=validation123\nkeyAlias=validation\nkeyPassword=validation123\n' \
            > android/key.properties

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Build web
        run: flutter build web
