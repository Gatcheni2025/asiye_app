name: Production Compatibility Smoke

on:
  push:
    branches:
      - security-compatibility-phase4
    paths:
      - '.github/workflows/production_compatibility_smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Verify deployed compatibility layer
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify Firebase Hosting tracking page
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://asiye-80386.web.app/track.html -o /tmp/track.html
          grep -q 'getTripShare' /tmp/track.html
          if grep -q 'firebase-database.js' /tmp/track.html; then
            echo "::error::Production track.html still loads Firebase Database directly."
            exit 1
          fi

      - name: Verify deployed passenger share code
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 2 https://asiye-80386.web.app/passenger-v2/js/booking.js -o /tmp/booking.js
          curl -fsSL --retry 3 --retry-delay 2 https://asiye-80386.web.app/passenger-v2/js/club.js -o /tmp/club.js
          grep -q 'createTripShareToken' /tmp/booking.js
          grep -q 'asiye-80386.web.app/track.html' /tmp/booking.js
          grep -q 'joinClubPoolSecure' /tmp/club.js
          grep -q 'createLiveShareUrl' /tmp/club.js

      - name: Check optional app custom domain
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/app-track.html -w '%{http_code}' https://app.asiye.cloud/track.html || true)
          if [ "$code" = "200" ]; then
            echo "app.asiye.cloud is serving a tracking page."
          else
            echo "::notice::app.asiye.cloud/track.html is not configured (HTTP $code). New secure shares use asiye-80386.web.app instead."
          fi

      - name: Verify public tracking API rejects invalid requests safely
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/share.json -w '%{http_code}'             https://us-central1-asiye-80386.cloudfunctions.net/getTripShare)
          test "$code" = "400"
          grep -q 'Invalid live tracking link' /tmp/share.json

      - name: Verify authenticated endpoints reject GET
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in createTripShareToken joinClubPoolSecure; do
            code=$(curl -sS -o /tmp/${endpoint}.json -w '%{http_code}'               "https://us-central1-asiye-80386.cloudfunctions.net/${endpoint}")
            test "$code" = "405"
          done
