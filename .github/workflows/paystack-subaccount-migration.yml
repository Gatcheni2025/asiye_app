name: Paystack subaccount migration safety check
on:
  push:
    branches: ['fix/paystack-subaccounts-cash-card-no-wallet']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify actual Android 341 and uploaded iOS release ancestry
        run: bash scripts/verify_payment_release_341_lineage.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks for finance and passenger pages
        run: |
          node --check functions/index.js
          node --check functions/club-lifecycle.js
          node --check functions/parcel-security.js
          node --check functions/paystack-subaccount-split.js
          node --check functions/paystack-payment-safety.js
          node --check scripts/paystack_technical_readiness.cjs
          node --check scripts/verify_paystack_staging.cjs
          node --check assets/passenger-v2/js/app.js
          node --check assets/passenger-v2/js/state.js
          node --check assets/passenger-v2/js/club.js
          node --check assets/passenger-v2/js/parcels.js
          node --check assets/passenger-v2/js/wallet.js
          node --check assets/passenger-v2/js/ride-controller.js
          node --check assets/driver-v2/js/requests.js
          node --check assets/driver-v2/js/trip-controller.js
          node --check assets/member-pages.js
      - name: New Paystack 80/20 and no-wallet regression checks
        run: node --test test/paystack-subaccount-migration.test.cjs test/paystack-payment-safety.test.cjs
      - name: Full simulated Go Work Parcel Paystack charge flow
        run: node --test test/paystack-card-journey-simulation.test.cjs
      - name: Server-secured Parcel PIN and Paystack journey tests
        run: node --test test/parcel-security.test.cjs
      - name: Driver-first Parcel and Work payment regressions
        run: node --test test/driver-first-card-booking.test.cjs
      - name: Existing booking PIN and commission regressions
        run: node --test test/go-continuation.test.cjs test/club-lifecycle.test.cjs test/card-booking-sequence.test.cjs test/go-fare-settlement-lifecycle.test.cjs
      - name: Compliance release gate
        run: |
          echo "This workflow does not deploy any Firebase functions or build public apps."
          echo "Paystack merchant activation, driver subaccount verification, live-device integration, cash/card UI, legacy outstanding balances and settlements need sign-off before deployment."
