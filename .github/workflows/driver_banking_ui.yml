name: Driver banking phone layouts
on:
  push:
    branches: ['fix/paystack-subaccounts-cash-card-no-wallet']
    paths: ['.github/workflows/driver_banking_ui.yml', 'test/security/driver-banking-layout.cjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-layouts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix test/security install --no-audit --no-fund
      - working-directory: test/security
        run: npx playwright install --with-deps chromium --only-shell
      - run: node test/security/driver-banking-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asiye-driver-banking-phone-layouts
          path: banking-layout/
          if-no-files-found: warn
          retention-days: 14
